[workspace]
members = [
    "virtues-core",
    "crates/virtues-helpers",
    "crates/virtues-iroh",
    "crates/virtues-protocol",
    "crates/virtues-registry",
    "actions",
    "apps/desktop",
    "services/virtues-api",
    "services/virtues-atlas",
    "tools/virtues-installer",
]
# The Tauri desktop app is a standalone crate built by the `tauri` CLI, with
# its own Cargo.lock and release profile (panic=abort, lto). It must NOT be a
# workspace member, or `cargo metadata` (which the tauri CLI runs) fails.
exclude = [
    "apps/web/src-tauri",
    # Throwaway iroh evaluation crate — own Cargo.lock, kept out of the main
    # build so iroh's dep tree can't destabilize it during the spike.
    "spike-iroh",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Virtues Team <team@virtues.com>"]
license = "MIT"
repository = "https://github.com/virtues-os/virtues"

[profile.release]
opt-level = 3
lto = "thin"

# Faster-compiling profile for staging/test builds: drops LTO and eases the
# optimizer so CI turns around quicker. Runtime is marginally slower than
# `release` (negligible for this I/O- and network-bound workload), so it's only
# used for `*-staging.*` tags — production `v*` tags still build `release`.
# release-linux.yml selects this via `--profile staging` (CARGO_PROFILE env).
[profile.staging]
inherits = "release"
opt-level = 2
lto = false

[profile.dev]
opt-level = 0

[profile.test]
opt-level = 0
