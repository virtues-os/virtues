[workspace]
members = [
    "virtues-core",
    "crates/virtues-helpers",
    "crates/virtues-improv",
    "crates/virtues-iroh",
    "crates/virtues-iroh-ffi",
    "crates/virtues-reach-client",
    "crates/virtues-registry",
    "crates/virtues-qnnd",
    "applets",
    "apps/desktop",
    "services/virtues-api",
    "services/virtues-atlas",
    "tools/virtues-installer",
]
# The Tauri desktop app is a standalone crate built by the `tauri` CLI, with
# its own Cargo.lock and release profile (panic=abort, lto). It must NOT be a
# workspace member, or `cargo metadata` (which the tauri CLI runs) fails.
exclude = [
    "apps/web/src-tauri",
    # Local Tauri mobile plugins, path-deps of the excluded src-tauri crate —
    # must be excluded too so `cargo metadata` (run by the tauri CLI) resolves.
    "apps/web/plugins/location-probe",
    "apps/web/plugins/reach",
    "apps/web/plugins/health",
    "apps/web/plugins/eventkit",
    "apps/web/plugins/contacts",
    "apps/web/plugins/finance",
    "apps/web/plugins/audio",
    # Build-dep of every plugin above (the COMMANDS lockstep enforcer).
    "apps/web/plugins/lockstep",
    # Throwaway iroh evaluation crate — own Cargo.lock, kept out of the main
    # build so iroh's dep tree can't destabilize it during the spike.
    "spike-iroh",
]
resolver = "2"

[workspace.package]
# THE box version. Single source of truth — `virtues-core` and the installer
# inherit it with `version.workspace = true`, so there is one number to bump.
#
# Reset from 0.3.0 to 0.1.0 on 2026-08-17, before the first unit ships. Nothing
# has ever shipped to anyone, so the history is ours to define, and starting the
# product at 0.1.0 says that honestly. It also repairs the prerelease line:
# `v0.1.0-staging.N` tags sort BELOW `v0.1.0` exactly as semver intends, where
# against 0.3.0 they read as ancient.
#
# Internal crates (reach-client, registry, improv, the Tauri plugins) keep their
# own 0.1.0 and are not part of this — they are unpublished libraries whose
# numbers nobody reads. The Mac app is deliberately separate too: it is on its
# own 1.0.x line under `mac-v*` tags, and an app version must never move
# backwards or updaters stop seeing later builds as newer.
version = "0.1.0"
edition = "2021"
authors = ["Virtues Team <team@virtues.com>"]
license = "MIT"
repository = "https://github.com/virtues-os/virtues"

[profile.release]
opt-level = 3
lto = "thin"

# Faster-compiling profile for staging/test builds: drops LTO and eases the
# optimizer so CI turns around quicker. Runtime is marginally slower than
# `release` (negligible for this I/O- and network-bound workload), so it's only
# used for `*-staging.*` tags — production `v*` tags still build `release`.
# release-linux.yml selects this via `--profile staging` (CARGO_PROFILE env).
[profile.staging]
inherits = "release"
opt-level = 2
lto = false

[profile.dev]
opt-level = 0

[profile.test]
opt-level = 0
