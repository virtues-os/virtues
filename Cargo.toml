[workspace]
members = [
    "virtues-core",
    "crates/virtues-helpers",
    "crates/virtues-wg",
    "crates/virtues-registry",
    "actions",
    "apps/installer",
    "services/virtues-api",
    "services/atlas",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Virtues Team <team@virtues.com>"]
license = "MIT"
repository = "https://github.com/virtues-os/virtues"

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev]
opt-level = 0

[profile.test]
opt-level = 0
