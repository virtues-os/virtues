[[source]]
id = "plaid"
display_name = "Banks"
icon = "ri:bank-card-line"
description = "Spending, balances and investments, through Plaid."
auth = { kind = "via_proxy", start_path = "/plaid/start" }
# Plaid bills a monthly fee per linked bank until it is removed, so a box
# whose subscription has lapsed for 30 days lets its banks go.
release_on_lapse = true

# PAT, not OAuth: the GitHub OAuth proxy app is dead, and a fine-grained token
# with read-only scopes is the better fit for a personal appliance anyway.
[[source]]
id = "github"
display_name = "GitHub"
icon = "ri:github-fill"
description = "The repositories you star."
auth = { kind = "api_key", fields = ["token"] }

# Meeting tools, each with a key the person makes in the tool. A meeting is
# one row in the transcript record beside the iPhone's audio
# (`transcript::MEETING_TABLE`). Fathom's key also reads meetings shared with
# the person's team, so the sync keeps only meetings they recorded or were
# invited to, by their email.
[[source]]
id = "fathom"
display_name = "Fathom"
icon = "ri:chat-voice-line"
description = "Your meetings, with transcripts, summaries and action items."
auth = { kind = "api_key", fields = ["api_key", "email"] }

[[source]]
id = "fireflies"
display_name = "Fireflies.ai"
icon = "ri:chat-voice-line"
