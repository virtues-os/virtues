# Source catalog.
#
# This file holds only `[[source]]` rows — the catalog of providers a user can
# connect (one tile per source on the Sources page). Action definitions
# moved to per-folder manifests at `actions/<name>/manifest.toml` (see
# ARCHITECTURE.md). On startup, `core::action_templates::reconcile_templates`
# globs every per-folder manifest, merges with the source catalog, and upserts
# into `app_actions`.

[[source]]
id = "ios"
display_name = "iPhone"
icon = "ri:smartphone-line"
description = "Health, places, audio, calendar and contacts from your phone."
auth = { kind = "self_issued_bearer" }
# Read-the-code pointer, not an install path: the app arrives through the App
# Store and updates itself. See agents/record/sources-packages.md (P1).
repo = "https://github.com/virtues-os/virtues"
repo_ref = "apps/web/src-tauri"

[[source]]
id = "mac"
display_name = "Mac"
icon = "ri:macbook-line"
description = "Messages, apps and browsing from your Mac."
auth = { kind = "self_issued_bearer" }
# The collector daemon that reads this Mac. Same caveat as iOS — it ships as a
# signed binary and updates itself; this is so you can read what it does.
repo = "https://github.com/virtues-os/virtues"
repo_ref = "apps/mac-source"

[[source]]
id = "google"
display_name = "Google"
icon = "ri:google-fill"
description = "Your mail and calendar."
auth = { kind = "via_proxy", start_path = "/google/start" }

[[source]]
id = "notion"
display_name = "Notion"
icon = "ri:notion-fill"
description = "Your pages and databases."
auth = { kind = "via_proxy", start_path = "/notion/start" }

[[source]]
id = "strava"
display_name = "Strava"
icon = "ri:run-line"
description = "Your runs, rides and swims."
auth = { kind = "via_proxy", start_path = "/strava/start" }

[[source]]
id = "plaid"
display_name = "Banks"
icon = "ri:bank-card-line"
description = "Spending, balances and investments, through Plaid."
auth = { kind = "via_proxy", start_path = "/plaid/start" }
# Plaid bills a monthly fee per linked bank until it is removed, so a box
# whose subscription has lapsed for 30 days lets its banks go.
release_on_lapse = true

# Session cookies, not OAuth: X has no read API for your own bookmarks that a
# personal appliance can use (the v2 endpoint caps at ~800 and paginates
# unreliably), so this replays the same authenticated GraphQL call the web
# client makes. The two values are the session: `auth_token` (the login) and
# `ct0` (the CSRF token, sent back as `x-csrf-token`). A spike proved the box
# can replay this from its own IP with nothing else — no `x-client-transaction-id`,
# no `cf_clearance` (agents/record/bookmarks.md). Pasted for now; a
# collector that harvests both from the browser cookie store is the same secret
# by another door.
[[source]]
id = "x"
display_name = "X"
icon = "ri:twitter-x-fill"
description = "The posts you bookmark."
auth = { kind = "api_key", fields = ["auth_token", "ct0"] }
# Logging in inside the app's browser window fills both fields from its cookie
# jar (agents/record/webkit-agent-spike.md). Pasting them stays the fallback.
login = { url = "https://x.com/i/flow/login", cookies = ["auth_token", "ct0"] }

# One-time import (NOT a living/cron'd source): the user uploads an export file
# which is parsed box-side and ingested once. Claude and ChatGPT only: Gemini's
# Takeout export has not been checked against a real file. Modeled as a source so it gets a
# catalog tile + uniform dedup; its action is manual-trigger only (no cron).
[[source]]
id = "chat_import"
display_name = "Past chats"
icon = "ri:chat-history-line"
description = "From a Claude or ChatGPT export."
auth = { kind = "api_key", fields = [] }
