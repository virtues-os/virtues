# Session cookies, not OAuth: X has no read API for your own bookmarks that a
# personal appliance can use (the v2 endpoint caps at ~800 and paginates
# unreliably), so this replays the same authenticated GraphQL call the web
# client makes. The two values are the session: `auth_token` (the login) and
# `ct0` (the CSRF token, sent back as `x-csrf-token`). A spike proved the box
# can replay this from its own IP with nothing else — no `x-client-transaction-id`,
# no `cf_clearance` (agents/record/bookmarks.md). Pasted for now; a
# collector that harvests both from the browser cookie store is the same secret
# by another door.
[[source]]
id = "x"
display_name = "X"
icon = "ri:twitter-x-fill"
description = "The posts you bookmark."
auth = { kind = "api_key", fields = ["auth_token", "ct0"] }
# Logging in inside the app's browser window fills both fields from its cookie
# jar (agents/record/webkit-agent-spike.md). Pasting them stays the fallback.
login = { url = "https://x.com/i/flow/login", cookies = ["auth_token", "ct0"] }

# Session cookies, like X: Instagram has no read API for your own saved posts,
# so this replays the same authenticated call the web app makes for its Saved
# feed. The whole cookie jar is the credential — the login `sessionid`, the
# `csrftoken` (echoed in the `x-csrftoken` header), plus the device cookies the
# server checks. A spike proved the box replays it (200 from the box's own IP);
# whether `x-ig-www-claim` is also required is unresolved. Only `cookies` is
# asked for — the connect form makes every field required, and that header is
# painful to find by hand. If it proves necessary, the collector harvest (which
# sees the live request) supplies it as an optional `www_claim` secret the
# applet already reads. Each saved post's image is copied into Drive (its CDN
# URL expires), so the image pass can read it (agents/record/bookmarks.md).
[[source]]
id = "instagram"
display_name = "Instagram"
icon = "ri:instagram-line"
description = "The posts you save."
auth = { kind = "api_key", fields = ["cookies"] }
# The whole jar is the credential, so a login hands over every instagram.com
# cookie once the two that mean "logged in" exist.
login = { url = "https://www.instagram.com/accounts/login/", cookies = ["sessionid", "csrftoken"], jar_field = "cookies" }

# One-time import (NOT a living/cron'd source): the user uploads an export file
# which is parsed box-side and ingested once. Claude and ChatGPT only: Gemini's
# Takeout export has not been checked against a real file. Modeled as a source so it gets a
# catalog tile + uniform dedup; its action is manual-trigger only (no cron).
[[source]]
id = "chat_import"
display_name = "Past chats"
icon = "ri:chat-history-line"
description = "From a Claude or ChatGPT export."
auth = { kind = "api_key", fields = [] }

# Data downloads, brought in like Past chats: the owner requests the file from
# the service and uploads it (`server::api::imports`). Spotify can also add
# recent plays between downloads through an app the owner makes at Spotify
# (`virtues_helpers::auth::own_app`), which makes a `spotify` credential that
# `spotify-recent-sync` reads. Declared api_key with
# no fields for the same reason as Past chats; the app opens the import card
# for these ids.
[[source]]
id = "spotify"
display_name = "Spotify"
icon = "ri:music-2-line"
description = "Everything you've played, from a data download, and what you play next."
auth = { kind = "api_key", fields = [] }

