<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Home</title>
<link rel="stylesheet" href="virtues.css" />
<style>
	:root {
		--sans: "Avenir Next", Avenir, -apple-system, BlinkMacSystemFont, sans-serif;
		--serif: "EB Garamond", Garamond, Georgia, serif;
		--ink-soft: var(--color-foreground-subtle);
		--hover: color-mix(in srgb, var(--color-foreground) 6%, transparent);
		--rule: color-mix(in srgb, var(--color-foreground) 9%, transparent);
	}
	html, body { font-family: var(--sans); font-size: 13px; }
	main { max-width: 1040px; margin: 0 auto; padding: 48px 32px 64px; }

	header { margin-bottom: 28px; }
	h1 { font: 400 30px/1.2 var(--serif); margin: 0 0 4px; }
	.sub { color: var(--ink-soft); margin: 0; }

	.actions { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 32px; }
	.actions button {
		font: inherit; color: var(--color-foreground); background: none;
		border: 1px solid var(--rule); border-radius: 999px;
		padding: 5px 12px; cursor: pointer;
	}
	.actions button:hover { background: var(--hover); }

	.grid {
		display: grid; gap: 16px;
		grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
	}
	section {
		border: 1px solid var(--rule); border-radius: 12px;
		padding: 14px 16px 12px; min-height: 120px;
	}
	section h2 {
		font: 400 12px/1.4 var(--sans); color: var(--ink-soft);
		margin: 0 0 8px; display: flex; justify-content: space-between;
	}
	section h2 a { color: inherit; text-decoration: none; cursor: pointer; }
	section h2 a:hover { color: var(--color-foreground); }

	ul { list-style: none; margin: 0; padding: 0; }
	li {
		display: flex; gap: 10px; align-items: baseline;
		padding: 4px 6px; margin: 0 -6px; border-radius: 6px;
	}
	li.link { cursor: pointer; }
	li.link:hover { background: var(--hover); }
	.when { color: var(--ink-soft); font-variant-numeric: tabular-nums; flex: none; min-width: 64px; }
	.what { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.serif { font: 400 14px/1.4 var(--serif); }
	.meta { color: var(--ink-soft); flex: none; }
	.empty { color: var(--ink-soft); padding: 4px 0; }

	.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
	.stat .n { font: 400 26px/1.1 var(--serif); font-variant-numeric: tabular-nums; }
	.stat .l { color: var(--ink-soft); }

	.bar { height: 4px; border-radius: 2px; background: var(--rule); margin-top: 3px; }
	.bar i { display: block; height: 100%; border-radius: 2px; background: var(--color-foreground); opacity: .55; }
	.app { display: block; }
	.app .row { display: flex; justify-content: space-between; gap: 10px; }
</style>
</head>
<body>
<main>
	<header>
		<h1 id="date"></h1>
		<p class="sub" id="greeting"></p>
	</header>

	<nav class="actions">
		<button data-open="/">New chat</button>
		<button data-open="/day">Today</button>
		<button data-open="/timeline">Timeline</button>
		<button data-open="/tasks">Tasks</button>
		<button data-open="/page">Pages</button>
		<button data-open="/wiki">Wiki</button>
	</nav>

	<!-- Each card is one query and one renderer, below. Add, drop or reorder
	     them freely: a card that fails says so and leaves the rest alone. -->
	<div class="grid">
		<section data-card="calendar"><h2>Calendar</h2><div class="body"></div></section>
		<section data-card="tasks"><h2><span>Tasks</span><a data-open="/tasks">All</a></h2><div class="body"></div></section>
		<section data-card="pages"><h2><span>Pages</span><a data-open="/page">All</a></h2><div class="body"></div></section>
		<section data-card="body"><h2>Body</h2><div class="body"></div></section>
		<section data-card="screen"><h2>Time on screens</h2><div class="body"></div></section>
		<section data-card="timeline"><h2><span>Today so far</span><a data-open="/day">Day</a></h2><div class="body"></div></section>
		<section data-card="stories"><h2><span>Stories</span><a data-open="/wiki/stories">All</a></h2><div class="body"></div></section>
	</div>
</main>

<script src="virtues.js"></script>
<script>
"use strict";

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
	({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

function fmtMinutes(m) {
	m = Math.round(m || 0);
	const h = Math.floor(m / 60);
	return h ? `${h}h ${m % 60}m` : `${m}m`;
}

const empty = (text) => `<p class="empty">${esc(text)}</p>`;

function list(rows, item) {
	return `<ul>${rows.map(item).join("")}</ul>`;
}

// ── cards ────────────────────────────────────────────────────────────────
// sql: one read-only query (the box runs it in your timezone, so
// current_date is your today). render: rows → HTML.

const CARDS = {
	calendar: {
		sql: `SELECT title, is_all_day,
		             to_char(started_at, 'HH24:MI') AS at,
		             started_at < now() AND ended_at > now() AS is_now
		      FROM data_calendar_event
		      WHERE started_at::date = current_date AND NOT is_archived
		        AND coalesce(status, '') <> 'cancelled'
		      ORDER BY is_all_day DESC, started_at LIMIT 8`,
		render: (rows) => rows.length
			? list(rows, (r) => `<li><span class="when">${r.is_all_day ? "All day" : esc(r.at)}</span>
				<span class="what">${esc(r.title || "Untitled event")}</span>
				${r.is_now ? '<span class="meta">Now</span>' : ""}</li>`)
			: empty("Nothing on your calendar today."),
	},

	tasks: {
		sql: `SELECT title, to_char(due_on, 'Mon DD') AS due, due_on < current_date AS is_late
		      FROM app_tasks
		      WHERE status IN ('open', 'active') AND assignee = 'owner'
		      ORDER BY due_on NULLS LAST, sort_order LIMIT 7`,
		render: (rows) => rows.length
			? list(rows, (r) => `<li class="link" data-open="/tasks"><span class="what">${esc(r.title)}</span>
				${r.due ? `<span class="meta">${r.is_late ? "Late · " : ""}${esc(r.due)}</span>` : ""}</li>`)
			: empty("No open tasks."),
	},

	pages: {
		sql: `SELECT id, coalesce(nullif(btrim(title), ''), 'Untitled') AS title,
		             to_char(updated_at, 'Mon DD') AS edited
		      FROM app_pages
		      WHERE deleted_at IS NULL AND kind = 'page'
		      ORDER BY updated_at DESC LIMIT 6`,
		render: (rows) => rows.length
			? list(rows, (r) => `<li class="link" data-open="/page/${encodeURIComponent(r.id)}">
				<span class="what serif">${esc(r.title)}</span><span class="meta">${esc(r.edited)}</span></li>`)
			: empty("No pages yet."),
	},

	body: {
		sql: `SELECT
		        (SELECT coalesce(sum(step_count), 0) FROM data_health_steps
		          WHERE occurred_at::date = current_date AND NOT is_archived) AS steps,
		        (SELECT duration_minutes FROM data_health_sleep
		          WHERE ended_at::date = current_date AND NOT is_archived
		          ORDER BY duration_minutes DESC NULLS LAST LIMIT 1) AS sleep_minutes`,
		render: ([r]) => `<div class="stats">
			<div class="stat"><div class="n">${Number(r.steps).toLocaleString()}</div><div class="l">Steps today</div></div>
			<div class="stat"><div class="n">${r.sleep_minutes == null ? "–" : fmtMinutes(r.sleep_minutes)}</div><div class="l">Sleep last night</div></div>
		</div>`,
	},

	screen: {
		sql: `SELECT app_name,
		             sum(extract(epoch FROM (coalesce(ended_at, now()) - started_at))) / 60 AS minutes
		      FROM data_activity_app_session
		      WHERE started_at::date = current_date AND NOT is_archived
		      GROUP BY app_name ORDER BY minutes DESC LIMIT 5`,
		render: (rows) => {
			if (!rows.length) return empty("No screen time recorded today.");
			const total = rows.reduce((t, r) => t + Number(r.minutes), 0);
			const top = Number(rows[0].minutes) || 1;
			return `<div class="stats" style="margin-bottom:10px"><div class="stat">
					<div class="n">${fmtMinutes(total)}</div><div class="l">In your top apps</div></div></div>
				${rows.map((r) => `<div class="app"><div class="row">
					<span class="what">${esc(r.app_name || "Unknown app")}</span>
					<span class="meta">${fmtMinutes(r.minutes)}</span></div>
					<div class="bar"><i style="width:${(100 * Number(r.minutes) / top).toFixed(1)}%"></i></div></div>`).join("")}`;
		},
	},

	timeline: {
		sql: `SELECT to_char(e.started_at, 'HH24:MI') AS at,
		             coalesce(e.user_label, e.auto_label) AS label,
		             coalesce(e.user_location, e.auto_location) AS place
		      FROM wiki_events e JOIN wiki_days d ON d.id = e.day_id
		      WHERE d.date = current_date AND NOT e.user_hidden AND NOT e.is_sleep
		      ORDER BY e.started_at LIMIT 10`,
		render: (rows) => rows.length
			? list(rows, (r) => `<li class="link" data-open="/day"><span class="when">${esc(r.at)}</span>
				<span class="what">${esc(r.label || r.place || "Untitled")}</span></li>`)
			: empty("Nothing on the timeline yet today."),
	},

	stories: {
		sql: `SELECT title, summary FROM wiki_stories
		      ORDER BY coalesce(ended_at, started_at) DESC NULLS LAST, updated_at DESC LIMIT 4`,
		render: (rows) => rows.length
			? list(rows, (r) => `<li class="link" data-open="/wiki/stories"><span class="what serif">${esc(r.title)}</span></li>`)
			: empty("No stories yet."),
	},
};

async function loadCard(el) {
	const card = CARDS[el.dataset.card];
	const body = el.querySelector(".body");
	if (!card) return;
	try {
		body.innerHTML = card.render(await virtues.query(card.sql));
	} catch (e) {
		body.innerHTML = empty("This card could not load.");
		console.warn(el.dataset.card, e);
	}
}

// ── header ───────────────────────────────────────────────────────────────

function header() {
	const now = new Date();
	document.getElementById("date").textContent =
		now.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
	const h = now.getHours();
	document.getElementById("greeting").textContent =
		h < 5 ? "Good night." : h < 12 ? "Good morning." : h < 18 ? "Good afternoon." : "Good evening.";
}

document.addEventListener("click", (e) => {
	const target = e.target.closest("[data-open]");
	if (target) virtues.open(target.dataset.open);
});

function refresh() {
	header();
	document.querySelectorAll("[data-card]").forEach(loadCard);
}

refresh();
// Once a minute is enough for a desk; nothing here changes faster.
setInterval(refresh, 60_000);
</script>
</body>
</html>
