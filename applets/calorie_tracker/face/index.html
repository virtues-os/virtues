<!doctype html>
<html>
<head>
	<meta charset="utf-8" />
	<title>Calorie Tracker</title>
	<link rel="stylesheet" href="virtues.css" />
	<style>
		body {
			max-width: 34rem;
			margin: 0 auto;
			padding: 1.5rem 1.25rem 2.5rem;
		}
		h1 {
			font-size: 0.75rem;
			font-weight: 500;
			letter-spacing: 0.06em;
			text-transform: uppercase;
			color: var(--color-foreground-subtle);
			margin: 0 0 1.25rem;
		}
		.total {
			display: flex;
			align-items: baseline;
			gap: 0.5rem;
		}
		.kcal {
			font-size: 2.75rem;
			line-height: 1;
			font-variant-numeric: tabular-nums;
			letter-spacing: -0.02em;
		}
		.unit {
			font-size: 0.875rem;
			color: var(--color-foreground-subtle);
		}
		/* The honest line. A total assembled from guesses is not a
		   measurement, and a tracker that renders one clean number is telling
		   you something it does not know. */
		.caveat {
			margin: 0.375rem 0 0;
			font-size: 0.75rem;
			color: var(--color-foreground-subtle);
		}
		.protein {
			margin-top: 0.25rem;
			font-size: 0.8125rem;
			color: var(--color-foreground-muted);
			font-variant-numeric: tabular-nums;
		}
		ul {
			list-style: none;
			padding: 0;
			margin: 1.75rem 0 0;
		}
		li {
			display: flex;
			align-items: baseline;
			gap: 0.625rem;
			padding: 0.5rem 0;
			border-top: 1px solid var(--color-border-subtle, var(--color-border));
			font-size: 0.875rem;
		}
		.item { flex: 1; min-width: 0; }
		.qty { color: var(--color-foreground-subtle); font-size: 0.8125rem; }
		.n {
			font-variant-numeric: tabular-nums;
			color: var(--color-foreground-muted);
			flex-shrink: 0;
		}
		/* An estimate is marked, every time it appears. */
		.n.est::after {
			content: '~';
			margin-left: 1px;
			color: var(--color-foreground-subtle);
		}
		.n.unknown {
			color: var(--color-foreground-subtle);
			font-style: italic;
		}
		.when { font-size: 0.75rem; color: var(--color-foreground-subtle); flex-shrink: 0; }
		.empty {
			margin-top: 2rem;
			font-family: Georgia, serif;
			font-style: italic;
			font-size: 0.875rem;
			line-height: 1.6;
			color: var(--color-foreground-subtle);
		}
		.empty code {
			font-style: normal;
			font-size: 0.8125rem;
		}
		.week {
			display: flex;
			gap: 3px;
			margin-top: 1.75rem;
			align-items: flex-end;
			height: 2.5rem;
		}
		.week span {
			flex: 1;
			background: var(--color-foreground-subtle);
			opacity: 0.35;
			border-radius: 1px;
			min-height: 2px;
		}
		.week span.today { opacity: 0.8; }
		.week-label {
			margin-top: 0.375rem;
			font-size: 0.6875rem;
			color: var(--color-foreground-subtle);
		}
	</style>
</head>
<body>
	<h1>Today</h1>
	<div id="head"></div>
	<ul id="list"></ul>
	<div id="week"></div>

	<script src="virtues.js"></script>
	<script>
		const head = document.getElementById('head');
		const list = document.getElementById('list');
		const weekEl = document.getElementById('week');

		const esc = (s) =>
			String(s ?? '').replace(/[&<>"']/g, (c) =>
				({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])
			);

		const time = (iso) => {
			const d = new Date(iso);
			return isNaN(d) ? '' : d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
		};

		(async () => {
			let rows = [];
			try {
				rows = await virtues.query(
					"SELECT item, quantity, kcal, protein_g, confidence, eaten_at \
					   FROM applet_calorie_tracker.entries \
					  WHERE eaten_at >= date_trunc('day', now()) \
					  ORDER BY eaten_at DESC"
				);
			} catch {
				// The table does not exist until the applet has been reconciled
				// once. Say so plainly rather than rendering a broken zero.
				head.innerHTML =
					'<p class="empty">Nothing here yet — this tracker has not been set up on this box.</p>';
				return;
			}

			if (!rows.length) {
				head.innerHTML =
					'<p class="empty">Nothing logged today.<br />Tell it what you ate on its page — ' +
					'<code>two eggs and toast</code> — and it will keep the count.</p>';
			} else {
				const known = rows.filter((r) => r.kcal != null);
				const total = known.reduce((n, r) => n + r.kcal, 0);
				const protein = rows.reduce((n, r) => n + (r.protein_g ?? 0), 0);
				const estimated = known.filter((r) => r.confidence === 'estimated').length;
				const unknown = rows.length - known.length;

				// Say what the number is made of. "1,240 kcal" alone implies a
				// precision that a parsed sentence does not have.
				const parts = [`${rows.length} ${rows.length === 1 ? 'entry' : 'entries'}`];
				if (estimated) parts.push(`${estimated} estimated`);
				if (unknown) parts.push(`${unknown} without a number`);

				head.innerHTML =
					'<div class="total"><span class="kcal">' +
					total.toLocaleString() +
					'</span><span class="unit">kcal</span></div>' +
					'<p class="caveat">' + esc(parts.join(' · ')) + '</p>' +
					(protein ? '<p class="protein">' + protein + ' g protein</p>' : '');

				list.innerHTML = rows
					.map((r) => {
						const n =
							r.kcal == null
								? '<span class="n unknown">not counted</span>'
								: '<span class="n' +
								  (r.confidence === 'estimated' ? ' est' : '') +
								  '">' + r.kcal + '</span>';
						return (
							'<li><span class="item">' + esc(r.item) +
							(r.quantity ? ' <span class="qty">' + esc(r.quantity) + '</span>' : '') +
							'</span>' + n +
							'<span class="when">' + esc(time(r.eaten_at)) + '</span></li>'
						);
					})
					.join('');
			}

			// Seven days of shape, so a single day has something to sit against.
			try {
				const days = await virtues.query(
					"SELECT date_trunc('day', eaten_at)::date AS d, COALESCE(SUM(kcal), 0)::int AS kcal \
					   FROM applet_calorie_tracker.entries \
					  WHERE eaten_at >= date_trunc('day', now()) - interval '6 days' \
					  GROUP BY d ORDER BY d"
				);
				if (days.length > 1) {
					const max = Math.max(...days.map((d) => d.kcal), 1);
					const today = new Date().toISOString().slice(0, 10);
					weekEl.innerHTML =
						'<div class="week">' +
						days
							.map(
								(d) =>
									'<span class="' + (String(d.d).slice(0, 10) === today ? 'today' : '') +
									'" style="height:' + Math.round((d.kcal / max) * 100) + '%" ' +
									'title="' + esc(d.d) + ': ' + d.kcal + ' kcal"></span>'
							)
							.join('') +
						'</div><p class="week-label">last 7 days</p>';
				}
			} catch {}
		})();
	</script>
</body>
</html>
