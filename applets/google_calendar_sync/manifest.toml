name = "Google Calendar"
description = "Keeps your Google Calendar events here."
owner = "system"
command = ["google_calendar_sync"]
triggers = ["cron", "manual"]
schedule = "0 */15 * * * *"
per_credential = true
source = { id = "google" }

# Ontologies this applet writes — drives "what would fill this stream".
writes = ["calendar_event"]
