name = "Grok Chats"
description = "Keeps a copy of your Grok chats with your other AI conversations."
owner = "system"
command = ["grok_chats_sync"]
triggers = ["cron", "manual"]
# Twice a day, 09:00 and 21:00 box-local, like X bookmarks. A chat from this
# morning showing up tonight is soon enough, and fewer runs look less like a bot.
schedule = "0 0 9,21 * * *"
per_credential = true
source = { id = "grok" }

# Ontologies this applet writes — drives "what would fill this stream".
writes = ["content_conversation"]
