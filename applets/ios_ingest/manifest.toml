name = "iOS Ingest"
description = "Receives everything your iPhone collects — health, location, calendar, contacts, audio, and finance."
owner = "system"
command = ["ios_ingest"]
triggers = ["webhook"]
per_credential = true
source = { id = "ios" }

# Ontologies this applet writes — drives "what would fill this stream".
writes = ["calendar_event", "communication_transcription", "financial_account", "financial_transaction", "health_heart_rate", "health_hrv", "health_sleep", "health_steps", "health_workout", "location_point"]
