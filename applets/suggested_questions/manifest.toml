name = "Suggested Questions"
description = "Writes the question a new chat offers you, from what changed in your day."
owner = "system"
command = ["suggested_questions"]
triggers = ["cron", "manual"]
schedule = "0 5 * * * *"

# Below every top-level key: TOML binds each key after a table header to
# that table.
[config.limits]
# The most this applet may spend in a rolling day. About a hundred runs on
# the Standard model it uses today; a ceiling should that model get dearer.
max_llm_cost_per_day = 0.25
