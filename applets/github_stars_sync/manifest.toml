name = "GitHub Stars"
description = "Sync starred repositories into bookmarks."
owner = "system"
runtime = "function"
command = ["github_stars_sync"]
triggers = ["cron", "manual"]
default_cron = "0 15/30 * * * *"
per_credential = true
source = { id = "github" }

# Ontologies this applet writes — drives "what would fill this stream".
writes = ["content_bookmark"]
