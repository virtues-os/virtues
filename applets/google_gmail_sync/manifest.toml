name = "Google Mail"
description = "Keeps your Gmail here."
owner = "system"
runtime = "function"
command = ["google_gmail_sync"]
triggers = ["cron", "manual"]
default_cron = "0 */15 * * * *"
per_credential = true
source = { id = "google" }

# Ontologies this applet writes — drives "what would fill this stream".
writes = ["communication_email"]
