name = "Strava Activities"
description = "Brings in your runs, rides, swims, and other workouts from Strava."
owner = "system"
command = ["strava_activities_sync"]
triggers = ["cron", "manual"]
schedule = "0 */30 * * * *"
per_credential = true
source = { id = "strava" }

# Ontologies this applet writes — drives "what would fill this stream".
writes = ["health_workout"]
