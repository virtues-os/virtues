<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Dot Cloud</title>
<style>
	html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
	canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="virtues.js"></script>
<script>
// Dot Cloud — the "star cloud" ambient viz, ported from the handoff spec.
//
// A field of white background stars plus one colored star per thing the
// day was spent with — a chat, a place, an app, a workout: a sharp
// category-colored pin under a large soft additive halo, both scaled by
// how much of the day that thing took, so a day of many small things
// paints a dense field and a day of a few big things paints a few big
// stars. Positions are a pure function of (first-seen time, category,
// seed) — same seed + same events render identically everywhere. Twinkle
// is asymmetric on purpose: symmetric reads as blinking Christmas lights,
// asymmetric reads as breathing stars.
//
// The spec's reducer/state.json contract is replaced by virtues.query —
// one UNION over the data_* ontology maps the record into the five fixed
// categories. Preset values are the tuned production preset, verbatim.

"use strict";

// ── preset (published.json, verbatim) ────────────────────────────────────
const P = {
	N_STARS: 1500,
	N_EVENT_DOTS: 4000,
	STAR_SIZE_PX: 3.1,
	STAR_SIZE_JITTER: 0.5,
	STAR_BRIGHTNESS: 1.5,
	PIN_SIZE_PX: 9.5,
	PIN_SIZE_JITTER: 0.81,
	PIN_COLOR_MIX: 1,
	PIN_BRIGHTNESS: 3.55,
	// The sharp bright center on each pin, on top of its soft disc.
	PIN_CORE_POP: 0,
	HALO_SIZE_PX: 120,
	HALO_COLOR_MIX: 0.95,
	HALO_ALPHA: 0.365,
	HALO_FALLOFF: 13,
	RANDOMIZE_POSITIONS: true,
	EDGE_BUFFER: 0,
	CLUSTER_SPREAD: 0.16,
	CENTER_RADIUS_MIN: 0.15,
	CENTER_RADIUS_MAX: 0.26,
	TW_AMP: 1,
	TW_INTERVAL_S: 10,
	TW_ASYM: 0.52,
	TW_JITTER: 0.1,
	TW_SIZE_COUP: 0.15,
	// A star's size, as a multiple of the preset pin/halo size: SCALE_MIN at
	// magnitude 0, SCALE_MAX at magnitude 1.
	SCALE_MIN: 1,
	SCALE_MAX: 4,
	// How much of a thing earns the biggest star (magnitude 1). Substituted
	// into the query below, so the tool and the panel share one definition.
	CAP_CHAT_MSGS: 50,
	CAP_AUDIO_MIN: 30,
	CAP_CALENDAR_H: 2,
	CAP_APP_H: 4,
	CAP_STEPS: 10000,
	CAP_SLEEP_H: 8,
	CAP_WORKOUT_MIN: 60,
	CAP_PLACE_H: 4,
};
// Category palette: comm, calendar, activity, health, location, unknown.
const PALETTE = ["#7ba8c9", "#d4a34a", "#c876a3", "#d18a8a", "#8ac4a3", "#e6e0d0"];
const FALLBACK_SEED = 8471293471;

// ── deterministic hashing (spec-verbatim) ────────────────────────────────
function hash2(a, b, seed = 0) {
	let h = (a | 0) ^ Math.imul(b | 0, 0x9e3779b9) ^ (seed | 0);
	h = Math.imul(h ^ (h >>> 16), 0x7feb352d);
	h = Math.imul(h ^ (h >>> 15), 0x846ca68b);
	h = h ^ (h >>> 16);
	return (h >>> 0) / 4294967296;
}
// Sum-of-uniforms ≈ Gaussian by CLT — cheap, fully deterministic. Real
// Box-Muller would look subtly different; the spec says keep this one.
function gaussHash(a, b, seed) {
	return (hash2(a, b, seed) +
		hash2(a * 3 + 7, b * 5 + 2, seed) +
		hash2(a * 5 + 3, b * 7 + 9, seed)) / 3.0 - 0.5;
}
function clampToEdges(v) { return Math.max(P.EDGE_BUFFER, Math.min(1 - P.EDGE_BUFFER, v)); }
function spreadToEdges(v) { return P.EDGE_BUFFER + v * (1 - 2 * P.EDGE_BUFFER); }

// Five hidden gravity points on a seeded ring (Mode A). The 1.4× vertical
// stretch compensates the wide canvas so clusters read circular.
function computeCategoryCenters(seed) {
	const centers = [];
	const rot = hash2(seed, 0x9e37, 0) * Math.PI * 2;
	const cx = 0.5 + (hash2(seed, 0x1111, 0) - 0.5) * 0.04;
	const cy = 0.5 + (hash2(seed, 0x2222, 0) - 0.5) * 0.04;
	for (let c = 0; c < 5; c++) {
		const a = rot + c * (Math.PI * 2 / 5);
		const rx = P.CENTER_RADIUS_MIN + hash2(seed, c + 3, 0) * (P.CENTER_RADIUS_MAX - P.CENTER_RADIUS_MIN);
		const ry = (P.CENTER_RADIUS_MIN + hash2(seed, c + 13, 0) * (P.CENTER_RADIUS_MAX - P.CENTER_RADIUS_MIN)) * 1.4;
		centers.push([
			Math.max(0.10, Math.min(0.90, cx + Math.cos(a) * rx)),
			Math.max(0.14, Math.min(0.86, cy + Math.sin(a) * ry)),
		]);
	}
	return centers;
}

// ── data → dots ──────────────────────────────────────────────────────────
// One star per row. A row is something you spent the day with — a chat, a
// place, an app, a workout — and its magnitude (0..1) is how much, which
// sets the star's scale from SCALE_MIN to SCALE_MAX. The shader derives
// brightness from the same scale, so a speck of a thing is also dim.
function buildEventDots(events, seed) {
	const centers = computeCategoryCenters(seed);
	const dots = [];
	for (let ei = events.length - 1; ei >= 0 && dots.length < P.N_EVENT_DOTS; ei--) {
		const [t, catRaw, mag] = events[ei];
		const cat = (catRaw < 0 || catRaw > 4) ? 5 : catRaw;
		const m = Math.max(0, Math.min(1, +mag || 0));
		const scale = P.SCALE_MIN + (P.SCALE_MAX - P.SCALE_MIN) * m;
		const cc = cat < 5 ? centers[cat] : [0.5, 0.5];
		let x, y;
		if (P.RANDOMIZE_POSITIONS) {
			x = spreadToEdges(hash2(t | 0, (cat | 0) * 13 + 1, seed));
			y = spreadToEdges(hash2((t | 0) + 3, (cat | 0) * 17 + 4, seed));
		} else {
			const ox = gaussHash(t | 0, (cat | 0) * 13, seed) * P.CLUSTER_SPREAD * 2.2;
			const oy = gaussHash((t | 0) + 3, (cat | 0) * 17 + 4, seed) * P.CLUSTER_SPREAD * 2.2;
			x = clampToEdges(cc[0] + ox);
			y = clampToEdges(cc[1] + oy);
		}
		dots.push(x, y, cat, scale);
	}
	return dots;
}

// Background stars render at preset scale (1.0).
function buildStars(seed) {
	const dots = [];
	for (let i = 0; i < P.N_STARS; i++) {
		dots.push(
			hash2(i * 3 + 1, seed & 0xffff, seed),
			hash2(i * 5 + 2, (seed >>> 16) & 0xffff, seed),
			5, 1.0,
		);
	}
	return dots;
}

// ── the record, as events ────────────────────────────────────────────────
// One UNION over the ontology. The face session's timezone is the home
// timezone (faces.rs sets it), so date_trunc('day', now()) is box-local
// midnight. Every branch is bounded on BOTH sides: with only a lower bound,
// expanded calendar recurrences dated decades out won the ORDER BY t DESC
// and filled all 500 slots, so a real day rendered as one uniform gold
// field.
//
// A row is something you spent the day with, not something that happened:
// a conversation, a meeting, an app, a place, the day's steps, a sleep, a
// workout. Its magnitude is how much, divided by the CAP_* preset value
// that earns the biggest star, and clamped to 1. Its time is when it first
// showed up today; the position hash keys on that. Web page visits are not
// rows of their own — they have no duration, and their time is already
// inside the browser's app row. The Mac agent logs an app session per
// focus switch, hundreds a day, which is why apps roll up per name.
//
// `{{CAP_*}}` tokens are the preset's caps; eventsSql() fills them in, and
// the dot-cloud tool's reducer fills the same tokens from published.json.
const EVENTS_SQL_TEMPLATE = `
WITH today AS (SELECT date_trunc('day', now()) AS d0, date_trunc('day', now()) + interval '1 day' AS d1)
SELECT t, cat, mag FROM (
	SELECT EXTRACT(EPOCH FROM (MIN(occurred_at) - d0))::int AS t, 0 AS cat,
			LEAST(1.0, COUNT(*)::float / {{CAP_CHAT_MSGS}}) AS mag
		FROM data_communication_message, today WHERE occurred_at >= d0 AND occurred_at < d1
		GROUP BY COALESCE(thread_id, from_identifier), d0
	UNION ALL SELECT EXTRACT(EPOCH FROM (MIN(occurred_at) - d0))::int, 0,
			LEAST(1.0, COUNT(*)::float / {{CAP_CHAT_MSGS}})
		FROM data_communication_email, today WHERE occurred_at >= d0 AND occurred_at < d1
		GROUP BY COALESCE(thread_id, from_email), d0
	UNION ALL SELECT EXTRACT(EPOCH FROM (started_at - d0))::int, 0,
			LEAST(1.0, EXTRACT(EPOCH FROM (ended_at - started_at)) / ({{CAP_AUDIO_MIN}} * 60.0))
		FROM data_audio_session, today WHERE started_at >= d0 AND started_at < d1
	UNION ALL SELECT EXTRACT(EPOCH FROM (started_at - d0))::int, 1,
			LEAST(1.0, EXTRACT(EPOCH FROM (ended_at - started_at)) / ({{CAP_CALENDAR_H}} * 3600.0))
		FROM data_calendar_event, today WHERE started_at >= d0 AND started_at < d1
	UNION ALL SELECT EXTRACT(EPOCH FROM (MIN(started_at) - d0))::int, 2,
			LEAST(1.0, SUM(EXTRACT(EPOCH FROM (ended_at - started_at))) / ({{CAP_APP_H}} * 3600.0))
		FROM data_activity_app_session, today WHERE started_at >= d0 AND started_at < d1
		GROUP BY app_name, d0
	UNION ALL SELECT EXTRACT(EPOCH FROM (MIN(occurred_at) - d0))::int, 3,
			LEAST(1.0, SUM(step_count)::float / {{CAP_STEPS}})
		FROM data_health_steps, today WHERE occurred_at >= d0 AND occurred_at < d1
		GROUP BY d0
	UNION ALL SELECT EXTRACT(EPOCH FROM (started_at - d0))::int, 3,
			LEAST(1.0, COALESCE(duration_minutes, 60) / ({{CAP_SLEEP_H}} * 60.0))
		FROM data_health_sleep, today WHERE started_at >= d0 AND started_at < d1
	UNION ALL SELECT EXTRACT(EPOCH FROM (started_at - d0))::int, 3,
			LEAST(1.0, COALESCE(duration_minutes, 30)::float / {{CAP_WORKOUT_MIN}})
		FROM data_health_workout, today WHERE started_at >= d0 AND started_at < d1
	UNION ALL SELECT EXTRACT(EPOCH FROM (MIN(started_at) - d0))::int, 4,
			LEAST(1.0, SUM(COALESCE(duration_minutes, 30)) / ({{CAP_PLACE_H}} * 60.0))
		FROM data_location_visit, today WHERE started_at >= d0 AND started_at < d1
		GROUP BY COALESCE(place_name, ROUND(latitude::numeric, 3) || ',' || ROUND(longitude::numeric, 3)), d0
) e ORDER BY t DESC LIMIT 500`;

// Caps are numbers from the preset, never strings: a token with no finite
// positive value falls back to 1 rather than producing an unparseable query.
function eventsSql() {
	return EVENTS_SQL_TEMPLATE.replace(/\{\{(CAP_[A-Z_]+)\}\}/g, (_, key) => {
		const v = Number(P[key]);
		return String(Number.isFinite(v) && v > 0 ? v : 1);
	});
}

// Per-install seed: the epoch of the record's oldest message — stable per
// box, different per life. Fallback is the spec's canonical seed.
const SEED_SQL = `
SELECT EXTRACT(EPOCH FROM MIN(occurred_at))::bigint AS s
FROM data_communication_message`;

// ── WebGL ────────────────────────────────────────────────────────────────
const VS = `#version 300 es
layout(location = 0) in float aIndex;
uniform float uTime;
uniform sampler2D uDots;
uniform vec3 uCategoryColors[6];
uniform float uSizePx;
uniform float uSizeJitter;
uniform float uBaseBrightness;
uniform float uColorMix;
uniform float uAlphaScale;
uniform float uDpr;
uniform float uTwEnabled, uTwAmp, uTwRate, uTwAsym, uTwJitter, uTwSizeCoup;
out vec3 vColor;
out float vBrightness;
float hash11(float p) {
	p = fract(p * 0.1031);
	p *= p + 33.33;
	p *= p + p;
	return fract(p);
}
// Asymmetric per-dot twinkle: rises sharply, decays slowly.
float twinkleShape(float idx, float time) {
	if (uTwEnabled < 0.5) return 0.0;
	float phase = hash11(idx * 1.31 + 3.71);
	float rateVar = mix(1.0, mix(0.35, 2.6, hash11(idx * 1.71 + 8.13)), uTwJitter);
	float t = time * uTwRate * rateVar + phase;
	float sym = pow(0.5 + 0.5 * sin(t * 6.28318), 3.0);
	float saw = fract(t);
	float rise = 1.0 - exp(-saw * 55.0);
	float decay = exp(-saw * 4.5);
	float asym = clamp(rise * decay * 1.55, 0.0, 1.0);
	return mix(sym, asym, uTwAsym);
}
void main() {
	int idx = int(aIndex);
	vec4 d = texelFetch(uDots, ivec2(idx, 0), 0);
	vec2 pos = d.rg;
	int cat = int(d.b);
	// Per-dot scale: 1.0 is the preset size. Small stars are also dim, so a
	// speck of a thing does not read as a full star of a smaller kind.
	float scale = d.a;
	gl_Position = vec4(pos.x * 2.0 - 1.0, (1.0 - pos.y) * 2.0 - 1.0, 0.0, 1.0);
	float sizeJ = mix(1.0 - uSizeJitter, 1.0 + uSizeJitter, hash11(aIndex + 0.31));
	float twShape = twinkleShape(aIndex, uTime);
	float sizeMul = 1.0 + uTwSizeCoup * uTwAmp * twShape;
	gl_PointSize = max(1.0, uSizePx * scale * sizeJ * sizeMul * uDpr);
	int ci = cat;
	if (ci < 0 || ci > 5) ci = 5;
	vColor = mix(vec3(1.0), uCategoryColors[ci], uColorMix);
	vBrightness = uBaseBrightness * mix(0.7, 1.05, hash11(aIndex + 7.7));
	vBrightness *= clamp(scale, 0.45, 1.0);
	vBrightness *= (1.0 + uTwAmp * twShape);
	vBrightness *= uAlphaScale;
}`;

// One fragment shader for halos AND pins; uFalloff + uCorePop differ per
// draw call. Premultiplied output pairs with (SRC_ALPHA, ONE).
const FS = `#version 300 es
precision highp float;
uniform float uFalloff;
uniform float uCorePop;
in vec3 vColor;
in float vBrightness;
out vec4 fragColor;
void main() {
	vec2 c = gl_PointCoord - 0.5;
	float d2 = dot(c, c);
	float a = exp(-d2 * uFalloff);
	if (uCorePop > 0.001) {
		a += exp(-d2 * 60.0) * uCorePop;
	}
	a *= vBrightness;
	fragColor = vec4(vColor * a, a);
}`;

const canvas = document.getElementById("c");
const gl = canvas.getContext("webgl2", { alpha: false, antialias: false });
if (!gl) {
	// "Never fully black": a client without WebGL2 gets a sentence, not a
	// void. (The panel and every app pane have it; this is belt and braces.)
	document.body.innerHTML =
		'<p style="color:#4a5663;font:13px system-ui;padding:2rem">' +
		"This face needs WebGL, which this screen does not have.</p>";
	throw new Error("no webgl2");
}

function compile(type, src) {
	const s = gl.createShader(type);
	gl.shaderSource(s, src);
	gl.compileShader(s);
	if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
		throw new Error(gl.getShaderInfoLog(s));
	return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
gl.useProgram(prog);
const U = {};
for (const n of ["uTime","uDots","uCategoryColors","uSizePx","uSizeJitter","uBaseBrightness","uColorMix","uAlphaScale","uDpr","uTwEnabled","uTwAmp","uTwRate","uTwAsym","uTwJitter","uTwSizeCoup","uFalloff","uCorePop"])
	U[n] = gl.getUniformLocation(prog, n);

// Palette → flat float array once.
const palette = new Float32Array(18);
PALETTE.forEach((hex, i) => {
	palette[i * 3] = parseInt(hex.slice(1, 3), 16) / 255;
	palette[i * 3 + 1] = parseInt(hex.slice(3, 5), 16) / 255;
	palette[i * 3 + 2] = parseInt(hex.slice(5, 7), 16) / 255;
});
gl.uniform3fv(U.uCategoryColors, palette);

// Index attribute: one big buffer of 0..N-1, reused by every pass.
const MAX_DOTS = 8192;
const idxBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, idxBuf);
gl.bufferData(gl.ARRAY_BUFFER, Float32Array.from({ length: MAX_DOTS }, (_, i) => i), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 1, gl.FLOAT, false, 0, 0);

// Dot data lives in a 1-row RGBA32F texture: (x, y, cat, scale).
function makeDotTexture(data) {
	const n = data.length / 4;
	const tex = gl.createTexture();
	gl.bindTexture(gl.TEXTURE_2D, tex);
	gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
	gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
	// A zero-dot upload still needs one texel of backing data or texImage2D
	// raises INVALID_OPERATION; the draw is skipped at n === 0 regardless.
	const backing = n > 0 ? new Float32Array(data) : new Float32Array(4);
	gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, Math.max(1, n), 1, 0, gl.RGBA, gl.FLOAT, backing);
	return { tex, n };
}

let seed = FALLBACK_SEED;
let stars = { tex: null, n: 0 };
let events = { tex: null, n: 0 };

// This face runs 24/7: every replaced texture must be deleted or the 30s
// poll leaks two GPU allocations per cycle, forever. Stars depend only on
// the seed, so they rebuild only when it changes — not per poll.
function replaceTexture(slot, data) {
	if (slot.tex) gl.deleteTexture(slot.tex);
	return makeDotTexture(data);
}
let starSeed = null;
function rebuild(eventRows) {
	if (starSeed !== seed) {
		stars = replaceTexture(stars, buildStars(seed));
		starSeed = seed;
	}
	events = replaceTexture(events, buildEventDots(eventRows, seed));
}
rebuild([]);

function resize() {
	const dpr = window.devicePixelRatio || 1;
	const w = Math.round(canvas.clientWidth * dpr);
	const h = Math.round(canvas.clientHeight * dpr);
	if (canvas.width !== w || canvas.height !== h) {
		canvas.width = w;
		canvas.height = h;
		gl.viewport(0, 0, w, h);
	}
	// Preset sizes are "pixels on a 1024-wide canvas" — same relative size
	// on the panel, a Retina pane, or the settings miniature.
	return w / 1024;
}

const TW_RATE = 1 / P.TW_INTERVAL_S;
function setPass(o) {
	gl.uniform1f(U.uSizePx, o.size);
	gl.uniform1f(U.uSizeJitter, o.jitter);
	gl.uniform1f(U.uColorMix, o.colorMix);
	gl.uniform1f(U.uBaseBrightness, o.brightness);
	gl.uniform1f(U.uAlphaScale, o.alpha);
	gl.uniform1f(U.uFalloff, o.falloff);
	gl.uniform1f(U.uCorePop, o.corePop);
	gl.uniform1f(U.uTwEnabled, o.twinkle ? 1 : 0);
}

function frame(tMs) {
	const dprScale = resize();
	gl.uniform1f(U.uDpr, dprScale);
	gl.uniform1f(U.uTime, tMs / 1000);
	gl.uniform1f(U.uTwAmp, P.TW_AMP);
	gl.uniform1f(U.uTwRate, TW_RATE);
	gl.uniform1f(U.uTwAsym, P.TW_ASYM);
	gl.uniform1f(U.uTwJitter, P.TW_JITTER);
	gl.uniform1f(U.uTwSizeCoup, P.TW_SIZE_COUP);
	gl.clearColor(0, 0, 0, 1);
	gl.clear(gl.COLOR_BUFFER_BIT);
	gl.enable(gl.BLEND);
	gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
	gl.uniform1i(U.uDots, 0);
	gl.activeTexture(gl.TEXTURE0);

	// Pass order matters: halos are the ambient wash, stars sit over it,
	// pins on top. Halos do NOT twinkle — a pulsing wash reads as broken.
	if (events.n) {
		gl.bindTexture(gl.TEXTURE_2D, events.tex);
		setPass({ size: P.HALO_SIZE_PX, jitter: 0.35, colorMix: P.HALO_COLOR_MIX,
			brightness: 1.0, alpha: P.HALO_ALPHA, falloff: P.HALO_FALLOFF,
			corePop: 0.0, twinkle: false });
		gl.drawArrays(gl.POINTS, 0, events.n);
	}
	if (stars.n) {
		gl.bindTexture(gl.TEXTURE_2D, stars.tex);
		setPass({ size: P.STAR_SIZE_PX, jitter: P.STAR_SIZE_JITTER, colorMix: 0.0,
			brightness: P.STAR_BRIGHTNESS, alpha: 1.0, falloff: 22.0,
			corePop: 0.8, twinkle: true });
		gl.drawArrays(gl.POINTS, 0, stars.n);
	}
	if (events.n) {
		gl.bindTexture(gl.TEXTURE_2D, events.tex);
		setPass({ size: P.PIN_SIZE_PX, jitter: P.PIN_SIZE_JITTER, colorMix: P.PIN_COLOR_MIX,
			brightness: 1.0, alpha: P.PIN_BRIGHTNESS, falloff: 20.0,
			corePop: P.PIN_CORE_POP, twinkle: true });
		gl.drawArrays(gl.POINTS, 0, events.n);
	}
	requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ── polling the record ───────────────────────────────────────────────────
// Every 30s, like the spec's reducer cadence. Failures keep the last sky —
// a box whose query blipped should not blank the stars.
async function refresh() {
	try {
		const rows = await virtues.query(eventsSql());
		rebuild(rows.map((r) => [r.t | 0, r.cat | 0, +r.mag || 0]));
	} catch (e) {
		/* keep the last sky */
	}
}
(async () => {
	try {
		const s = await virtues.query(SEED_SQL);
		const epoch = s && s[0] && s[0].s;
		if (epoch) seed = (Number(epoch) >>> 0) || FALLBACK_SEED;
	} catch (e) {
		/* fallback seed */
	}
	await refresh();
	setInterval(refresh, 30_000);
})();
</script>
</body>
</html>
