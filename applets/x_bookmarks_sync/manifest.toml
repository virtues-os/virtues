name = "X Bookmarks"
description = "Files the posts you bookmark on X with your bookmarks."
owner = "system"
command = ["x_bookmarks_sync"]
triggers = ["cron", "manual"]
# Twice a day, 09:00 and 21:00 box-local. Bookmarks are not time-sensitive, and
# X flags rapid automated access — so the pull is deliberately infrequent, not
# 30-minutely like the GitHub stars sync. Drop the `,21` for once a day.
schedule = "0 0 9,21 * * *"
per_credential = true
source = { id = "x" }

# Ontologies this applet writes — drives "what would fill this stream".
writes = ["content_bookmark"]
