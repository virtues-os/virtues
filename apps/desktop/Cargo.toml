[package]
name = "virtues-client"
version = "0.1.0"
edition = "2021"
authors = ["Virtues Team <team@virtues.com>"]
description = "Desktop daemon that pairs to a Virtues box over WireGuard and proxies http://localhost:8000 to the box's HTTP server. The bridge that makes 'open the box in your browser' work on Mac, Linux, and Windows."
license = "MIT"
repository = "https://github.com/virtues-os/virtues"

[[bin]]
name = "virtues-client"
path = "src/main.rs"

[dependencies]
# The wire-protocol types (PairingBundle, punch shapes, SPKI helpers, constants).
# This is the ONLY virtues-* crate we depend on — keep it that way so the
# daemon stays cross-platform-buildable without virtues-core's dep universe.
virtues-protocol = { path = "../../crates/virtues-protocol" }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Async runtime
tokio = { version = "1.40", features = ["full"] }

# HTTP client for the pair flow + future punch coordinator calls
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }

# OS-native credential storage (Keychain on macOS, Secret Service on Linux,
# Credential Manager on Windows). Used to persist the PairingBundle after pair.
keyring = "3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Errors
anyhow = "1.0"

# Logging — stderr by default so any future proxy stdout stays clean
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Directory discovery (config / cache / logs per-platform)
directories = "5"

# Pair URL parsing (already in workspace via reqwest dep tree but pull explicitly)
url = "2.5"

# WireGuard keypair (Curve25519). Pure Rust, no platform-specific code.
# We generate one per-machine at pair time; private key goes to the OS keychain,
# public key flows to the box at /api/pair/consume so it can install the peer.
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand = "0.8"  # x25519-dalek-2 uses rand 0.8's RngCore trait
base64 = "0.22"

# Reverse-proxy HTTP path (browser → 127.0.0.1:8000 → box). Hyper 1.x is
# cross-platform (Mac/Linux/Windows) and tokio-native.
hyper = { version = "1.5", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["server-auto", "client-legacy", "tokio", "http1"] }
http-body-util = "0.1"
bytes = "1.7"

# WireGuard data plane (Mullvad's actively-maintained boringtun fork — see
# [[remote-access-decision]]). Trait-based TUN/UDP abstraction; we provide
# the concrete platform layer in `tunnel/<platform>.rs`. MPL 2.0 — used as
# a normal dep, no patches to its source files.
#
# Features:
#   - device  : the high-level `DeviceBuilder` (gated for embedded crypto-only use)
#   - tun     : bundled tokio-async TUN device wrapping the `tun` crate
#   - ring    : ring crypto backend (consistent with the rest of the workspace;
#               avoids aws-lc-sys cross-compile pain under GCC 11)
gotatun = { version = "0.7", default-features = false, features = ["device", "tun", "ring"] }

# Tunnel network configuration helper. Routes + IP addr on the TUN device.
# Used only on the Linux side today. Must track the same major as gotatun's
# own ipnetwork dep — `Peer::with_allowed_ip` takes gotatun's IpNetwork, and
# two ipnetwork versions in the graph make the types ununifiable.
ipnetwork = "0.21"
