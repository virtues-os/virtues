[package]
name = "tauri-plugin-audio"
version = "0.1.0"
authors = ["Virtues"]
description = "Native microphone collector: records ambient audio in fixed-length m4a chunks and enqueues them into the shared outbox for delivery + box-side transcription."
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-audio"

[dependencies]
tauri = { version = "2.11.3" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }

# Standalone (excluded from the repo workspace). The empty table stops cargo's
# workspace walk-up, which otherwise escapes the repo in nested git worktrees
# and gets claimed by an outer checkout's manifest.
[workspace]
