[package]
name = "tauri-plugin-photos"
version = "0.1.0"
authors = ["Virtues"]
description = "Native photo library collector: sends what PhotoKit says about each photo and video, with a picture of each favorite, into the shared outbox."
edition = "2021"
license = "MIT"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-photos"

[dependencies]
tauri = { version = "2.11.3" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }
virtues-plugin-lockstep = { path = "../lockstep" }

# Standalone (excluded from the repo workspace). The empty table stops cargo's
# workspace walk-up, which otherwise escapes the repo in nested git worktrees
# and gets claimed by an outer checkout's manifest.
[workspace]
