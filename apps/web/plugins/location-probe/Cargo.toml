[package]
name = "tauri-plugin-location-probe"
version = "0.1.0"
authors = [ "You" ]
description = ""
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-location-probe"

[dependencies]
tauri = { version = "2.11.3" }
serde = "1.0"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }
virtues-plugin-lockstep = { path = "../lockstep" }

# Standalone (excluded from the repo workspace). The empty table stops cargo's
# workspace walk-up, which otherwise escapes the repo in nested git worktrees
# and gets claimed by an outer checkout's manifest.
[workspace]
