<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Connect to your server</title>
    <!--
      THE AIRLOCK: the screen that connects this device to a server it is not
      paired with yet, and the launch screen that sends a paired device on to
      its server.

      Windows and Linux use it as their whole first run: search this network
      for a server, or type its address and the code `virtues pair` prints,
      then pair. The iPhone opens it for the QR scanner (`#existing`) and as a
      fallback. One file serves every platform, and the differences are named
      where they are real.

      Vanilla, self-contained, no build step: this page loads before the SPA
      exists and must work when nothing else does. It is served from the
      BINARY (see the `virtues://` handler and `WebviewUrl::App`) so a stale
      copy in a web bundle can never shadow it.
    -->
    <style>
      /* THE PEMBERLEY REGISTER, by hand. This page loads before the SPA and
         its theme system exist, so the values are transcribed from themes.css
         `:root` rather than imported: one paper (#FFFFFF), four steps of
         graphite ink, hairline borders as the only structure, serif headings,
         one blue spent only on focus/links/the live pip. Filled controls are
         graphite, not color. If Pemberley's tokens move, move these. */
      :root {
        color-scheme: light;
        --paper: #FFFFFF;
        --ink: #17171A; --ink-muted: #3F3F46; --ink-subtle: #71717A; --ink-faint: #A1A1AA;
        --line: #E7E7E9; --line-subtle: #F1F1F3; --line-strong: #D4D4D8;
        --blue: #0A84FF; --blue-subtle: #EAF3FF;
        --green: #1A7F45; --red: #C4322B;
        /* `ui-serif` is New York on Apple WebKit; Windows WebView2 falls to
           Georgia. EB Garamond lives in the SPA bundle, which does not exist yet
           when this page draws. */
        --serif: ui-serif, "New York", Georgia, "Times New Roman", serif;
        --sans: -apple-system, system-ui, "Segoe UI", sans-serif;
        --mono: ui-monospace, Menlo, Consolas, monospace;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
        font-family: var(--sans);
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--paper); color: var(--ink);
             padding: max(84px, calc(env(safe-area-inset-top) + 48px)) 22px 32px; }
      /* One layout, two window shapes. The phone reads edge-to-edge; a 1200px
         desktop window would stretch every control to absurdity, so the column
         is capped and centred there instead of being a second stylesheet. */
      @media (min-width: 620px) {
        body { padding: 108px 24px 64px; }
        #app { max-width: 430px; margin: 0 auto; }
      }

      /* ── chrome ──
         The one fixed frame around every screen: the mark top-left, the
         server's identity top-right once one is in play. */
      #chrome { position: fixed; top: 0; left: 0; right: 0; z-index: 10;
                display: flex; align-items: baseline; justify-content: space-between;
                padding: max(20px, env(safe-area-inset-top)) 24px 14px;
                background: var(--paper); }
      /* Inline-flex with centered items, not baseline text: the ∴ glyph is
         bottom-heavy and at 24px its baseline placement sank it below the
         wordmark. Optically centering the two boxes is what looks aligned. */
      #chrome .brand { display: inline-flex; align-items: center; gap: 8px;
                       font-family: var(--serif); font-size: 16px; font-weight: 400;
                       letter-spacing: .01em; color: var(--ink); }
      #chrome .brand .mk { font-family: var(--sans); font-size: 24px; line-height: 1;
                           transform: translateY(-0.1em); }
      #chrome .server { font-size: 12px; color: var(--ink-subtle);
                        font-variant-numeric: tabular-nums; letter-spacing: .01em;
                        transition: opacity .4s var(--ease); }
      #chrome .server b { color: var(--ink-muted); font-weight: 500; }
      #chrome .server[hidden] { display: inline; opacity: 0; visibility: hidden; }

      /* Screens replace #app's children wholesale, so each render's children
         are new nodes and the entrance plays by itself — a quiet rise, faintly
         staggered. Guarded for vestibular comfort. */
      @media (prefers-reduced-motion: no-preference) {
        #app > * { animation: rise .55s var(--ease) both; }
        #app > *:nth-child(2) { animation-delay: .05s; }
        #app > *:nth-child(3) { animation-delay: .1s; }
        #app > *:nth-child(4) { animation-delay: .15s; }
        #app > *:nth-child(5) { animation-delay: .2s; }
        #app > *:nth-child(n+6) { animation-delay: .25s; }
      }
      /* `from` only, no `to`: with fill-mode `both`, an explicit `to
         { opacity: 1 }` stays applied after the animation ends and overrides
         every later opacity — a disabled Continue rendered solid ink. Leaving
         the end state implicit makes it track the element's own styles. */
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } }

      h1 { font-family: var(--serif); font-size: 28px; font-weight: 400;
           letter-spacing: -.01em; line-height: 1.18; margin: 0 0 10px; }
      h2 { font-family: var(--serif); font-size: 21px; font-weight: 400; margin: 0 0 14px; }
      p.sub { margin: 0 0 28px; color: var(--ink-subtle); font-size: 14px; line-height: 1.55; }
      p.sub b { color: var(--ink-muted); font-weight: 500; }
      label { display: block; font-size: 11px; color: var(--ink-subtle);
              text-transform: uppercase; letter-spacing: .08em; margin: 0 0 6px; }
      input { width: 100%; background: var(--paper); color: var(--ink);
              border: 1px solid var(--line-strong); border-radius: 10px; padding: 13px 14px;
              font-size: 16px; font-family: var(--sans); margin: 0 0 18px;
              transition: border-color .15s var(--ease), box-shadow .15s var(--ease); }
      input::placeholder { color: var(--ink-faint); }
      input:focus { outline: none; border-color: var(--blue);
                    box-shadow: 0 0 0 3px var(--blue-subtle); }
      input#code { letter-spacing: .3em; font-variant-numeric: tabular-nums; text-align: center; }
      button { font-family: var(--sans); cursor: pointer; }
      button.primary { appearance: none; border: 0; border-radius: 10px; background: var(--ink);
               color: #fff; font-size: 15px; font-weight: 600; padding: 14px; width: 100%;
               transition: background .15s var(--ease), transform .12s var(--ease); }
      button.primary:hover:not(:disabled) { background: #2A2A2F; }
      button.primary:active:not(:disabled) { background: #000; transform: scale(.992); }
      button.primary:disabled { opacity: .35; cursor: default; }
      button.secondary { appearance: none; border: 1px solid var(--line-strong);
               border-radius: 10px; background: var(--paper); color: var(--ink);
               font-size: 15px; font-weight: 500; padding: 13px; width: 100%; margin-top: 10px;
               transition: border-color .15s var(--ease), background .15s var(--ease); }
      button.secondary:hover:not(:disabled) { border-color: var(--ink-faint); }
      button.secondary:disabled { opacity: .35; cursor: default; }
      a, .link { color: var(--blue); text-decoration: none; }
      a:hover, .link:hover { text-decoration: underline; }
      .msg { margin-top: 16px; font-size: 14px; min-height: 20px; color: var(--ink-subtle); }
      .err { color: var(--red); }
      .ok { color: var(--green); }
      .hint { margin-top: 22px; font-size: 12px; color: var(--ink-subtle); line-height: 1.55; }
      .hint b { color: var(--ink-muted); font-weight: 500; }
      #found { margin: 0 0 18px; }
      .box { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
             background: var(--paper); border: 1px solid var(--line); border-radius: 12px;
             padding: 14px 15px; margin-bottom: 8px; color: var(--ink); font-size: 15px;
             transition: border-color .15s var(--ease), box-shadow .2s var(--ease); }
      .box:hover { border-color: var(--line-strong); box-shadow: 0 1px 4px rgba(23,23,26,.06); }
      .box b { color: var(--ink); font-family: var(--serif); font-size: 16px; font-weight: 400; }
      .box .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green);
                  flex: none; animation: pulse 2.4s ease-in-out infinite; }
      .box .addr { margin-left: auto; color: var(--ink-faint); font-size: 12px;
                   font-variant-numeric: tabular-nums; }
      .box .boxstate { display: block; font-size: 12px; font-weight: 400;
                       color: var(--ink-subtle); }
      .back { appearance: none; background: none; border: 0; color: var(--ink-subtle);
              font-size: 14px; padding: 0; margin: 0 0 16px;
              transition: color .15s var(--ease); }
      .back:hover { color: var(--ink); }
      .msg .details { appearance: none; background: none; border: 0; padding: 0; margin-left: 4px;
                      font: inherit; color: var(--ink-subtle); text-decoration: underline;
                      text-underline-offset: 2px; cursor: pointer; }
      /* Top-of-screen back NAVIGATION is a bare arrow, not a worded link: a
         "← Back" row above the kicker added a third text register to a screen
         that already has kicker + headline, and read as part of the copy.
         Worded .back links stay for bottom-of-screen actions, where they are
         choices, not chrome. aria-label carries the words the glyph dropped. */
      .backnav { appearance: none; background: none; border: 0; display: inline-flex;
                 align-items: center; justify-content: center; width: 32px; height: 32px;
                 padding: 0; margin: 0 0 14px -7px; border-radius: 50%;
                 color: var(--ink-faint); font-size: 19px; line-height: 1;
                 transition: color .15s var(--ease), background .15s var(--ease); }
      .backnav:hover { color: var(--ink); background: var(--line-subtle); }
      .kicker { font-size: 11px; text-transform: uppercase; letter-spacing: .14em;
                color: var(--ink-faint); margin: 0 0 12px; }
      .wait { display: flex; align-items: center; gap: 10px; color: var(--ink-subtle);
              font-size: 14px; margin-bottom: 18px; }
      /* The pip is one of the few places the blue is spent: it means "live". */
      .wait .pip { width: 7px; height: 7px; border-radius: 50%; background: var(--blue);
                   flex: none; animation: pulse 1.6s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
    </style>
  </head>
  <body>
    <header id="chrome">
      <span class="brand"><span class="mk">∴</span>Virtues</span>
      <span class="server" id="serverid" hidden></span>
    </header>
    <div id="app"></div>

    <script>
      const invoke = window.__TAURI__.core.invoke;
      const app = document.getElementById('app');
      const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

      // The chrome's top-right identity line, "Server ID · Virtues 4812". Every
      // screen that knows which server it is about declares it here; screens
      // that don't (searching, scanning) clear it. It lets someone with two
      // servers on one network check which one they are pairing.
      const setServer = (name) => {
        const el = document.getElementById('serverid');
        // Normalize DEFENSIVELY here too — the chrome is the one label every
        // screen shows, and a raw `[Virtues …` reaching it (a server object
        // built outside the discover boundary) is exactly the leak this line
        // catches. prettyBoxName is idempotent, so a clean name passes through.
        const n = name ? prettyBoxName(name) : '';
        if (n && n !== 'Your server') { el.innerHTML = `Server ID&nbsp;·&nbsp;<b>${esc(n)}</b>`; el.hidden = false; }
        else { el.hidden = true; }
      };

      // `fromSetup`: opened by Setup (`#existing`, `#address`, `#pair?…`), so
      // back goes back there. `servers`: what the last network search found.
      const state = { servers: [], fromSetup: false };

      // ── platform ──────────────────────────────────────────────────────────
      //
      // ONE difference that is genuinely real (what "open the app" means at
      // the end) and one that is only cosmetic (what to call the machine the
      // user is holding). Discovery and pairing are the same commands on every
      // platform, because the plugin gives them all the same wire.
      const IS_MOBILE = !!window.__VIRTUES_MOBILE__;
      // Where the box's UI lives once paired. Mobile serves it from the
      // in-process loopback under this same origin (so a bare '/'); desktop
      // navigates to the loopback directly.
      const BOX_URL = window.__VIRTUES_BOX_URL__ || 'http://localhost:7117';
      const THIS_DEVICE = IS_MOBILE ? 'this phone' : 'this computer';

      // A server's network name is its mDNS form: `Virtues-4812`, or a codename
      // like `Virtues-Quaint-Tern` on an older server. On screen the number
      // keeps the brand ("Virtues 4812", because "4812" alone reads as
      // nothing) and a codename drops it ("Quaint Tern"). What arrives can be
      // wrapped (macOS has shown `[Virtues Quaint Tern]`), and the wrapper
      // defeats the prefix strip, so the edges are stripped first.
      const prettyBoxName = (n) => {
        const rest = String(n || 'Your server')
          .replace(/^[^A-Za-z0-9]+|[^A-Za-z0-9]+$/g, '')
          .replace(/^Virtues[-_ ]?/i, '')
          .replace(/[-_]+/g, ' ')
          .trim();
        return /^\d+$/.test(rest) ? 'Virtues ' + rest : rest || 'Your server';
      };

      // ── ROUTER:BEGIN ──────────────────────────────────────────────────────
      //
      // Every "which screen next?" decision in this file, as pure functions.
      //
      // ## Why this exists
      //
      // Each of these rules came from a real failure: a launch hash and the
      // injected paired flag that both drew a screen, a phone that landed on
      // the SPA's own connect page, a pairing error shown as raw reqwest text.
      // As pure functions, every rule is testable without a server or a
      // network.
      //
      // ## Why it is in this file rather than beside it
      //
      // This page is THE airlock, compiled into the binary and served before
      // any bundle, precisely so it cannot be shadowed or fail to load. A second
      // file would be a second fetch through the custom protocol and a second
      // way for the one screen that must always work to come up blank. The test
      // (`connect-router.test.mjs`) slices this region out by these markers and
      // evaluates it, which buys the testability without buying the risk.
      //
      // ## The rules
      //
      // Nothing here touches the DOM, `invoke`, or any module-level state. Give
      // it an observation, get back a destination. If a function in here needs
      // to await something, it belongs outside.
      const Router = {
        /**
         * Where does the window land, before anything is discovered?
         *
         * ONE destination, which is the point. This used to be two independent
         * `if` chains — one at the top of the script, one at the bottom — and
         * they could both fire: `#reset` on a device that is not locally paired
         * rendered the "box forgot us" screen and then had it overwritten by the
         * entry screen a few hundred lines later. Nobody would have found that
         * by reading, because the two halves are not on the same page.
         */
        bootDestination({ hash, injectedPaired }) {
          // Desktop decides this before the window exists and passes its verdict
          // in the hash; those verdicts win outright.
          if (hash === '#reset') return 'forgot-us';
          if (hash === '#unreachable') return 'unreachable';
          // `#setup` pins the connect screen open on an already-paired device,
          // for connecting it to a second server.
          if (hash === '#setup') return 'entry';
          // `#existing`: Setup (the app's own /setup, before pairing) sends a
          // device that is joining a server someone already set up straight
          // to the join: the QR scan on a phone, the code on a computer.
          // Setup's first half only sets up new servers (2026-09-28).
          if (hash === '#existing') return 'existing';
          // `#address` and `#pair?origin=…`: Setup sends someone who chose to
          // type an address, or a server its network search found, straight
          // to the code `virtues pair` printed.
          if (hash === '#address') return 'address';
          if (hash.startsWith('#pair?')) return 'code';
          // The injected flag is a FAST PATH, never the truth: it is evaluated
          // once when the window is built, so after an in-session unpair it
          // still says true. Confirmed against the plugin by `pairedProbe`.
          return injectedPaired ? 'probe-paired' : 'entry';
        },

        /**
         * The paired-probe's three answers get three different screens, and only
         * one opens the SPA. Loading it on anything less lands on the SPA's own
         * legacy connect page — the "old path" that must never appear.
         */
        pairedProbe(status) {
          if (!status || !status.paired) return 'entry';
          if (status.session === 'authed') return 'open';
          // Answered and REFUSED our key: box was reset, or we were revoked.
          if (status.session === 'rejected') return 'forgot-us';
          // Did not answer: off, or on a network we cannot reach. An offline box
          // must never silently cost someone their pairing, nor dead-end them.
          return 'unreachable';
        },

        /** `#pair?origin=…&name=…&claimed=…` from Setup: the server to ask a
         *  code for, or null when the hash names none. */
        pairTarget(hash) {
          if (!String(hash || '').startsWith('#pair?')) return null;
          const q = new URLSearchParams(hash.slice('#pair?'.length));
          const origin = q.get('origin');
          if (!origin) return null;
          const c = q.get('claimed');
          return { origin, name: q.get('name') || '', claimed: c === 'true' ? true : c === 'false' ? false : undefined };
        },

        /**
         * One line copied from `virtues pair` ("http://192.168.1.20:8000   123 456")
         * into its address and code. Null when the text is not that shape, so
         * whatever was typed stays as it is.
         */
        splitPasted(text) {
          const m = String(text || '').trim().match(/^(\S+)\s+(\d{3})\s?(\d{3})$/);
          return m ? { address: m[1], code: m[2] + m[3] } : null;
        },

        /**
         * A pairing failure in words, from what the plugin threw: reqwest's
         * error chain, the server's JSON error, or an OS error. Pairing by
         * address is the DIRECT connection, this device to the server with no
         * relay, so a failure before the server answers says "directly".
         * `paired` is true when the server took the code and only this
         * device's own side failed afterwards.
         */
        pairError(raw, { address, device }) {
          const s = String(raw || '');
          const at = String(address || 'that address').replace(/^https?:\/\//, '').replace(/\/+$/, '');
          const Device = device[0].toUpperCase() + device.slice(1);
          if (/bind 127\.0\.0\.1:\d+/.test(s) && /in use|os error (48|98)\b/i.test(s)) {
            return { paired: true, text: `Paired. Another copy of Virtues on ${device} is using the port it needs. Quit the other copy, then open Virtues again.` };
          }
          if (/invalid_or_expired_token|\b401\b/.test(s)) {
            return { paired: false, text: "That code didn't work. It may have expired. On your server, run virtues pair for a new one." };
          }
          if (/too_many_attempts|\b429\b/.test(s)) {
            return { paired: false, text: 'Too many wrong codes. Wait 30 minutes, then try a fresh code from virtues pair.' };
          }
          if (/relative URL|invalid (url|uri)|builder error|empty host|invalid port/i.test(s)) {
            return { paired: false, text: `That isn't an address ${device} can use. Type it the way virtues pair prints it, like http://192.168.1.20:8000.` };
          }
          if (/dns error|failed to lookup|nodename nor servname|name or service not known|no such host/i.test(s)) {
            return { paired: false, text: `${Device} couldn't find ${at} on this network. Try the numbered address virtues pair printed. Some networks don't carry .local names.` };
          }
          if (/connection refused|os error (61|111)\b/i.test(s)) {
            return { paired: false, text: `${at} is reachable, but Virtues isn't serving on that port. Check the port, usually 8000, and that the server is running.` };
          }
          if (/timed out|timeout|no route to host|network is unreachable|host is down|os error (51|60|64|65|110|113)\b/i.test(s)) {
            return { paired: false, text: `${Device} couldn't reach ${at} directly. Make sure both are on the same network. Some networks and virtual machines keep devices apart.` };
          }
          if (/\b404\b/.test(s)) {
            return { paired: false, text: `Something answered at ${at}, but it isn't a Virtues server. Check the address and port.` };
          }
          return { paired: false, text: "Pairing didn't finish. Try again with a fresh code from virtues pair." };
        },
      };
      // ── ROUTER:END ────────────────────────────────────────────────────────

      // ── launch ────────────────────────────────────────────────────────────
      //
      // `__VIRTUES_PAIRED__` is injected once when the window is built and never
      // re-evaluated, so after an in-session unpair it still says true and would
      // bounce the user straight back into the app they just left. That is why
      // unpairing appeared to do nothing until a force quit. Treat it as a fast
      // path, not the truth: it skips a round trip on the common case and is
      // then confirmed against the plugin, which reads the real record. If the
      // check fails we stay here — showing the connect screen to someone paired
      // is a recoverable annoyance; dropping someone unpaired into the app is not.
      //
      // Desktop decides the landing state BEFORE the window exists (a paired,
      // reachable box never renders this page at all) and passes its verdict
      // in the hash. Mobile can't: its window is built before reach is up, so
      // it probes from here. Same three destinations either way.

      // ── A PAIRED DEVICE ARRIVES; IT IS NOT TOLD THAT IT IS ARRIVING ───────
      //
      // The airlock must never render its connect UI while a paired device is
      // still working out where it stands: that reads as "your pairing is
      // gone", and it did, live, minutes after the first successful office
      // pairing (2026-08-11). `reach_status` runs a LIVE probe that can take
      // 10-15s when the direct path is blocked and the relay route has to be
      // found, so for a while this screen covered that wait with a headline —
      // "Opening your server…" and a pip.
      //
      // Which made the airlock a stop on every single launch of an ordinary
      // paired phone: a sentence the owner read every time, telling them what
      // they had just asked for. Arriving is the whole ask (2026-09-14).
      //
      // So the paired path shows NOTHING — bare paper, chrome hidden — and
      // races the probe against a short clock. Nothing is drawn because
      // nothing here is worth drawing: whatever went on this screen would be
      // a placeholder for the app, and a placeholder has to be handed over to
      // the real thing, across a document navigation, in a position the two
      // agree on. That was built and then removed the same day: three
      // painters (this page, `app.html`, `ChatView`) each holding a copy of a
      // hand-measured offset, kept in step by a comment. The seam cost more
      // than the paper it covered.
      //
      // WHAT MAKES RACING SAFE IS WHICH ANSWERS ARE SLOW. `Reach::status` only
      // makes a round trip when the device IS paired — `is_paired()` is a local
      // store read, and an unpaired device short-circuits to `session:
      // "unpaired"` with no network at all. So the one answer that must never
      // be guessed at — "you unpaired in this session, the injected
      // `__VIRTUES_PAIRED__` is lying, do not drop them back into the app they
      // just left" — is also the one that always lands in single-digit ms. A
      // timeout means paired-and-the-box-is-slow, and nothing else.
      //
      // PAST THE WINDOW, THE APP'S OWN STATES TAKE OVER, and that is the real
      // change: the probe's verdicts stop being the only way these situations
      // get told.
      //
      //   * `rejected` — the box refused our key. Opening the SPA on that used
      //     to land on `/pair`, the "old path" that must never appear on a
      //     phone (seen live 2026-08-11, twice, two different ways). That is
      //     now closed where it belongs: `(auth)/pair/+page.ts` bounces a
      //     mobile shell straight back here to `#reset`. Closing it there
      //     rather than by pre-flighting a probe is what buys every other
      //     launch its half-second.
      //
      //   * `unreachable` — timing-dependent by design. Airplane mode fails
      //     instantly and gets this page's screen, which carries the "forget
      //     this server" escape; a box that is merely off or far away takes
      //     seconds to fail, so the app opens and its own "Can't reach your
      //     server" banner says the same thing with a door into the diagnosis.
      //     `(app)/+layout.ts` treats a transport failure as offline and keeps
      //     the shell mounted, so nothing strands.
      //
      // There is no minimum hold. A floor exists to stop something being shown
      // for three frames; with nothing shown, waiting is only ever cost.
      const OPTIMISTIC_AFTER = 500; // past here, stop waiting and just open

      // Not `window.chrome` via the id-becomes-a-global rule: that name is a
      // real API surface in Chromium webviews, and a header element shadowing
      // it is the kind of thing that works here and breaks on Android.
      const chromeEl = document.getElementById('chrome');

      /**
       * Bare paper while we decide: no chrome, no content, nothing to hand over
       * — and in the colour the app is about to be, not this page's own white.
       *
       * The blank IS the launch now, so its colour is the only thing on screen,
       * and a step in it is the only event. `app.html` paints the theme's
       * page (`--page`) from `virtues-theme-surface`; we share that origin (the
       * same shelf `virtues-just-paired` crosses on), so reading the same key
       * makes the navigation invisible instead of a tint change. White is the
       * fallback, which is also this page's own paper: a device that has never
       * reached the app has nothing cached and nothing to match.
       *
       * ONLY THE BLANK. Every airlock SCREEN stays on the light register this
       * page hardcodes — `--ink` on `--paper`, Pemberley by hand. Painting a
       * dark theme's surface behind those would be graphite text on graphite.
       */
      function blankForDecision() {
        setServer('');
        app.innerHTML = '';
        chromeEl.style.visibility = 'hidden';
        try {
          // The same fallback chain app.html uses, in the same order. Not just
          // the surface key: a device whose cache predates it has only
          // `virtues-theme-bg`, and app.html would paint THAT while this page
          // painted its own white — the very step this is here to remove, on
          // the one launch after an update.
          const surface =
            localStorage.getItem('virtues-theme-surface') ||
            localStorage.getItem('virtues-theme-bg');
          if (surface) document.body.style.backgroundColor = surface;
        } catch { /* no storage: this page's own paper is the fallback */ }
      }

      /** Give the page back its own paper and chrome, then draw an airlock screen. */
      function showAirlock(draw) {
        document.body.style.backgroundColor = '';
        chromeEl.style.visibility = '';
        draw();
      }

      function bootPaired() {
        blankForDecision();
        // `null` is the clock's answer, and is distinguishable from every real
        // verdict — `catch` resolves to 'entry', which is a verdict.
        Promise.race([
          invoke('plugin:reach|reach_status')
            .then((s) => Router.pairedProbe(s))
            .catch(() => 'entry'),
          new Promise((r) => setTimeout(() => r(null), OPTIMISTIC_AFTER)),
        ]).then((verdict) => {
          switch (verdict) {
            case null:   // the clock won: paired, box slow, open anyway
            case 'open': openBox(); break;
            case 'forgot-us':   showAirlock(renderBoxForgotUs); break;
            case 'unreachable': showAirlock(renderBoxUnreachable); break;
            default:            showAirlock(renderEntry); break;
          }
        });
      }

      // ON A PHONE, RECOVERY IS THE APP'S OWN SCREEN. The baked SPA's
      // `/reconnect` tells "refused" from "unreachable" from "offline" itself
      // (apps/web/src/lib/components/recovery/). It ships in the same build
      // as this page, and an OTA bundle is never older than the baked one,
      // so the route is always there. Desktop shells that bake no SPA
      // (Windows, Linux) keep the two screens below; the Mac never opens
      // them (main.rs sends it to its own `/reconnect`).
      function toReconnect() {
        if (!IS_MOBILE) return false;
        window.location.replace('/reconnect');
        return true;
      }

      function renderBoxUnreachable() {
        if (toReconnect()) return;
        setServer('');
        app.innerHTML = `
          <h1>Can't reach your server</h1>
          <p class="sub">${THIS_DEVICE[0].toUpperCase() + THIS_DEVICE.slice(1)} is paired, but its
            server isn't answering — it may be off, still starting up, or somewhere this device
            can't reach right now.</p>
          <button class="primary" id="retry">Try again</button><br>
          <button class="back" id="openanyway" style="margin-top:14px">Open the app anyway</button><br>
          <button class="back" id="setupnew" style="margin-top:6px">Forget this server and set up another</button>`;
        document.getElementById('retry').addEventListener('click', bootPaired);
        document.getElementById('openanyway').addEventListener('click', openBox);
        // Two taps, inline — window.confirm() is not reliably wired in the
        // iOS webview, and a silent false would make this button a no-op.
        let armed = false;
        const setupnew = document.getElementById('setupnew');
        setupnew.addEventListener('click', async () => {
          if (!armed) {
            armed = true;
            setupnew.textContent = "Tap again to forget - the server itself isn't touched";
            return;
          }
          await forgetHere();
          start();
        });
      }

      /**
       * Forget the server on this device, and the app's own notes that it was
       * paired. `virtues-just-paired` bridges the launch that paired; left
       * behind, the next launch (baked unpaired) trusted it, skipped Setup's
       * first half, and looked for a server that was gone. The forgot marker
       * tells Setup this launch has no server, whatever the shell baked.
       */
      async function forgetHere() {
        try { await invoke('plugin:reach|forget'); } catch { /* already gone */ }
        try {
          localStorage.removeItem('virtues-just-paired');
          // No app to open Setup in any more (inApp.ts).
          localStorage.removeItem('virtues-setup-in-app');
          sessionStorage.setItem('virtues-forgot-server', '1');
        } catch { /* best effort */ }
      }

      function renderBoxForgotUs() {
        if (toReconnect()) return;
        setServer('');
        app.innerHTML = `
          <h1>Your server doesn't recognize ${THIS_DEVICE}</h1>
          <p class="sub">It answered, but refused this device's key - usually because someone
            reset the server, or removed this device from its list. Pairing again fixes it.</p>
          <button class="primary" id="repair">Pair again</button>
          <p class="hint">This forgets the old connection on ${THIS_DEVICE} only — nothing on the
            server is touched.</p>`;
        document.getElementById('repair').addEventListener('click', async () => {
          await forgetHere();
          start();
        });
      }

      // ── the one genuinely platform-shaped step ────────────────────────────
      //
      // Pairing succeeded; now open the box. Mobile serves the box's UI from
      // its own in-process loopback under this origin, so it is a navigation.
      // Desktop has two extra beats that only exist there:
      //
      //   * `install_helpers` — confirms the :7117 loopback is bound. Pairing
      //     already starts it, so this is usually a no-op; it covers the
      //     paired-but-not-yet-serving relaunch.
      //   * the collector — pairing this app pairs a VIEWER (`kind=desktop_app`
      //     with no source ⇒ the box records `__device__` and no ingest applet
      //     is created). The thing that collects is a separate daemon this app
      //     installs. Until this ran, finishing setup left you "connected" and
      //     collecting nothing, permanently, while the UI reported success.
      //     Best-effort by design: Sources → This Mac is the manual path.
      //
      // Mobile takes an early return on IS_MOBILE — a platform check, because
      // what differs is not a missing command but the destination itself (the
      // SPA under this same origin vs a navigation to the loopback).
      async function finishPairing(say) {
        if (IS_MOBILE) {
          // `__VIRTUES_PAIRED__` was baked false when this window was built and
          // a reload does not re-bake it, so the SPA's first-run permission
          // cards would wait for the next cold launch. The marker bridges this
          // one session; mobileLayout consumes it (and clears it once the
          // baked flag catches up).
          try {
            localStorage.setItem('virtues-just-paired', 'true');
            sessionStorage.removeItem('virtues-forgot-server');
          } catch { /* best effort */ }
          // Give the loopback a beat, then open this device's step in the
          // bundled SPA. On a new server that step isn't reachable yet and
          // Setup sends the phone to the first step still open; on a server
          // that is already set up, this phone still gets its own permissions
          // instead of going straight into the app.
          setTimeout(() => window.location.replace('/setup/connections'), 400);
          return;
        }
        try {
          await invoke('install_helpers', { server: BOX_URL });
        } catch (e) {
          const said = Router.pairError(e, { device: THIS_DEVICE });
          if (say) say(said.paired ? said.text : `Paired, but ${THIS_DEVICE} couldn't start its connection to the server. Quit Virtues and open it again.`, 'err');
          return;
        }
        // OWN SCREEN from here — pairing succeeded, so the pairing screen's
        // leftovers (its "enter the code myself" escape especially) must not
        // linger under a wait that can take a while. This also replaces the
        // old silent behavior at the timeout: `window.location.href` against a
        // loopback that isn't answering keeps the CURRENT page on screen while
        // WebKit waits on the navigation — a freeze with no message, seen live
        // 2026-08-24 right after a fresh box's first pairing, when iroh is
        // still finding its path (10-15s is normal, longer on a fresh join;
        // every failed probe logs "network connection lost" to the console).
        setServer('');
        app.innerHTML = `
          <p class="kicker">Paired</p>
          <h1>Opening your server</h1>
          <div class="wait"><span class="pip"></span><span id="openstage">Connecting to it from this computer…</span></div>
          <p class="hint">Your server saved the pairing. This is just the two of them finding
            each other on the network, and it can take a minute the first time.</p>`;
        let ready = await waitForBoxUrl(20000);
        if (!ready) {
          const st = document.getElementById('openstage');
          if (st) st.textContent = 'Still connecting - a fresh network can take a minute…';
          ready = await waitForBoxUrl(75000);
        }
        if (ready) {
          try {
            // Minting the collector's code needs this app's owner proof: a
            // nonce from the server, signed with this device's key. A server
            // too old to issue one (404) does not ask for it.
            const headers = {};
            const n = await fetch(BOX_URL + '/api/owner-proof/nonce', { method: 'POST' });
            if (n.ok) {
              const { nonce } = await n.json();
              headers['X-Virtues-Owner-Proof'] = await invoke('plugin:reach|owner_proof_sign', {
                method: 'POST', path: '/api/pair/mint-collector', nonce,
              });
            }
            const res = await fetch(BOX_URL + '/api/pair/mint-collector', { method: 'POST', headers });
            if (res.ok) {
              const { token } = await res.json();
              if (token) await invoke('install_collector', { token });
            }
          } catch (e) {
            console.warn('[connect] collector not installed; use Sources → This Mac', e);
          }
          window.location.href = BOX_URL;
          return;
        }
        // Paired but unreachable from here after ~95s. Say so honestly with
        // ways forward — never a blind navigation that freezes the page.
        app.innerHTML = `
          <p class="kicker">Paired</p>
          <h1>Paired, but can't reach it yet</h1>
          <p class="sub">The pairing worked and your server saved it. This computer can't
            reach it yet, either directly on this network or through the relay.
            Its network may still be settling after setup.</p>
          <button class="primary" id="retry">Keep trying</button>
          <button class="secondary" id="anyway">Open anyway</button>
          <p class="hint">Quitting and reopening the app later works too. It
            reconnects on its own.</p>`;
        document.getElementById('retry').addEventListener('click', () => finishPairing());
        document.getElementById('anyway').addEventListener('click', () => {
          window.location.href = BOX_URL;
        });
      }

      /** Open the box's UI for an ALREADY-paired device (no setup beats). */
      function openBox() {
        if (IS_MOBILE) window.location.replace('/');
        else window.location.href = BOX_URL;
      }

      /** Poll the loopback until it actually answers (it binds asynchronously). */
      async function waitForBoxUrl(timeoutMs) {
        const deadline = Date.now() + timeoutMs;
        while (Date.now() < deadline) {
          try {
            await fetch(BOX_URL + '/api/box/health', { cache: 'no-store' });
            return true;
          } catch { /* not up yet */ }
          await new Promise((r) => setTimeout(r, 500));
        }
        return false;
      }

      // ── discovery ─────────────────────────────────────────────────────────

      // The servers this device can find on its network. A failed search
      // finds nothing, and the caller offers the typed address either way.
      async function discoverBoxes() {
        try {
          const resp = await invoke('plugin:reach|discover');
          // Every server found on the network enters the page here, so its name
          // is cleaned once, at this boundary, and a new screen cannot show the
          // raw mDNS form by forgetting to.
          return (resp.servers || []).map((s) => ({ ...s, name: prettyBoxName(s.name) }));
        } catch (e) {
          console.warn('[connect] network search failed', e);
          return [];
        }
      }

      // The unpaired landing. A computer searches this network for its server
      // (on Windows and Linux this is the whole first run). A phone opens the
      // scanner, because a QR code on a screen works on any network; the
      // network search and a typed address sit behind the scanner's own link.
      function renderEntry() {
        if (IS_MOBILE) return renderScan();
        return start();
      }

      // Bumped by every screen that starts or abandons async work, so a search
      // or a scan that finishes late cannot paint over the screen in front.
      let searchGen = 0;

      // ── SCAN A PAIRING CODE ───────────────────────────────────────────────
      //
      // The way in when the phone can reach neither the box nor the computer:
      // the box is elsewhere, and coworking wifi isolates clients so the two
      // devices in your hands cannot see each other either. A paired computer
      // mints this phone's identity, enrols its public half with the box over
      // the relay it already has, and shows the result as a QR. Nothing
      // crosses a network here — only a camera pointed at a screen.
      //
      // Decoding is jsQR (vendored beside this file; the airlock has no
      // bundler). NOT `BarcodeDetector`: that is a Chrome API and WebKit has
      // never shipped it, so the first version of this screen feature-detected
      // it, told every iPhone it was "too old to scan", and returned before
      // even starting the camera — a black rectangle under a false sentence.
      // A decoder that runs everywhere costs 251K and removes the whole class.
      let scanStream = null;
      let scanRaf = 0;

      function stopScan() {
        if (scanRaf) { cancelAnimationFrame(scanRaf); scanRaf = 0; }
        if (scanStream) {
          scanStream.getTracks().forEach((t) => t.stop());
          scanStream = null;
        }
      }

      /// Load the decoder once, on demand. Kept out of the boot path: the
      /// airlock's first paint must not wait on 251K nobody has asked for yet.
      function loadDecoder() {
        if (window.jsQR) return Promise.resolve(true);
        return new Promise((resolve) => {
          const s = document.createElement('script');
          s.src = 'jsqr.js';
          s.onload = () => resolve(!!window.jsQR);
          s.onerror = () => resolve(false);
          document.head.appendChild(s);
        });
      }

      async function renderScan() {
        searchGen++;
        setServer('');
        app.innerHTML = `
          ${state.fromSetup ? '<button class="backnav" id="back" aria-label="Back">←</button>' : ''}
          <h1>Scan the QR code</h1>
          <p class="sub">Point this phone at the code your server printed when it finished
            installing, or at the one on a connected computer under Settings → Devices.</p>
          <video id="cam" playsinline muted
                 style="width:100%;max-width:340px;border-radius:14px;background:#000"></video>
          <p class="hint err" id="scanerr"></p>
          <p class="hint" style="margin-top:18px">No computer, or can't scan?
            <a href="#" id="lanpath">Find your server on this network</a>.</p>`;
        // Back exists only when Setup opened the scanner: on a phone the
        // scanner is the first screen, so there is nothing else to go back to.
        const back = document.getElementById('back');
        if (back) back.addEventListener('click', () => { stopScan(); history.back(); });
        // The way into the network search and the typed address, for someone
        // with no second computer around.
        document.getElementById('lanpath').addEventListener('click', (e) => {
          e.preventDefault(); stopScan(); start();
        });

        const err = document.getElementById('scanerr');
        if (!(await loadDecoder())) {
          err.textContent =
            'The scanner failed to load. Use “Find your server on this network” below instead.';
          return;
        }

        let stream;
        try {
          // `environment` = the back camera. A phone pointed at a laptop screen
          // is always using the back one; asking for it by name avoids opening
          // the selfie camera and looking broken.
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment' },
          });
        } catch (e) {
          err.textContent =
            'The camera is unavailable. Allow camera access for Virtues in Settings, then try again.';
          return;
        }
        scanStream = stream;
        const video = document.getElementById('cam');
        if (!video) { stopScan(); return; } // navigated away mid-permission
        video.srcObject = stream;
        await video.play().catch(() => {});

        // jsQR reads pixels, so frames go through a canvas. Sized once from the
        // stream rather than per frame — a reallocation per frame is what makes
        // a scanner feel sluggish on a phone.
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const gen = searchGen;
        let handled = false;

        function tick() {
          // Bail the moment the screen changes underneath us — the back button
          // and a successful pair both bump searchGen.
          if (handled || gen !== searchGen || !scanStream) return;
          const w = video.videoWidth, h = video.videoHeight;
          if (w && h) {
            if (canvas.width !== w) { canvas.width = w; canvas.height = h; }
            ctx.drawImage(video, 0, 0, w, h);
            try {
              const img = ctx.getImageData(0, 0, w, h);
              // `dontInvert`: our code is dark-on-light, and asking jsQR to also
              // try the inverted reading doubles the per-frame cost for nothing.
              const found = window.jsQR(img.data, w, h, { inversionAttempts: 'dontInvert' });
              if (found && found.data) {
                handled = true;
                stopScan();
                return acceptScanned(found.data);
              }
            } catch { /* a frame that won't decode is not an error */ }
          }
          scanRaf = requestAnimationFrame(tick);
        }
        scanRaf = requestAnimationFrame(tick);
      }

      async function acceptScanned(payload) {
        searchGen++;
        app.innerHTML = `
          <h1>Pairing</h1>
          <div class="wait"><span class="pip"></span><span>Setting this phone up</span></div>`;
        let line = null;
        try {
          // Two codes reach this scanner. The server's own QR holds the same
          // line `virtues pair` prints (address and six-digit code, no key),
          // so it pairs by address exactly as a pasted line would. Anything
          // else is a connected computer's handoff.
          line = Router.splitPasted(payload);
          if (line) {
            const status = await invoke('plugin:reach|pair', {
              payload: { server: line.address, code: line.code },
            });
            if (!status.paired) throw new Error('Pairing did not complete. Run virtues pair on your server and scan the new code.');
          } else {
            await invoke('plugin:reach|pair_handoff_accept', { payload });
          }
          return finishPairing('Paired');
        } catch (e) {
          // Straight back to the scanner carrying the reason. A wrong or
          // expired code is the common case and deserves another try. The
          // server's QR fails the way a typed code does, so it is said the
          // same way (Router.pairError); a handoff's error is already words.
          const raw = e && e.message ? e.message : e;
          const said = line ? Router.pairError(raw, { address: line.address, device: THIS_DEVICE }).text : String(raw);
          await renderScan();
          const err = document.getElementById('scanerr');
          if (err) err.textContent = said;
        }
      }

      // ── FINDING A SERVER ON THIS NETWORK ──────────────────────────────────
      //
      // One search of this network. A server somewhere else, or on a network
      // that keeps its devices apart, cannot answer it, so the search screen
      // keeps the typed address one tap away and an empty search lands on
      // that form. Going back from the form searches again.
      function renderSearching() {
        setServer('');
        // Back goes to the scanner on a phone, or to Setup when Setup sent
        // this device here. A computer that opened on the search has nowhere
        // to go back to.
        const canGoBack = IS_MOBILE || state.fromSetup;
        app.innerHTML = `
          ${canGoBack ? '<button class="backnav" id="back" aria-label="Back">←</button>' : ''}
          <h1>Looking for your server</h1>
          <p class="sub">Searching this network for a Virtues server.</p>
          <div class="wait"><span class="pip"></span><span>Searching</span></div>
          <p class="hint" style="margin-top:18px">Server somewhere else?
            <a href="#" id="manual">Connect by address</a>.</p>`;
        const back = document.getElementById('back');
        if (back) back.addEventListener('click', () => {
          searchGen++;
          if (IS_MOBILE) renderScan(); else history.back();
        });
        document.getElementById('manual').addEventListener('click', (e) => {
          e.preventDefault(); searchGen++; renderManualPair();
        });
      }

      async function start() {
        const gen = ++searchGen;
        renderSearching();
        const servers = await discoverBoxes();
        if (gen !== searchGen) return; // the person moved on mid-search
        if (servers.length) return renderPair(servers);
        return renderManualPair(
          'Nothing answered on this network. If your server is somewhere else, or this network keeps its devices apart, type its address.',
        );
      }

      // ── PAIR: the server is on the network; pair with it ─────────────────

      // The servers the search found. Each one is the action: choosing it
      // opens the code screen for that server. Typing an address is the
      // fallback for a server the search could not see.
      function renderPair(servers) {
        if (!servers.length) return renderManualPair();
        state.servers = servers;
        const chips = servers.map((s, i) => `
          <button class="box" data-i="${i}">
            <span class="dot"></span>
            <span>
              <b>${esc(s.name)}</b>
              <span class="boxstate">${s.claimed === false ? 'ready to set up' : s.claimed === true ? 'already set up' : ''}</span>
            </span>
            <span class="addr">${s.origin ? esc(s.origin.replace('http://', '')) : ''}</span>
          </button>`).join('');
        setServer(servers.length === 1 ? servers[0].name : '');
        app.innerHTML = `
          <h1>Connect to your server</h1>
          <p class="sub">Choose your server to pair it.</p>
          <div id="found">${chips}</div>
          <button class="back" id="manual">Enter an address manually</button>`;
        document.getElementById('manual').addEventListener('click', () => renderManualPair());
        app.querySelectorAll('.box').forEach((el) => {
          el.addEventListener('click', () => renderCodeEntry(state.servers[+el.dataset.i]));
        });
      }

      // Code entry for ONE chosen server. The code is the only thing left to
      // type, and choosing the wrong server fails closed anyway: a code only
      // works on the server that minted it.
      function renderCodeEntry(server) {
        setServer(server.name);
        // The code comes from `virtues pair` on the server, and nothing else
        // shows one.
        app.innerHTML = `
          <button class="backnav" id="back" aria-label="Back to servers">←</button>
          <p class="kicker">${esc(server.name)}${server.claimed === false ? ' · ready to set up' : ''}</p>
          <h1>Enter its code</h1>
          <p class="sub">Run <b>virtues pair</b> on ${esc(server.name)}. It prints
            the six digits.</p>
          <form id="form">
            <input id="code" inputmode="numeric" maxlength="7" placeholder="123 456" autofocus />
            <button class="primary" id="go" type="submit">Pair</button>
          </form>
          <div class="msg err" id="msg"></div>
          <p class="hint">${server.claimed === false
            ? 'The install printed one too, when it finished. Codes rotate - a fresh one always works.'
            : 'Each code works once and lasts about 30 minutes.'}</p>`;
        document.getElementById('back').addEventListener('click', () => (state.fromSetup ? history.back() : start()));
        document.getElementById('form').addEventListener('submit', (e) => {
          e.preventDefault();
          submitPair(server.origin);
        });
        document.getElementById('code').focus();
      }

      // Address and code together, for a server the search can't see: one on
      // another network, or on a network that hides mDNS.
      function renderManualPair(note) {
        setServer('');
        app.innerHTML = `
          <button class="backnav" id="back" aria-label="Back to servers">←</button>
          <h1>Connect by address</h1>
          <p class="sub">${note ? esc(note) + ' ' : ''}Run <b>virtues pair</b> on your server. It
            prints the address and a six-digit code. Paste a whole line to fill both.</p>
          <form id="form">
            <label for="server">Server address</label>
            <input id="server" inputmode="url" autocapitalize="off" autocorrect="off"
                   placeholder="http://192.168.1.20:8000" />
            <label for="code">Pairing code</label>
            <input id="code" inputmode="numeric" maxlength="7" placeholder="123 456" />
            <button class="primary" id="go" type="submit">Pair</button>
          </form>
          <div class="msg" id="msg"></div>`;
        document.getElementById('back').addEventListener('click', () => (state.fromSetup ? history.back() : renderEntry()));
        // A line pasted from `virtues pair` carries both: split it here.
        const addr = document.getElementById('server');
        addr.addEventListener('input', () => {
          const both = Router.splitPasted(addr.value);
          if (!both) return;
          addr.value = both.address;
          document.getElementById('code').value = both.code.slice(0, 3) + ' ' + both.code.slice(3);
          document.getElementById('go').focus();
        });
        addr.focus();
        document.getElementById('form').addEventListener('submit', (e) => {
          e.preventDefault();
          submitPair(document.getElementById('server').value.trim());
        });
      }

      // A pairing failure, in words (Router.pairError), with the raw text one
      // tap away for whoever is helping. Returns what pairError said.
      function sayPairError(raw, address) {
        const e = Router.pairError(raw, { address, device: THIS_DEVICE });
        const msg = document.getElementById('msg');
        if (!msg) return e;
        msg.className = 'msg err';
        msg.innerHTML = `${esc(e.text)} <button class="details" type="button">Copy details</button>`;
        const btn = msg.querySelector('.details');
        btn.addEventListener('click', () => {
          navigator.clipboard.writeText(String(raw)).then(() => { btn.textContent = 'Copied'; }, () => {});
        });
        return e;
      }

      // `server` is the chosen server's origin (chip flow) or whatever the
      // manual form holds. The caller decides; this just pairs against it.
      async function submitPair(server) {
        const msg = document.getElementById('msg');
        const go = document.getElementById('go');
        const say = (t, cls) => { if (msg) { msg.className = 'msg ' + (cls || ''); msg.textContent = t; } };
        const typed = document.getElementById('code');
        const code = (typed ? typed.value : '').replace(/\s+/g, '');
        if (!server || code.length < 6) {
          return say('Run virtues pair on your server for a six-digit code, then enter it here.', 'err');
        }
        if (go) go.disabled = true;
        say('Pairing…');
        try {
          const status = await invoke('plugin:reach|pair', { payload: { server, code } });
          if (status.paired) {
            say('Paired - opening your server…', 'ok');
            await finishPairing(say);
            return true;
          }
          say('Pairing did not complete. Check the code and try again.', 'err');
          if (go) go.disabled = false;
          return false;
        } catch (err) {
          const e = sayPairError(err, server);
          if (go) go.disabled = e.paired;
          return false;
        }
      }

      // ── launch ────────────────────────────────────────────────────────────
      //
      // ONE destination, decided once. This replaced two independent `if`
      // chains — one near the top of the script, one right here — which could
      // both fire: `#reset` on a device that is not locally paired drew the
      // forgot-us screen and then had the entry screen painted over it.
      //
      // AT THE BOTTOM, deliberately. Every screen function is a hoisted
      // declaration and would be reachable from anywhere, but `renderEntry`
      // touches `searchGen`, which is a `let` — dispatching before that binding
      // is initialized throws `Cannot access 'searchGen' before initialization`
      // and the airlock comes up blank. Found by running it; nothing about the
      // code says so.
      switch (Router.bootDestination({
        hash: location.hash,
        injectedPaired: !!window.__VIRTUES_PAIRED__,
      })) {
        case 'forgot-us':    renderBoxForgotUs(); break;
        case 'unreachable':  renderBoxUnreachable(); break;
        case 'probe-paired': bootPaired(); break;
        case 'existing':     state.fromSetup = true; renderEntry(); break;
        case 'address':      state.fromSetup = true; renderManualPair(); break;
        case 'code': {
          state.fromSetup = true;
          const t = Router.pairTarget(location.hash);
          if (t) renderCodeEntry({ ...t, name: prettyBoxName(t.name) });
          else renderManualPair();
          break;
        }
        default:             renderEntry(); break;
      }
    </script>
  </body>
</html>
