        // returns to the picker (which rescans), and a successful one goes on to
        // fetch the link code over RPC 0x84. Redialing that fast loses the race
        // against CoreBluetooth and the box's own radio, so `ensure_connected`
        // times out — and the user is told "couldn't connect to the box over
        // Bluetooth" when what actually happened was a wrong Wi-Fi password
        // (2026-08-13). BLE closes once, after pairing lands, in submitPairBle.
        if (!res.ok) {
          return bleWifiPicker(state.bleBox, res.error || 'The server couldn\'t join that network.');
        }
        // The box handed us its own address over BLE — no rediscovery scan.
        // Keep the BLE id on the chip: office networks that isolate clients
        // make the LAN origin unreachable, and pairing then rides Bluetooth
        // (RPC 0x83) instead — same code, different wire.
        const origin = (res.url || '').replace(/\/$/, '');
        renderLinkStep({ name: state.bleBox.name, origin, bleId: state.bleBox.id }, ssid);
      }

      // ── LINK ──────────────────────────────────────────────────────────────
      //
      // The step whose absence was discovered as a wall on 2026-08-11: a box
      // onboarded and paired at an office was unreachable by the app in the
      // same minute, because reach rides the relay and the relay rides the
      // account. It comes BEFORE pairing on purpose — linking needs only the
      // box's outbound internet plus a browser on any network, so it is immune
      // to hostile LANs by construction, and once it is done nothing later
      // depends on the local network's goodwill.
      //
      // The box drives the link itself (device authorization, RFC-8628 shape);
      // this screen's job is to say why, hand the owner one of two doors
      // (inline sign-in, or browser checkout), and notice when the link lands
      // — by whichever door, since the box's own poll is what completes it.
      // PRESCRIBE, NEVER
      // ENFORCE: "Skip for now" is always there. An owner who refuses the
      // subscription owns slower, LAN-only hardware — not a brick.
      async function renderLinkStep(server, ssid) {
        state.linkServer = server;
        setServer(server.name);
        const draw = (statusHtml) => {
          app.innerHTML = `
            <p class="kicker">Setting up</p>
            <h1>Link your server to an account</h1>
            <p class="sub">${ssid ? `It's on ${esc(ssid)}. ` : ''}Your data stays on the server —
              the subscription pays for what connects it: reaching it from anywhere,
              the AI wallet, integrations.</p>
            <button class="primary" id="openlink">I already have an account</button>
            <button class="secondary" id="newacct">Create an account</button>
            <p class="hint" id="codehint">${statusHtml}</p>
            <p class="escape"><button id="skip">Skip linking for now</button></p>`;
          // The choice belongs HERE, not on a web page the app opens: asking
          // "new or existing?" in the browser meant the app sent you somewhere
          // to answer a question it could have asked itself. The two doors now
          // go different places on purpose — sign-in is inline (email OTP,
          // nothing a webview can't hold), checkout opens the real browser
          // (payment autofill and Apple Pay live there, not here).
          // Re-ask at the moment of the click too: the poll refreshes every few
          // seconds, but the click is what puts the code in a URL, and that is
          // the value that has to be live.
          const go = async (path) => {
            await fetchLinkCode();
            paintCode();
            if (!state.linkCode) return;
            openUrl(`${LINK_URL}${path}?code=${encodeURIComponent(state.linkCode)}`);
          };
          // Sign-in navigates AWAY from this screen, so the watcher must stop
          // FIRST — bumping searchGen before anything async, or the still-live
          // loop can fire goToPairing during the handler and paint pairing
          // under the sign-in form. No code fetch here: sign-in is email/OTP,
          // and approve re-reads the user_code over BLE at the only moment it
          // matters. (Checkout, below, deliberately does NOT stop the watcher —
          // it opens a browser and stays here so the landing is noticed.)
          document.getElementById('openlink').addEventListener('click', () => {
            searchGen++;
            renderInlineSignin(server, ssid);
          });
          document.getElementById('newacct').addEventListener('click', () => go('/checkout'));
          document.getElementById('skip').addEventListener('click', () => goToPairing(server, ssid));
        };
        draw('<span id="linkstate"></span>');

        // ASK THE BOX FOR ITS CODE, over the setup session we already hold.
        //
        // It used to be printed on the box's panel for the owner to retype. The
        // session is a better carrier in both directions: it already proved
        // LINE OF SIGHT via the phrase, where the glass proves only that you are
        // in the room — and the code lands in the URL, so nobody types anything.
        // The panel keeps it off the screen entirely, which also preserves the
        // one-code-at-a-time rule the whole redesign came from.
        // The code does not exist the instant Wi-Fi lands. The box has to reach
        // atlas and start the device authorization first, so a single ask right
        // after the join reliably comes back empty — which used to leave the
        // button opening a bare /init and demanding the very code we had just
        // taken off the glass (2026-08-13). Keep asking until it arrives.
        // A refusal and "not minted yet" both come back empty, so a box that
        // was REFUSING looked exactly like one still thinking — which is how a
        // missing setup session hid behind a spinner. Keep the reason.
        let codeErr = '';
        // ALWAYS re-ask. The box rotates this code — atlas expires a link 15
        // minutes after it starts — and caching the first one seen meant a
        // screen left open a few minutes opened a URL atlas had already killed:
        // "Link expired. Start again from your box." (2026-08-13). A blip must
        // not wipe a good code, so only a non-empty answer overwrites.
        // Reports which of three things happened, because they mean different
        // things and used to be one silent shrug: a code, a deliberate EMPTY
        // answer, or a failure.
        const fetchLinkCode = async () => {
          if (!server.bleId) return 'error';
          try {
            const r = await invoke('plugin:reach|improv_link_code', { id: server.bleId });
            if (r && r.ok && r.code) { state.linkCode = r.code; codeErr = ''; return 'code'; }
            if (r && r.ok === false && r.error) { codeErr = String(r.error); return 'error'; }
            // ok, no code. The box sends this when nothing is in flight —
            // which, once it HAS handed us one, means the link landed.
            return 'none';
          } catch (e) { codeErr = String(e); return 'error'; }
        };
        // Until we have it there is nowhere useful to send the browser, so the
        // button says so instead of opening a page that can only fail.
        const paintCode = () => {
          const hint = document.getElementById('codehint');
          const signin = document.getElementById('openlink');
          const fresh = document.getElementById('newacct');
          if (signin) {
            signin.disabled = !state.linkCode;
            signin.textContent = state.linkCode
              ? 'I already have an account'
              : 'Getting your server\'s code…';
          }
          if (fresh) fresh.disabled = !state.linkCode;
          if (!hint) return;
          hint.innerHTML = state.linkCode
            ? `We'll fill in your server's code (<b>${esc(state.linkCode)}</b>) automatically.
               <span id="linkstate"></span>`
            : codeErr
              ? `Your server turned the request down: ${esc(codeErr)}
                 <span id="linkstate"></span>`
              : `Your server is asking for one — it needs a moment on the network first.
                 <span id="linkstate"></span>`;
        };
        await fetchLinkCode();
        paintCode();

        // Watch the box, if this device can reach it. When it can't (an office
        // LAN that isolates clients — the case this whole flow exists for) the
        // screen still works; it just can't congratulate you, and the box's
        // own display advances to the pair code either way.
        const gen = ++searchGen;
        let noneStreak = 0;
        const el = () => document.getElementById('linkstate');
        while (gen === searchGen) {
          const had = state.linkCode;
          const hadErr = codeErr;
          const got = await fetchLinkCode();
          if (gen !== searchGen) return;
          // REPAINT ON A CHANGED ERROR TOO, not only a changed code. Painting
          // only when the code changed meant a link step that started failing
          // kept showing "we'll fill in your box's code" forever while the
          // reason sat in a variable nobody rendered — the same invisible
          // failure this screen was rebuilt to remove, reintroduced hours later
          // by an optimisation that repainted less (2026-08-13).
          if (codeErr !== hadErr) paintCode();
          // LINKED, heard over Bluetooth. The watcher below asks the box over
          // the LAN, but `origin` is undefined on the Bluetooth path — so on
          // the very flow this screen exists for it could never see the answer,
          // and an owner who had just paid sat on a finished step with no way
          // on but "Skip" (2026-08-13). A box that gave us a code and now
          // reports nothing in flight has linked.
          // `had` catches the link landing while we watch. The streak catches
          // the other entry: an app opened fresh against a box that linked
          // earlier, where there is no transition to see — it has simply never
          // had a code. Either way a box with nothing in flight has no link
          // step left to do, and pairing (0x83) rides Bluetooth regardless of
          // whether the box ever reached the internet.
          if (got === 'none') noneStreak++; else noneStreak = 0;
          if (had ? got === 'none' : noneStreak >= 3) {
            if (el()) el().textContent = 'Nothing left to link — opening the last step…';
            await new Promise((r) => setTimeout(r, 900));
            if (gen !== searchGen) return;
            return goToPairing(server, ssid);
          }
          if (state.linkCode !== had) paintCode();
          const id = await boxIdentity(server.origin);
          if (gen !== searchGen) return;
          if (id && id.linked) {
            if (el()) el().textContent = 'Linked — opening the last step…';
            await new Promise((r) => setTimeout(r, 900));
            if (gen !== searchGen) return;
            return goToPairing(server, ssid);
          }
          if (id && el()) el().textContent = 'Waiting for the link to land…';
          await new Promise((r) => setTimeout(r, 3000));
        }
      }

      // ── INLINE SIGN-IN ────────────────────────────────────────────────────
      //
      // The existing-account door, without leaving the app. Atlas auth is
      // email OTP by design — no password ceremony (linking-plan.md) — which
      // is exactly the shape a webview can host safely: nothing here wants a
      // password manager, and no payment ever renders in-app. Checkout stays
      // in the real browser, where Apple Pay and card autofill live.
      //
      // Contract (atlas, routes/account.rs + routes/link.rs — documented in
      // linking-plan.md "Inline sign-in contract"):
      //   POST /account/login        {email}          → {sent:true}
      //   POST /account/login/verify {email, code}    → {token, email, entitled}
      //   POST /init/approve         {user_code} + Bearer → {approved:true}
      // Errors arrive as HTTP 4xx/5xx with {error:{code,message}} bodies;
      // atlasPost flattens them to {ok:false, code, error}. The codes that
      // matter here: `no_subscription` (routes to browser checkout — the one
      // deliberate hand-off), `link_not_found`/`link_expired` (re-fetch the
      // user_code and retry; the session token stays good, so neither costs a
      // second email round-trip).
      //
      // CORS is part of that contract: the airlock's origin is
      // `tauri://localhost` (macOS/Linux), `http://tauri.localhost` (Windows),
      // or the `virtues://` scheme (iOS) — atlas allows them with a wildcard
      // (`app_cors` in routes/mod.rs; the token is a bearer, never a cookie).
      // The CSPs in tauri.conf.json and tauri.ios.conf.json allow the
      // connect-src.
      //
      // EVERY failure keeps the browser door open — inline is an upgrade,
      // never a wall.
      const ATLAS = 'https://atlas.virtues.com';
      async function atlasPost(path, body, token) {
        const ctl = new AbortController();
        const t = setTimeout(() => ctl.abort(), 15000);
        try {
          const res = await fetch(ATLAS + path, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              ...(token ? { Authorization: 'Bearer ' + token } : {}),
            },
            body: JSON.stringify(body),
            signal: ctl.signal,
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            // Atlas's error shape is {error:{code,message}}. Anything else on
            // a non-2xx (a proxy error page, an old atlas) gets the status
            // named rather than shrugged at.
            const e = data && data.error;
            return {
              ok: false,
              code: (e && e.code) || '',
              error: (e && (e.message || e.code)) || `Atlas answered ${res.status}.`,
            };
          }
          return { ok: true, ...data };
        } catch {
          return {
            ok: false, transport: true, code: 'transport',
            error: `Couldn't reach atlas from ${THIS_DEVICE} — check its internet connection.`,
          };
        } finally {
          clearTimeout(t);
        }
      }

      function renderInlineSignin(server, ssid, errorText) {
        searchGen++; // stop the link watcher
        setServer(server.name);
        app.innerHTML = `
          <button class="backnav" id="back" aria-label="Back">←</button>
          <p class="kicker">Setting up</p>
          <h1>Sign in</h1>
          <p class="sub">The email on your Virtues account — we'll email you a
            six-digit code. There's no password.</p>
          ${errorText ? `<p class="msg err">${esc(errorText)}</p>` : ''}
          <form id="form">
            <label for="email">Email</label>
            <input id="email" type="email" inputmode="email" autocomplete="email"
                   autocapitalize="off" autocorrect="off" spellcheck="false"
                   placeholder="you@example.com" />
            <button class="primary" id="go" type="submit" disabled>Email me a code</button>
          </form>
          <div class="msg" id="msg"></div>
          <p class="escape"><button id="browser">Sign in with the browser instead</button></p>`;
        const email = document.getElementById('email');
        const go = document.getElementById('go');
        const say = (t, cls) => {
          const m = document.getElementById('msg');
          if (m) { m.className = 'msg ' + (cls || ''); m.textContent = t; }
        };
        // Deliverability is the server's problem; this only refuses the typos
        // that can't be an address at all.
        const plausible = () => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim());
        email.addEventListener('input', () => (go.disabled = !plausible()));
        document.getElementById('back').addEventListener('click', () =>
          renderLinkStep(server, ssid));
        // Fresh code at click time, not the cached state.linkCode: the owner
        // may have sat on this screen while atlas's 15-minute link lapsed, and
        // opening /signin with a stale (or empty) code is the dead-URL failure
        // the browser flow was rebuilt to avoid. Re-read over BLE first.
        document.getElementById('browser').addEventListener('click', async () => {
          let code = state.linkCode || '';
          if (server.bleId) {
            try {
              const r = await invoke('plugin:reach|improv_link_code', { id: server.bleId });
              if (r && r.ok && r.code) code = r.code;
            } catch { /* keep whatever we had */ }
          }
          openUrl(`${LINK_URL}/signin?code=${encodeURIComponent(code)}`);
        });
        document.getElementById('form').addEventListener('submit', async (e) => {
          e.preventDefault();
          if (!plausible()) return;
          const addr = email.value.trim();
          go.disabled = true;
          say('Sending…');
          const res = await atlasPost('/account/login', { email: addr });
          if (res && res.ok) return renderInlineCode(server, ssid, addr);
          renderInlineSignin(server, ssid,
            (res && res.error) || "Couldn't send the code.");
        });
        email.focus();
      }

      function renderInlineCode(server, ssid, email, errorText) {
        searchGen++;
        setServer(server.name);
        app.innerHTML = `
          <button class="backnav" id="back" aria-label="Back">←</button>
          <p class="kicker">Setting up</p>
          <h1>Enter the code we emailed</h1>
          <p class="sub">Sent to <b>${esc(email)}</b>. Six digits; it only lasts a
            few minutes.</p>
          ${errorText ? `<p class="msg err">${esc(errorText)}</p>` : ''}
          <form id="form">
            <input id="code" inputmode="numeric" autocomplete="one-time-code"
                   maxlength="7" placeholder="123 456" />
            <button class="primary" id="go" type="submit">Sign in</button>
          </form>
          <div class="msg" id="msg"></div>
          <p class="escape"><button id="resend">Email me a new code</button></p>`;
        const say = (t, cls) => {
          const m = document.getElementById('msg');
          if (m) { m.className = 'msg ' + (cls || ''); m.textContent = t; }
        };
        document.getElementById('back').addEventListener('click', () =>
          renderInlineSignin(server, ssid));
        const resend = document.getElementById('resend');
        resend.addEventListener('click', async () => {
          // Disable in flight: a double-tap fires two /account/login POSTs,
          // each sending another OTP email (and, with rotation, invalidating
          // the one the owner is about to type).
          if (resend.disabled) return;
          resend.disabled = true;
          say('Sending…');
          const res = await atlasPost('/account/login', { email });
          say(res && res.ok ? 'Sent. Check your email again.'
                            : (res && res.error) || "Couldn't send a new code.",
              res && res.ok ? 'ok' : 'err');
          resend.disabled = false;
        });
        document.getElementById('form').addEventListener('submit', async (e) => {
          e.preventDefault();
          const code = document.getElementById('code').value.replace(/\s+/g, '');
          if (code.length < 6) return say('Enter the six digits from the email.', 'err');
          document.getElementById('go').disabled = true;
          say('Checking…');
          const res = await atlasPost('/account/login/verify', { email, code });
          if (res && res.ok && res.token) {
            // `entitled` rides back with the session, so an account with no
            // subscription learns it NOW — before an approve that could only
            // answer no_subscription anyway.
            if (res.entitled === false) return renderInlineNoSub(server, ssid);
            return renderInlineApprove(server, ssid, res.token);
          }
          renderInlineCode(server, ssid, email,
            (res && res.error) || "That code didn't match.");
        });
        document.getElementById('code').focus();
      }

      // Signed in; now approve the box's own in-flight link. The user_code is
      // re-fetched over BLE at THIS moment, not carried from earlier — atlas
      // rotates the code, and approving a stale one is the same
      // opened-a-dead-URL failure the browser flow already fixed (2026-08-13).
      async function renderInlineApprove(server, ssid, token) {
        const gen = ++searchGen;
        setServer(server.name);
        const draw = (line) => {
          app.innerHTML = `
            <p class="kicker">Setting up</p>
            <h1>Linking ${esc(prettyBoxName(server.name))}</h1>
            <div class="wait"><span class="pip"></span><span id="stage">${esc(line)}</span></div>
            <button class="back" id="approveback" style="margin-top:20px">Taking too long? Go back</button>`;
          // A WAY OUT, always. This screen only awaits — a BLE read that hangs
          // or a slow atlas would otherwise strand the owner on a pip with no
          // button (live, 2026-08-24). Retiring the generation stops whatever
          // is in flight; the link step it lands on renders its controls before
          // it fetches, so it is never itself a dead end.
          const back = document.getElementById('approveback');
          if (back) back.addEventListener('click', () => { searchGen++; renderLinkStep(server, ssid); });
        };
        draw('Approving on your account…');
        // The user_code MUST come fresh from THIS server over BLE — atlas
        // rotates it, and `state.linkCode` is a global cached from the link
        // screen that can be stale or belong to a different box. Approving a
        // stale/cross-box code attaches the wrong link. So there is no cache
        // fallback: no fresh read → fail honestly and let Try again re-read.
        // Timeboxed: a dead/absent peripheral makes this invoke hang forever
        // (the exact stuck "Approving…" seen 2026-08-24 with no live box).
        let code = null;
        if (server.bleId) {
          try {
            const r = await withDeadline(
              invoke('plugin:reach|improv_link_code', { id: server.bleId }), 12000);
            if (r && r.ok && r.code) {
              code = r.code;
            } else if (r && r.ok) {
              // ok-and-empty is AMBIGUOUS (reach/commands.rs): it can mean the
              // link already landed, OR the box hasn't minted one yet (no
              // internet, or the prior link expired and its replacement isn't
              // up). Only "landed" if the box itself says linked — otherwise
              // it's "not ready", and skipping to pairing would leave the owner
              // who signed in specifically to link with an unlinked server.
              const id = await boxIdentity(server.origin);
              if (gen !== searchGen) return;
              if (id && id.linked) return goToPairing(server, ssid);
              return renderInlineFailed(server, ssid, token,
                "Your server hasn't finished asking to be linked yet — give it a moment, then try again.");
            }
          } catch { /* couldn't read — handled by the !code guard below */ }
        }
        if (gen !== searchGen) return;
        if (!code) {
          return renderInlineFailed(server, ssid, token,
            server.bleId
              ? "Couldn't read your server's link code just now. Try again — it takes a second."
              : "This server can't be linked from here. Finish linking on the device that set it up.");
        }
        const res = await atlasPost('/init/approve', { user_code: code }, token);
        if (gen !== searchGen) return;
        if (res && res.ok) {
          // Approved on the account; the box's own poll collects it. Watch
          // briefly so the advance is earned, then move on regardless —
          // pairing never required the link (PRESCRIBE, NEVER ENFORCE).
          const stage = () => document.getElementById('stage');
          if (stage()) stage().textContent = 'Waiting for your server to collect it…';
          const deadline = Date.now() + 45000;
          while (gen === searchGen && Date.now() < deadline) {
            if (server.bleId) {
              try {
                const r = await withDeadline(
                  invoke('plugin:reach|improv_link_code', { id: server.bleId }), 8000);
                if (r && r.ok && !r.code) break; // nothing in flight → landed
              } catch { /* keep watching */ }
            }
            const id = await boxIdentity(server.origin);
            if (gen !== searchGen) return;
            if (id && id.linked) break;
            await new Promise((r) => setTimeout(r, 2500));
          }
          if (gen !== searchGen) return;
          return goToPairing(server, ssid);
        }
        if (res && res.code === 'no_subscription') {
          return renderInlineNoSub(server, ssid);
        }
        if (res && (res.code === 'link_not_found' || res.code === 'link_expired')) {
          // The session is still good; only the code moved. Retry re-fetches
          // it over BLE, so this costs one tap, not a second email.
          return renderInlineFailed(server, ssid, token,
            "Your server's code changed while we were signing in. Try again — it takes a second.");
        }
        if (res && res.code === 'unauthorized') {
          return renderInlineSignin(server, ssid, 'That session expired — sign in again.');
        }
        renderInlineFailed(server, ssid, token,
          (res && res.error) || "Atlas couldn't approve the link.");
      }

      // An approve that failed, with the session still in hand: retrying costs
      // one tap and re-fetches a fresh user_code, so an expired code never
      // sends anyone back through email + OTP.
      function renderInlineFailed(server, ssid, token, why) {
        searchGen++;
        setServer(server.name);
        app.innerHTML = `
          <p class="kicker">Setting up</p>
          <h1>The link didn't land</h1>
          <p class="sub">${esc(why)}</p>
          <button class="primary" id="retry">Try again</button>
          <button class="secondary" id="back">Back</button>
          <p class="escape"><button id="skip">Skip linking for now</button></p>`;
        document.getElementById('retry').addEventListener('click', () =>
          renderInlineApprove(server, ssid, token));
        document.getElementById('back').addEventListener('click', () =>
          renderLinkStep(server, ssid));
        document.getElementById('skip').addEventListener('click', () =>
          goToPairing(server, ssid));
      }

      // Signed in, but the account holds no subscription. The one seam where
      // inline hands off to the browser on purpose: what comes next is
      // payment, and payment does not belong in an app-shaped webview.
      //
      // No `checkout_url` parameter: atlas's no_subscription answer is a plain
      // {error:{code,message}} and atlasPost strips every non-2xx body field
      // but ok/code/error — so a server-supplied URL never actually arrived.
      // The URL is built here, and the code is re-read fresh at click time.
      function renderInlineNoSub(server, ssid) {
        searchGen++;
        setServer(server.name);
        app.innerHTML = `
          <p class="kicker">Setting up</p>
          <h1>That account has no subscription yet</h1>
          <p class="sub">You're signed in, but nothing on the account covers a
            server. Checkout opens in your browser — cards and Apple Pay live
            there, not in this app. Come back here after; this screen notices
            on its own.</p>
          <button class="primary" id="checkout">Open checkout</button>
          <button class="secondary" id="back">Back</button>
          <p class="escape"><button id="skip">Skip linking for now</button></p>`;
        document.getElementById('checkout').addEventListener('click', async () => {
          // Fresh code at the click, not the cached state.linkCode: atlas
          // rotates codes, and /init/checkout refuses a stale one ("Link
          // expired") — a dead end at the worst moment. Re-read over BLE.
          let code = state.linkCode || '';
          if (server.bleId) {
            try {
              const r = await invoke('plugin:reach|improv_link_code', { id: server.bleId });
              if (r && r.ok && r.code) code = r.code;
            } catch { /* keep whatever we had */ }
          }
          openUrl(`${LINK_URL}/checkout?code=${encodeURIComponent(code)}`);
          // The browser has it now; the link-step watcher is the thing that
          // notices the checkout completing, so stand back on it.
          renderLinkStep(server, ssid);
        });
        document.getElementById('back').addEventListener('click', () =>
          renderLinkStep(server, ssid));
        document.getElementById('skip').addEventListener('click', () =>
          goToPairing(server, ssid));
      }

      // Which step is THIS box on? The box is the authority, so ask it. When
      // it can't be reached (an office LAN that isolates clients — the case
      // this flow exists for) fall to the LINK step: it is the one that
      // matters in exactly those environments, and it can always be skipped.
      async function routeToBox(server, ssid) {
        const id = await boxIdentity(server.origin);
        server = { ...server, name: Router.boxLabel({ identity: id, fallback: server.name }) };
        switch (Router.boxStep({ identity: id, hasBle: !!server.bleId })) {
          case 'pair': return goToPairing(server, ssid);
          case 'phrase-then-link':
            // CLAIM BEFORE ASKING — the `-` probe inside blePhrase makes this
            // free on firmware with no gate. See `Router.boxStep`.
            return blePhrase({ name: server.name, id: server.bleId }, null, () =>
              renderLinkStep(server, ssid));
          default: return renderLinkStep(server, ssid);
        }
      }

      function goToPairing(server, ssid) {
        searchGen++; // stop the link watcher
        // The Bluetooth path pairs ITSELF. The session already proved line of
        // sight (the phrase), and 0x85 hands over the code — so a chip list
        // with one chip that must be clicked was a step with no decision in
        // it. Go straight to renderCodeEntry, which runs the automatic pair
        // and falls back to the code form only when Bluetooth lets it down.
        if (server.bleId) return renderCodeEntry(server);
        renderPair(
          [server],
          '',
          `${ssid ? `Your server is on ${ssid}. ` : ''}When a 6-digit code shows on its display, select it below.`,
        );
      }

      /** The box's public identity + setup state, or null if unreachable.
       *  Timeboxed: on a client-isolating LAN (the case this whole flow exists
       *  for) `origin` is set but unreachable, and a bare fetch hangs for the
       *  OS connect timeout — inside a poll loop that stretches a 45s watch to
       *  minutes. 4s is longer than a healthy loopback answer, shorter than any
       *  wait a caller budgets around it. */
      async function boxIdentity(origin) {
        if (!origin) return null;
        const ctl = new AbortController();
        const t = setTimeout(() => ctl.abort(), 4000);
        try {
          const res = await fetch(origin + '/api/box/identity', { cache: 'no-store', signal: ctl.signal });
          return res.ok ? await res.json() : null;
        } catch {
          return null;
        } finally {
          clearTimeout(t);
        }
      }

      /** Open a URL in the user's real browser — checkout belongs there. */
      function openUrl(url) {
        // The opener plugin is desktop-only; mobile falls back to the webview's
        // own handler, which iOS routes to Safari.
        invoke('plugin:opener|open_url', { url }).catch(() => window.open(url, '_blank'));
      }

      function renderSearching() {
        setServer('');
        app.innerHTML = `
          <h1>Connect to your server</h1>
          <p class="sub">Looking for it on this network…</p>
          <div class="wait"><span class="pip"></span><span>Scanning</span></div>`;
      }

      // The app used to join the box's own setup network itself — a prefix
      // join against `Virtues-` via NEHotspotConfiguration, with the owner
      // typing the AP password off the box's screen. Those two screens
      // (`renderNewBox`, `joinSetupNetwork`) were deleted on 2026-08-17.
      //
      // They had already been UNREACHABLE for days: nothing called them but
      // each other, because BLE became the way in and `start()` stopped
      // routing here. Deleting them is not a behavior change; leaving them was
      // the risk, since the next person to read this file would reasonably
      // assume a screen in it can appear.
      //
      // What survives below is the LAN provisioning path — `loadNetworks` and
      // friends against `/api/provision/*`. That is the breakglass
      // (`setup_ap::AP_BREAKGLASS`): a box whose Bluetooth is dead in the
      // field can still be raised on its AP and provisioned from a machine
      // that joins it by hand. It is reached only through `findSetupBox`,
      // which asks each discovered box whether provisioning is open, so on a
      // normal LAN it never fires.

      // ── SETUP: the box has no network yet ─────────────────────────────────

      function bars(signal) {
        if (signal >= 70) return '▂▄▆';
        if (signal >= 40) return '▂▄ ';
        return '▂  ';
      }

      async function loadNetworks(errorText) {
        setServer('');
        app.innerHTML = `
          <p class="kicker">Setting up your server</p>
          <h1>Choose your server's Wi-Fi</h1>
          <p class="sub">These are the networks <b>your server</b> can see from where it is
            plugged in — not the ones ${THIS_DEVICE} can see.</p>
          <div class="wait"><span class="pip"></span><span>Asking the server what it can see…</span></div>`;
        let nets = [];
        let failed = null;
        try {
          nets = await invoke('plugin:reach|provision_networks', { server: state.origin });
        } catch (e) {
          failed = String(e);
        }
        state.networks = nets;
        renderNetworks(errorText || failed);
      }

      function renderNetworks(errorText) {
        const rows = state.networks.map((n, i) => `
          <button class="net" data-i="${i}">
            <span class="bars">${bars(n.signal)}</span>
            <span class="name">${esc(n.ssid)}</span>
            ${n.secured ? '<span class="lock">locked</span>' : '<span class="lock">open</span>'}
          </button>`).join('');
        app.innerHTML = `
          <p class="kicker">Setting up your server</p>
          <h1>Choose your server's Wi-Fi</h1>
          <p class="sub">These are the networks <b>your server</b> can see from where it is
            plugged in — not the ones ${THIS_DEVICE} can see.</p>
          ${errorText ? `<p class="msg err">${esc(errorText)}</p>` : ''}
          ${rows || '<p class="sub">Your server could not see any networks. Move it closer to your router, or plug in ethernet instead.</p>'}
          <button class="back" id="rescan">Search again</button>
          <p class="hint">Ethernet works too — plug the server in and this whole step disappears.</p>`;
        app.querySelectorAll('.net').forEach((el) => {
          el.addEventListener('click', () => choose(state.networks[+el.dataset.i]));
        });
        document.getElementById('rescan').addEventListener('click', () => loadNetworks());
      }

      function choose(n) {
        state.chosen = n;
        if (!n.secured) return join(null);
        // 802.1X: credential-per-user wifi (offices, WeWork). Two fields, and
        // the copy names whose credentials these are — the network operator's
        // account, not anything Virtues issued.
        const ent = !!n.enterprise;
        app.innerHTML = `
          <button class="backnav" id="back" aria-label="Back to networks">←</button>
          <h2>${esc(n.ssid)}</h2>
          ${ent ? `
          <p class="sub">This network uses per-person sign-in. Enter the account its
            operator gave you.</p>
          <label for="identity">Username</label>
          <input id="identity" type="text" autocomplete="username"
                 autocapitalize="off" autocorrect="off" />` : ''}
          <label for="psk">${ent ? 'Password' : 'Wi-Fi password'}</label>
          <!-- type=password + autocomplete: this is the ONE input that made the
               captive-portal flow worth replacing. iOS offers the saved network
               password here; in a captive webview it does not. -->
          <input id="psk" type="password" autocomplete="current-password"
                 autocapitalize="off" autocorrect="off" enterkeyhint="go" />
          <button class="primary" id="join" disabled>Join network</button>
          <p class="hint">${ent
            ? 'Your sign-in for this network — not the code on your server\'s display.'
            : `This is the password for your own Wi-Fi — the one ${THIS_DEVICE} is normally on. Not the code on your server's display.`}</p>`;
        const psk = document.getElementById('psk');
        const idf = document.getElementById('identity');
        const go = document.getElementById('join');
        // WPA2's floor is 8; enterprise account passwords have no floor we can
        // assume, so require anything non-empty (plus a username).
        const ok = () => (go.disabled = ent
          ? !(idf.value.trim() && psk.value)
          : psk.value.length < 8);
        psk.addEventListener('input', ok);
        if (idf) idf.addEventListener('input', ok);
        const submit = () => join(psk.value, idf ? idf.value.trim() : null);
        psk.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !go.disabled) submit();
        });
        go.addEventListener('click', submit);
        document.getElementById('back').addEventListener('click', () => renderNetworks());
        (idf || psk).focus();
      }

      async function join(psk, identity) {
        const ssid = state.chosen.ssid;
        renderSwitching(ssid);
        let res = { outcome: 'unknown', detail: null };
        try {
          res = await invoke('plugin:reach|provision_join', {
            server: state.origin, ssid, psk, identity: identity || null,
          });
        } catch {
          // A dead socket IS the switchover. Fall through to `unknown`.
        }
        if (res.outcome === 'failed') {
          // The box is still on its own AP and still reachable, so we can go
          // straight back to the list with NetworkManager's own words.
          return loadNetworks(res.detail || "Couldn't join that network.");
        }
        // 'joined' and 'unknown' are the same situation from here: the box's AP
        // is down either way and the only honest next move is to go and look.
        watchForBox(ssid);
      }

      function renderSwitching(ssid) {
        app.innerHTML = `
          <p class="kicker">Setting up your server</p>
          <h1>Joining ${esc(ssid)}</h1>
          <div class="wait"><span class="pip"></span><span>This takes up to a minute.</span></div>
          <p class="sub">Your server has to turn off its own setup network to join yours, so
            ${THIS_DEVICE} will drop off it now. It will go back to your normal Wi-Fi on its own
            — you don't have to do anything.</p>
          <ul class="steps">
            <li>Server leaves its setup network</li>
            <li>Server joins ${esc(ssid)}</li>
            <li>${THIS_DEVICE[0].toUpperCase() + THIS_DEVICE.slice(1)} rejoins your Wi-Fi</li>
            <li>We find the server again and finish up</li>
          </ul>`;
      }

      /**
       * Wait out the handoff, then work out how it went by looking.
       *
       * The signal is clean because of a box-side rule: the setup AP is raised
       * only while the box is unclaimed AND offline. So after this point —
       *
       *   a box on the owner's LAN            → the join worked, go and pair
       *   a box back on 10.42.0.x, setup-open → the join failed and the AP
       *                                         returned; back to the list
       *
       * Before that rule the AP came back on success too, and these two were
       * indistinguishable. See `maintenance::setup_ap`.
       */
      function watchForBox(ssid) {
        const DEADLINE_MS = 100_000;
        const started = Date.now();
        const tick = async () => {
          const { servers } = await discoverBoxes();
          const lan = servers.find((s) => !onSetupSubnet(s.origin));
          if (lan) {
            state.origin = lan.origin;
            return renderPair([lan], '', `Your server is on ${ssid}.`);
          }
          const setupBox = await findSetupBox(servers);
          if (setupBox) {
            state.origin = setupBox.origin;
            return loadNetworks(
              `Your server couldn't stay on ${ssid} and went back to its setup network. ` +
              `Check the password, or try a different network.`);
          }
          if (Date.now() - started > DEADLINE_MS) return renderLost(ssid);
          setTimeout(tick, 4000);
        };
        // First look after a beat: the phone has not left the dying AP yet.
        setTimeout(tick, 5000);
      }

      function renderLost(ssid) {
        app.innerHTML = `
          <h1>Can't see your server</h1>
          <p class="sub">It may have joined ${esc(ssid)} while ${THIS_DEVICE} is on a different
            network. Check that ${THIS_DEVICE} is back on your own Wi-Fi, then look again.</p>
          <button class="primary" id="again">Look again</button>
          <p class="hint">If it still doesn't appear, the server's display will show a setup
            network again when it has given up — you can start over from there. Plugging in
            ethernet always works.</p>`;
        document.getElementById('again').addEventListener('click', start);
      }

      // ── PAIR: the box is on a network; claim it ───────────────────────────

      // The box list. Chips ARE the action: tap a box → code entry for THAT
      // box. Nobody types an IP unless discovery failed them (the manual link).
      function renderPair(servers, debug, banner) {
        state.servers = servers;
        const chips = servers.map((s, i) => `
          <button class="box" data-i="${i}">
            <span class="dot"></span>
            <span>
              <b>${esc(s.name)}</b>
              <span class="boxstate">${s.claimed === false ? 'ready to set up' : s.claimed === true ? 'already set up' : ''}</span>
            </span>
            <span class="addr">${s.origin ? esc(s.origin.replace('http://', '')) : 'over Bluetooth'}</span>
          </button>`).join('');
        // Nothing found → the Bluetooth-first setup screen IS the empty
        // state; it keeps looking and routes itself. This branch only ever
        // renders a real list.
        if (!servers.length) return bleSearchLoop(banner);
        setServer(servers.length === 1 ? servers[0].name : '');
        app.innerHTML = `
          <h1>Connect to your server</h1>
          <p class="sub">${banner ? esc(banner) + ' ' : ''}Choose your server to pair it.</p>
          <div id="found">${chips}</div>
          <button class="back" id="newbox">Setting up a brand-new server? Start here →</button><br>
          <button class="back" id="manual">Enter an address manually</button>`;

        document.getElementById('newbox').addEventListener('click', () => startBleSetup());
        document.getElementById('manual').addEventListener('click', () => renderManualPair());
        const rescan = document.getElementById('rescan');
        if (rescan) rescan.addEventListener('click', (e) => { e.preventDefault(); start(); });
        app.querySelectorAll('.box').forEach((el) => {
          el.addEventListener('click', () => renderCodeEntry(state.servers[+el.dataset.i]));
        });
      }

      // Code entry for ONE chosen box. The code is the only thing left to
      // type, and mistyping the box is fail-closed anyway: a code only works
      // on the box that displayed it.
      async function renderCodeEntry(server) {
        let autoErr = '';
        setServer(server.name);
        // NOBODY TYPES THIS ON THE BLUETOOTH PATH. The six digits prove the
        // person can read the box's screen — a proof already made here, since
        // 0x83 requires a session and a session is opened only by the four
        // words printed on that same screen. Asking again was the last thing
        // in the whole flow anyone had to transcribe (2026-08-13).
        //
        // The form below stays for every other route: a LAN chip, a box older
        // than 0x85, and the case that pays for keeping it — an advertisement
        // claiming "already online" that is stale, where the panel is the only
        // honest source left.
        if (server.bleId) {
          app.innerHTML = `
            <p class="kicker">Almost there</p>
            <h1>Pairing</h1>
            <div class="wait"><span class="pip"></span><span>Asking your server to let this ${esc(THIS_DEVICE.replace(/^this /, ''))} in</span></div>
            <div class="msg" id="msg"></div>
            <button class="back" id="autocancel" style="margin-top:18px">Enter the code myself →</button>`;
          // A WAY OUT, always. This screen waits on the box and had no escape:
          // a Bluetooth call that hangs left an owner staring at a pip with no
          // button on the page (live, 2026-08-13).
          let cancelled = false;
          document.getElementById('autocancel').addEventListener('click', () => {
            cancelled = true;
          });
          // AND A DEADLINE, because a cancel button only helps someone who is
          // still watching. ensure_connected wraps `connect` in a timeout but
          // not `discover_services` or `subscribe`, so a stale peripheral can
          // hang past every timeout the Rust side has. 20s is longer than a
          // healthy fetch and shorter than anyone's patience.
          const withDeadline = (p, ms) =>
            Promise.race([p, new Promise((r) => setTimeout(() => r(null), ms))]);
          let auto = null;
          try {
            const r = await withDeadline(
              invoke('plugin:reach|improv_pair_code', { id: server.bleId }),
              20000,
            );
            if (r && r.ok && r.code) auto = r.code;
          } catch { /* fall through to the form */ }
          if (cancelled) auto = null;
          if (auto && !cancelled) {
            const done = await submitPairBle(server, auto);
            if (done.ok) return;
            // Fell through. Carry the reason onto the form: silence here reads
            // as the app having ignored the tap.
            autoErr = done.error;
          }
        }
        app.innerHTML = `
          <button class="backnav" id="back" aria-label="Back to servers">←</button>
          <p class="kicker">${esc(server.name)}${server.claimed === false ? ' · ready to set up' : ''}</p>
          <h1>Enter its code</h1>
          <p class="sub">The 6 digits on ${esc(server.name)}'s display right now.</p>
          <form id="form">
            <input id="code" inputmode="numeric" maxlength="7" placeholder="123 456" autofocus />
            <button class="primary" id="go" type="submit">Pair</button>
          </form>
          <div class="msg err" id="msg">${autoErr ? esc(autoErr) : ''}</div>
          <p class="hint">It rotates every few minutes — a fresh one always works. No display?
            Run <b>virtues pair</b> on the server.</p>
          ${server.bleId ? '<button class="back" id="blewifi">Set up its Wi-Fi instead</button>' : ''}`;
        document.getElementById('back').addEventListener('click', start);
        // The escape hatch for a stale "already online" advertisement: if the
        // user is here but the box actually needs wifi, the picker is a tap
        // away instead of a dead end.
        const blewifi = document.getElementById('blewifi');
        if (blewifi) blewifi.addEventListener('click', () =>
          bleWifiPicker({ id: server.bleId, name: server.name }));
        document.getElementById('form').addEventListener('submit', (e) => {
          e.preventDefault();
          // A chip carrying a BLE id pairs over Bluetooth — immune to LANs
          // that isolate clients; the box relays the code to itself (0x83).
          if (server.bleId) submitPairBle(server); else submitPair(server.origin);
        });
        document.getElementById('code').focus();
      }

      // The old combined form, demoted to the escape hatch for mDNS-hostile
      // networks and boxes discovery can't see.
      function renderManualPair(note) {
        setServer('');
        app.innerHTML = `
          <button class="backnav" id="back" aria-label="Back to servers">←</button>
          <h1>Connect by address</h1>
          ${note ? `<p class="sub">${esc(note)}</p>` : ''}
          <form id="form">
            <label for="server">Server address</label>
            <input id="server" inputmode="url" autocapitalize="off" autocorrect="off"
                   placeholder="virtues.local   or   192.168.1.x" />
            <label for="code">Pairing code</label>
            <input id="code" inputmode="numeric" maxlength="7" placeholder="123 456" />
            <button class="primary" id="go" type="submit">Pair</button>
          </form>
          <div class="msg" id="msg"></div>`;
        document.getElementById('back').addEventListener('click', () => renderEntry());
        document.getElementById('form').addEventListener('submit', (e) => {
          e.preventDefault();
          submitPair(document.getElementById('server').value.trim());
        });
      }

      // `server` is the chosen box's origin (chip flow) or whatever the manual
      // form holds — the caller decides, this just pairs against it.
      async function submitPair(server) {
        const msg = document.getElementById('msg');
        const go = document.getElementById('go');
        const say = (t, cls) => { msg.className = 'msg ' + (cls || ''); msg.textContent = t; };
        const code = document.getElementById('code').value.replace(/\s+/g, '');
        if (!server || code.length < 6) {
          return say('Enter the 6-digit code from the server\'s display.', 'err');
        }
        go.disabled = true;
        say('Pairing…');
        try {
          const status = await invoke('plugin:reach|pair', { payload: { server, code } });
          if (status.paired) {
            say('Paired — opening your server…', 'ok');
            await finishPairing(say);
          } else {
            say('Pairing did not complete. Check the code and try again.', 'err');
            go.disabled = false;
          }
        } catch (err) {
          say(String(err), 'err');
          go.disabled = false;
        }
      }

      // Pair over the box's Bluetooth (RPC 0x83). The Rust side mints the
      // device identity, the box redeems the code against its own consume
      // endpoint, and the pairing persists exactly as the LAN path's would —
      // so from here on the app can't tell which wire it paired over.
      /// `preset` is the code fetched over 0x85; without one this reads the
      /// form. Returns `{ ok, error }` rather than nothing, because the
      /// automatic path has no form to leave a message on and a failure there
      /// must survive long enough to be shown on the one that follows.
      async function submitPairBle(server, preset) {
        const msg = document.getElementById('msg');
        const go = document.getElementById('go');
        const say = (t, cls) => {
          if (!msg) return;
          msg.className = 'msg ' + (cls || '');
          msg.textContent = t;
        };
        const typed = document.getElementById('code');
        const code = (preset || (typed ? typed.value : '')).replace(/\s+/g, '');
        if (code.length < 6) {
          say('Enter the 6-digit code from the server\'s display.', 'err');
          return { ok: false, error: '' };
        }
        if (go) go.disabled = true;
        say('Pairing over Bluetooth…');
        try {
          const res = await invoke('plugin:reach|improv_pair', { id: server.bleId, code });
          if (res && res.ok) {
            say('Paired — opening your server…', 'ok');
            invoke('plugin:reach|improv_disconnect').catch(() => {});
            await finishPairing(say);
            return { ok: true };
          }
          const why = (res && res.error) || 'Pairing did not complete. Check the code and try again.';
          say(why, 'err');
          if (go) go.disabled = false;
          return { ok: false, error: why };
        } catch (err) {
          say(String(err), 'err');
          if (go) go.disabled = false;
          return { ok: false, error: String(err) };
        }
      }

      // ── launch ────────────────────────────────────────────────────────────
      //
      // ONE destination, decided once. This replaced two independent `if`
      // chains — one near the top of the script, one right here — which could
      // both fire: `#reset` on a device that is not locally paired drew the
      // forgot-us screen and then had the entry screen painted over it.
      //
      // AT THE BOTTOM, deliberately. Every screen function is a hoisted
      // declaration and would be reachable from anywhere, but `renderEntry`
      // touches `searchGen`, which is a `let` — dispatching before that binding
      // is initialized throws `Cannot access 'searchGen' before initialization`
      // and the airlock comes up blank. Found by running it; nothing about the
      // code says so.
      switch (Router.bootDestination({
        hash: location.hash,
        injectedPaired: !!window.__VIRTUES_PAIRED__,
      })) {
        case 'forgot-us':    renderBoxForgotUs(); break;
        case 'unreachable':  renderBoxUnreachable(); break;
        case 'probe-paired': bootPaired(); break;
        default:             renderEntry(); break;
      }
    </script>
  </body>
</html>
