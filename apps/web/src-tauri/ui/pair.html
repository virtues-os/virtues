<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect — Virtues</title>
  <style>
    /* Virtues warm brand (matches the site + install hero): cream surface,
       constellation serif headings, a single cerulean accent, warm-gray text,
       chalk hairlines. Standalone page (no app CSS), so tokens are inline. */
    :root {
      --bg: #FFFDF9;            /* comet-bright — page */
      --card: #FFFFFF;          /* card surface */
      --field: #F7F3EC;         /* comet — input fill */
      --border: #E8E3DA;        /* chalk — hairline */
      --heading: #14283D;       /* constellation — serif headings */
      --ink: #2A2622;           /* body text */
      --muted: #6B6359;         /* gravel — secondary */
      --faint: #B7AFA3;         /* fog — placeholders, hints */
      --accent: #1872A0;        /* cerulean — the one accent + CTA */
      --accent-hover: #155D82;
      --error: #932725;         /* cinder */
      --ok: #2F7D56;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      -webkit-app-region: drag;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      -webkit-app-region: no-drag;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 44px 36px;
      width: 440px;
      box-shadow: 0 1px 2px rgba(20,40,61,0.04), 0 18px 48px rgba(20,40,61,0.10);
    }

    .wordmark {
      font-family: ui-serif, Georgia, "Times New Roman", serif;
      font-size: 15px;
      color: var(--heading);
      letter-spacing: 0.2px;
      margin-bottom: 28px;
    }
    .wordmark .mark { color: var(--accent); margin-right: 6px; }

    h1 {
      font-family: ui-serif, Georgia, "Times New Roman", serif;
      font-size: 26px;
      font-weight: 500;
      letter-spacing: -0.2px;
      color: var(--heading);
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 13.5px;
      line-height: 1.5;
      color: var(--muted);
      margin-bottom: 28px;
    }
    .subtitle code {
      font-family: "SF Mono", ui-monospace, monospace;
      font-size: 12px;
      background: var(--field);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 1px 5px;
      color: var(--heading);
    }

    .label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    /* Server row */
    .server-row { display: flex; align-items: center; gap: 8px; margin-bottom: 22px; }
    #server-input {
      flex: 1; min-width: 0; min-height: 40px;
      background: var(--field);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 9px 12px;
      color: var(--ink);
      font-size: 14px;
    }
    #server-input:focus { outline: none; border-color: var(--accent); background: var(--card); }
    #server-input::placeholder { color: var(--faint); }

    #refresh-btn {
      -webkit-app-region: no-drag;
      padding: 9px 14px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--muted);
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      transition: border-color .15s, color .15s, background .15s;
    }
    #refresh-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* Code input */
    #code-input {
      width: 100%;
      padding: 12px 14px;
      background: var(--field);
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--heading);
      font-size: 24px;
      font-family: "SF Mono", ui-monospace, "JetBrains Mono", monospace;
      letter-spacing: 8px;
      text-align: center;
      text-transform: uppercase;
      margin-bottom: 26px;
    }
    #code-input:focus { outline: none; border-color: var(--accent); background: var(--card); }
    #code-input::placeholder { color: var(--faint); letter-spacing: 5px; }

    /* Connect — always alive (no dead-grey disabled state). Validates on click
       and guides inline if something's missing. Dims slightly until ready, but
       always reads as a live button. */
    #connect-btn {
      -webkit-app-region: no-drag;
      width: 100%;
      padding: 13px;
      background: var(--accent);
      border: none;
      border-radius: 9px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, opacity .15s, transform .05s;
    }
    #connect-btn:not(.ready) { opacity: 0.55; }
    #connect-btn:hover { background: var(--accent-hover); }
    #connect-btn:active { transform: translateY(1px); }

    #status { margin-top: 14px; font-size: 13px; min-height: 18px; text-align: center; line-height: 1.4; }
    #status.error { color: var(--error); }
    #status.info  { color: var(--muted); }
    #status.ok    { color: var(--ok); }
    #status .secs { color: var(--muted); }

    /* Inline spinner shown while a multi-second step (proxy start) runs, so the
       wait reads as live work rather than a frozen screen. */
    .spinner {
      display: inline-block;
      width: 11px; height: 11px;
      margin-right: 7px;
      vertical-align: -1px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Contextual banner — only shows when we arrived here because a prior
       pairing went stale (box reset) or the box is unreachable. Plain words,
       no jargon. */
    #banner {
      display: none;
      background: var(--field);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 9px;
      padding: 12px 14px;
      margin-bottom: 22px;
      font-size: 13px;
      line-height: 1.5;
      color: var(--ink);
    }
    #banner.show { display: block; }
    #banner .retry {
      -webkit-app-region: no-drag;
      margin-top: 8px;
      display: inline-block;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 5px 12px;
      color: var(--accent);
      font-size: 13px;
      cursor: pointer;
    }
    #banner .retry:hover { border-color: var(--accent); }
  </style>
</head>
<body>
  <div class="card">
    <div class="wordmark"><span class="mark">∴</span>Virtues</div>
    <div id="banner"></div>
    <h1>Connect to your box</h1>
    <p class="subtitle">Run <code>virtues pair</code> on your box and enter the code it prints. On the same Wi-Fi your box is found automatically — otherwise type its address (Tailscale IP, LAN IP, or hostname).</p>

    <div class="label">Your box</div>
    <div class="server-row">
      <input
        id="server-input"
        list="server-options"
        placeholder="Searching…"
        autocomplete="off"
        spellcheck="false"
        oninput="updateConnectBtn()"
      />
      <datalist id="server-options"></datalist>
      <button id="refresh-btn" onclick="refresh()">↺ Refresh</button>
    </div>

    <div class="label">Pairing code</div>
    <input
      id="code-input"
      type="text"
      maxlength="7"
      placeholder="ABC DEF"
      autocomplete="off"
      spellcheck="false"
      oninput="onCodeInput(this)"
    />

    <button id="connect-btn" onclick="connect()">Connect</button>
    <div id="status" class="info"></div>
  </div>

  <script>
    const invoke = window.__TAURI__?.core?.invoke;
    let servers = [];

    // How we got here (set by the launch decision via the URL hash):
    //   #reset       — box was reset/reinstalled, the old pairing is dead
    //   #unreachable — box paired but not reachable right now
    //   (none)       — fresh / first run
    const arrivalState = location.hash.replace('#', '');
    const BOX_URL = 'http://localhost:7117';

    function showBanner(html, withRetry) {
      const b = document.getElementById('banner');
      b.innerHTML = html + (withRetry ? '<br><button class="retry" onclick="retryReach()">Retry</button>' : '');
      b.classList.add('show');
    }

    // Unreachable: quietly re-check in the background so a box that was just
    // off/asleep reconnects on its own; Retry does the same on demand.
    let reachTimer = null;
    async function retryReach() {
      try {
        if (await invoke('recheck_box')) { window.location.href = BOX_URL; return true; }
      } catch (e) { /* ignore */ }
      return false;
    }
    function initArrival() {
      if (arrivalState === 'reset') {
        showBanner('Your box was reset, so this Mac needs to reconnect. Enter a fresh code below.', false);
      } else if (arrivalState === 'unreachable') {
        showBanner("We can't reach your box right now — it may be off, asleep, or on another network. We'll keep trying.", true);
        reachTimer = setInterval(retryReach, 4000);
      }
    }

    async function refresh() {
      setStatus('Searching for your box…', 'info');
      const dl = document.getElementById('server-options');
      const input = document.getElementById('server-input');
      dl.innerHTML = '';

      try {
        servers = await invoke('discover_servers') ?? [];
      } catch (e) {
        servers = [];
      }

      for (const s of servers) {
        const opt = document.createElement('option');
        opt.value = s.origin;       // e.g. http://adam.local:8000
        opt.label = s.name;
        dl.appendChild(opt);
      }

      if (servers.length > 0) {
        if (!input.value) input.value = servers[0].origin;
        setStatus(`Found ${servers.length} box${servers.length > 1 ? 'es' : ''} nearby.`, 'info');
      } else {
        setStatus("None found nearby — type your box's address (its Tailscale or LAN IP, e.g. 100.104.55.76).", 'info');
      }
      input.placeholder = 'e.g. 100.104.55.76  or  adam.local';
      updateConnectBtn();
    }

    function onCodeInput(el) {
      // Auto-insert space after 3 chars for "ABC DEF" feel
      let v = el.value.replace(/\s/g, '').toUpperCase();
      if (v.length > 3) v = v.slice(0, 3) + ' ' + v.slice(3, 6);
      el.value = v;
      updateConnectBtn();
    }

    function rawCode() {
      return document.getElementById('code-input').value.replace(/\s/g, '');
    }

    // Normalize whatever the user typed/picked into a full origin. Accepts a
    // bare IP/host ("100.x", "adam.local"), host:port, or a full URL; defaults
    // the scheme to http:// and the port to 8000 (the box's HTTP port).
    function normalizeServer(raw) {
      let s = (raw || '').trim();
      if (!s) return '';
      if (!/^https?:\/\//i.test(s)) s = 'http://' + s;
      try {
        const u = new URL(s);
        if (!u.port) u.port = '8000';
        return u.origin;
      } catch {
        return '';
      }
    }

    function serverValue() {
      return document.getElementById('server-input').value;
    }

    // Reflect readiness on the button WITHOUT disabling it — a dimmed-but-live
    // CTA reads as a working product; a hard-disabled grey one reads as broken.
    function isReady() {
      return rawCode().length === 6 && !!normalizeServer(serverValue());
    }
    function updateConnectBtn() {
      document.getElementById('connect-btn').classList.toggle('ready', isReady());
    }

    async function connect() {
      const code = rawCode();
      const server = normalizeServer(serverValue());
      // Validate on click (the button is always clickable) — guide, don't block.
      if (!server) { setStatus("Enter your box's address (or hit Refresh to find it).", 'error'); return; }
      if (code.length !== 6) { setStatus('Enter the 6-character code from `virtues pair`.', 'error'); return; }

      const btn = document.getElementById('connect-btn');
      btn.textContent = 'Connecting…';
      setStatus('', '');
      if (reachTimer) { clearInterval(reachTimer); reachTimer = null; }

      // Always start a connect from a clean slate: clears any stale creds + the
      // TOFU server-pin so re-pairing a RESET box (new identity key) doesn't get
      // refused by the old pin. A no-op on a truly fresh machine.
      try { await invoke('forget_pairing'); } catch (e) { /* best-effort */ }

      try {
        await invoke('pair_with_code', { server, code });
      } catch (e) {
        setStatus(e || 'Pairing failed. Check the code and address, then try again.', 'error');
        btn.textContent = 'Connect';
        return;
      }

      // install_helpers + the proxy bind together take several seconds with no
      // intermediate result — show a spinner + staged copy + elapsed counter so
      // the wait reads as live work, not a hang.
      startProgress([
        { at: 0, msg: 'Paired! Starting the local proxy…' },
        { at: 3, msg: 'Almost there — bringing the proxy online…' },
        { at: 8, msg: 'Taking longer than usual — still working…' },
      ]);
      try {
        await invoke('install_helpers', { server });
      } catch (e) {
        stopProgress();
        setStatus('Paired, but starting the local proxy failed: ' + e, 'error');
        btn.textContent = 'Connect';
        return;
      }

      // The proxy LaunchAgent starts asynchronously (launchctl kickstart) and
      // needs a moment to resolve the upstream and bind :7117. Poll until it
      // actually answers, then navigate — a blind timeout races the bind and
      // strands us on this page. Local virtues-client proxy (LOCAL_PROXY_PORT).
      const ready = await waitForProxy(20000);
      stopProgress();
      if (!ready) {
        setStatus('Paired, but the local proxy is taking a while to start. Retrying…', 'info');
      }
      window.location.href = 'http://localhost:7117';
    }

    // Animated, staged status during a multi-second step. `stages` is an
    // ascending list of {at: seconds, msg}; the latest message whose `at` has
    // elapsed is shown, prefixed with a spinner and a live (Ns) counter.
    let progressTimer = null;
    function startProgress(stages) {
      stopProgress();
      const t0 = performance.now();
      const render = () => {
        const elapsed = (performance.now() - t0) / 1000;
        let msg = stages[0].msg;
        for (const s of stages) { if (elapsed >= s.at) msg = s.msg; }
        const secs = Math.floor(elapsed);
        const el = document.getElementById('status');
        el.className = 'ok';
        el.innerHTML = '<span class="spinner"></span>' + msg +
          (secs >= 2 ? ' <span class="secs">(' + secs + 's)</span>' : '');
      };
      render();
      progressTimer = setInterval(render, 1000);
    }
    function stopProgress() {
      if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
    }

    // Resolve once the local proxy answers on :7117 (any HTTP response — even an
    // error/redirect — means the listener is up). no-cors so we only test
    // reachability, not response contents. Returns false if it never came up
    // within `timeoutMs`.
    async function waitForProxy(timeoutMs) {
      const deadline = performance.now() + timeoutMs;
      while (performance.now() < deadline) {
        try {
          await fetch('http://localhost:7117/', { mode: 'no-cors', cache: 'no-store' });
          return true;
        } catch (e) {
          await new Promise(r => setTimeout(r, 300));
        }
      }
      return false;
    }

    function setStatus(msg, cls) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = cls;
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') connect(); });

    // Contextual banner (reset / unreachable) + auto-discover the box.
    initArrival();
    refresh();
  </script>
</body>
</html>
