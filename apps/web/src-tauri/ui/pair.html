<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect — Virtues</title>
  <style>
    /* Virtues warm brand (matches the site + install hero): cream surface,
       constellation serif headings, a single cerulean accent, warm-gray text,
       chalk hairlines. Standalone page (no app CSS), so tokens are inline. */
    :root {
      --bg: #FFFDF9;            /* comet-bright — page */
      --card: #FFFFFF;          /* card surface */
      --field: #F7F3EC;         /* comet — input fill */
      --border: #E8E3DA;        /* chalk — hairline */
      --heading: #14283D;       /* constellation — serif headings */
      --ink: #2A2622;           /* body text */
      --muted: #6B6359;         /* gravel — secondary */
      --faint: #B7AFA3;         /* fog — placeholders, hints */
      --accent: #1872A0;        /* cerulean — the one accent + CTA */
      --accent-hover: #155D82;
      --error: #932725;         /* cinder */
      --ok: #2F7D56;
      /* Book serif — Charter/Iowan ship on macOS and give the essay (Tiempos-
         ish) feel with no webfont; graceful fallback elsewhere. */
      --serif: Charter, "Iowan Old Style", Georgia, "Times New Roman", serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      /* NOTE: no `-webkit-app-region: drag` here. The window has a native title
         bar (decorations on), so the OS handles dragging — and a body-wide drag
         region silently swallows clicks on controls in WKWebView (the Advanced
         toggle, etc. "did nothing"). Leave dragging to the title bar. */
      -webkit-font-smoothing: antialiased;
    }

    /* No card — an editorial column on the bare cream page (essay aesthetic).
       The macOS window itself is the only frame. */
    .card {
      -webkit-app-region: no-drag;
      width: 100%;
      max-width: 460px;
      padding: 0 24px;
      text-align: center;
    }

    /* Beacon: the ∴ mark as a centered hero, continuously emitting faint sonar
       rings — the app is *listening* for your box on the network (mDNS). The
       motion means something; it isn't decoration. On connect the rings switch
       to a faster green "locked on" pulse. */
    .beacon {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 54px; height: 44px;
      margin: 0 auto 12px;
    }
    .mark { display: block; position: relative; z-index: 2; }
    .mark circle { fill: var(--accent); }
    .sonar {
      position: absolute; left: 50%; top: 50%;
      width: 24px; height: 24px; margin: -12px 0 0 -12px;
      border: 1px solid var(--accent);
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;   /* decorative — never intercept clicks */
      animation: sonar 3.2s ease-out infinite;
    }
    .sonar:nth-of-type(2) { animation-delay: 1.07s; }
    .sonar:nth-of-type(3) { animation-delay: 2.14s; }
    @keyframes sonar {
      0%   { transform: scale(0.55); opacity: 0.32; }
      70%  { opacity: 0.06; }
      100% { transform: scale(3.4);  opacity: 0; }
    }
    .beacon.connecting .sonar {
      animation-duration: 1.1s;
      border-color: var(--ok);
    }
    .beacon.connecting .mark circle { fill: var(--ok); transition: fill .3s; }
    @media (prefers-reduced-motion: reduce) {
      .sonar { animation: none; }
    }

    .wordmark-text {
      font-family: var(--serif);
      font-size: 15px;
      color: var(--muted);
      letter-spacing: 0.4px;
      margin-bottom: 34px;
    }

    h1 {
      font-family: var(--serif);
      font-size: 32px;
      font-weight: 500;
      line-height: 1.18;
      letter-spacing: -0.3px;
      color: var(--heading);
      margin-bottom: 14px;
    }

    .subtitle {
      font-family: var(--serif);
      font-size: 16px;
      line-height: 1.55;
      color: var(--muted);
      margin-bottom: 28px;
      max-width: 30em;
      margin-left: auto;
      margin-right: auto;
    }
    /* Editorial inline link: a quiet dotted underline that solidifies on hover. */
    .doclink {
      -webkit-app-region: no-drag;
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px dotted var(--accent);
      cursor: pointer;
    }
    .doclink:hover { border-bottom-style: solid; }

    /* Segmented pairing-code field: six digit cells with the dissolve canvas
       overlaid. A wider gap after the third cell reads as "123 456". */
    .code-wrap { position: relative; margin-bottom: 14px; }
    .code-cells { display: flex; gap: 8px; justify-content: center; }
    .code-cells .gap { width: 18px; flex: 0 0 18px; }
    /* Underline cells, not filled boxes — lines read as "classic/editorial"
       and sit calmly on the bare page. */
    .cell {
      -webkit-app-region: no-drag;
      width: 38px; height: 52px;
      background: transparent;
      border: none;
      border-bottom: 2px solid var(--border);
      border-radius: 0;
      color: var(--heading);
      font-size: 30px;
      font-family: var(--serif);
      text-align: center;
      caret-color: var(--accent);
      transition: border-color .12s;
    }
    .cell:focus { outline: none; border-bottom-color: var(--accent); }
    .code-canvas {
      position: absolute; left: 0; top: 0;
      pointer-events: none;
    }

    #found-line {
      font-size: 12.5px;
      line-height: 1.5;
      color: var(--muted);
      text-align: center;
      min-height: 18px;
      margin-bottom: 22px;
    }
    #found-line .name { color: var(--heading); font-weight: 600; }

    /* Connect — a quiet ghost pill that FILLS with the accent only once a full
       code is in (the affordance: it "completes" as you finish typing). The
       primary path is auto-submit on the sixth digit; this is the calm,
       editorial fallback, not a heavy SaaS CTA. */
    #connect-btn {
      -webkit-app-region: no-drag;
      display: inline-block;
      min-width: 150px;
      padding: 10px 28px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background .18s ease, border-color .18s ease, color .18s ease, transform .05s ease;
    }
    #connect-btn:hover { border-color: var(--accent); color: var(--accent); }
    #connect-btn.ready {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    #connect-btn.ready:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: #fff; }
    #connect-btn:active { transform: translateY(1px); }

    #status { margin-top: 14px; font-size: 13px; min-height: 18px; text-align: center; line-height: 1.4; }
    #status.error { color: var(--error); }
    #status.info  { color: var(--muted); }
    #status.ok    { color: var(--ok); }
    #status .secs { color: var(--muted); }

    /* Inline spinner shown while a multi-second step (proxy start) runs, so the
       wait reads as live work rather than a frozen screen. */
    .spinner {
      display: inline-block;
      width: 11px; height: 11px;
      margin-right: 7px;
      vertical-align: -1px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Contextual callout — only shows when a prior pairing went stale (box
       reset), the box is unreachable, or this Mac is offline. Plain words,
       weather-report tone, never an error. */
    #callout {
      display: none;
      background: var(--field);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 9px;
      padding: 12px 14px;
      margin-bottom: 22px;
      font-size: 13px;
      line-height: 1.5;
      color: var(--ink);
    }
    #callout.show { display: block; }
    #callout .retry {
      -webkit-app-region: no-drag;
      margin-top: 8px;
      display: inline-block;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 5px 12px;
      color: var(--accent);
      font-size: 13px;
      cursor: pointer;
    }
    #callout .retry:hover { border-color: var(--accent); }

    /* Advanced — power-user disclosure: manual address + BYO server. A quiet
       text toggle (hover pill), animated open/close. No divider rule. */
    .advanced { margin-top: 26px; }
    .adv-toggle {
      -webkit-app-region: no-drag;
      background: transparent;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 12.5px;
      color: var(--muted);
      padding: 7px 14px;
      border-radius: 999px;
      transition: background .15s ease, color .15s ease;
      user-select: none;
    }
    .adv-toggle:hover { background: var(--field); color: var(--heading); }
    .adv-toggle .chev { display: inline-block; color: var(--faint); transition: transform .25s ease; }
    .adv-toggle.open .chev { transform: rotate(90deg); }
    .adv-body {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height .28s ease-in-out, opacity .28s ease-in-out;
    }
    .adv-body.open { max-height: 260px; opacity: 1; }
    .adv-body .inner { padding-top: 16px; text-align: left; }
    .label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .server-row { display: flex; align-items: center; gap: 8px; }
    #server-input {
      -webkit-app-region: no-drag;
      flex: 1; min-width: 0; min-height: 40px;
      background: var(--field);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 9px 12px;
      color: var(--ink);
      font-size: 14px;
    }
    #server-input:focus { outline: none; border-color: var(--accent); background: var(--card); }
    #server-input::placeholder { color: var(--faint); }
    #refresh-btn {
      -webkit-app-region: no-drag;
      padding: 9px 14px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--muted);
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      transition: border-color .15s, color .15s, background .15s;
    }
    #refresh-btn:hover { border-color: var(--accent); color: var(--accent); }
    .byo {
      margin-top: 12px;
      font-size: 12.5px;
      line-height: 1.55;
      color: var(--muted);
    }
    .byo code {
      font-family: "SF Mono", ui-monospace, monospace;
      font-size: 11.5px;
      background: var(--field);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 1px 5px;
      color: var(--heading);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="beacon" id="beacon">
      <span class="sonar"></span>
      <span class="sonar"></span>
      <span class="sonar"></span>
      <!-- ∴ therefore: one dot on top, two below (apex up). -->
      <svg class="mark" width="26" height="21" viewBox="0 0 22 18" aria-hidden="true">
        <circle cx="11" cy="4" r="2.4"></circle>
        <circle cx="5" cy="13.5" r="2.4"></circle>
        <circle cx="17" cy="13.5" r="2.4"></circle>
      </svg>
    </div>
    <div class="wordmark-text">Virtues</div>

    <div id="callout"></div>

    <h1>Every Virtues begins with an introduction.</h1>
    <p class="subtitle">Type the six-digit code shown on your box. On the same
      network it answers on its own; from afar, it finds its way home —
      <a class="doclink" onclick="openDocs()">how that works</a>.</p>

    <div class="code-wrap">
      <div class="code-cells" id="code-cells">
        <input class="cell" inputmode="numeric" pattern="[0-9]*" maxlength="1" data-i="0" aria-label="Digit 1 of 6" autocomplete="off">
        <input class="cell" inputmode="numeric" pattern="[0-9]*" maxlength="1" data-i="1" aria-label="Digit 2 of 6" autocomplete="off">
        <input class="cell" inputmode="numeric" pattern="[0-9]*" maxlength="1" data-i="2" aria-label="Digit 3 of 6" autocomplete="off">
        <span class="gap"></span>
        <input class="cell" inputmode="numeric" pattern="[0-9]*" maxlength="1" data-i="3" aria-label="Digit 4 of 6" autocomplete="off">
        <input class="cell" inputmode="numeric" pattern="[0-9]*" maxlength="1" data-i="4" aria-label="Digit 5 of 6" autocomplete="off">
        <input class="cell" inputmode="numeric" pattern="[0-9]*" maxlength="1" data-i="5" aria-label="Digit 6 of 6" autocomplete="off">
      </div>
      <canvas class="code-canvas" id="code-canvas" aria-hidden="true"></canvas>
    </div>

    <div id="found-line"></div>

    <button id="connect-btn" onclick="connect()">Connect</button>
    <div id="status" class="info"></div>

    <div class="advanced">
      <button class="adv-toggle" id="adv-toggle" onclick="toggleAdvanced()" aria-expanded="false">
        <span class="chev">▸</span> Advanced — connect by address
      </button>
      <div class="adv-body" id="adv-body">
        <div class="inner">
          <div class="label">Your box's address</div>
          <div class="server-row">
            <input
              id="server-input"
              list="server-options"
              placeholder="e.g. 100.104.55.76  or  adam.local"
              autocomplete="off"
              spellcheck="false"
              oninput="updateConnectBtn()"
            />
            <datalist id="server-options"></datalist>
            <button id="refresh-btn" onclick="refresh()">↺ Refresh</button>
          </div>
          <p class="byo">
            Running your own server? Type <code>virtues pair</code> on it for a code and a link.
          </p>
        </div>
      </div>
    </div>
  </div>

  <script src="particles.js"></script>
  <script>
    const invoke = window.__TAURI__?.core?.invoke;
    let servers = [];
    let discoveredOrigin = '';   // first auto-discovered box (used when Advanced is empty)
    let inProgress = false;      // guards double-submit (auto-submit + Enter + click)

    // How we got here (set by the launch decision via the URL hash):
    //   #reset       — box was reset/reinstalled, the old pairing is dead
    //   #unreachable — box paired but not reachable right now
    //   (none)       — fresh / first run
    const arrivalState = location.hash.replace('#', '');
    const BOX_URL = 'http://localhost:7117';
    const reducedMotion = window.matchMedia &&
      window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // ── Cells ────────────────────────────────────────────────────────────────
    const cells = Array.from(document.querySelectorAll('.cell'));
    function rawCode() { return cells.map(c => c.value).join(''); }
    function focusCell(i) { if (cells[i]) cells[i].focus(); }
    function clearCells() { cells.forEach(c => { c.value = ''; }); focusCell(0); updateConnectBtn(); }

    cells.forEach((cell, i) => {
      cell.addEventListener('input', () => {
        // Keep only the last typed digit; ignore non-digits entirely.
        const d = cell.value.replace(/\D/g, '');
        cell.value = d ? d[d.length - 1] : '';
        if (cell.value && i < cells.length - 1) focusCell(i + 1);
        updateConnectBtn();
        if (rawCode().length === 6) maybeAutoSubmit();
      });
      cell.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !cell.value && i > 0) {
          focusCell(i - 1);
          cells[i - 1].value = '';
          e.preventDefault();
          updateConnectBtn();
        } else if (e.key === 'ArrowLeft' && i > 0) {
          focusCell(i - 1); e.preventDefault();
        } else if (e.key === 'ArrowRight' && i < cells.length - 1) {
          focusCell(i + 1); e.preventDefault();
        } else if (e.key === 'Enter') {
          connect();
        }
      });
      cell.addEventListener('focus', () => cell.select());
      cell.addEventListener('paste', (e) => {
        e.preventDefault();
        const digits = (e.clipboardData || window.clipboardData).getData('text')
          .replace(/\D/g, '').slice(0, 6);
        cells.forEach((c, j) => { c.value = digits[j] || ''; });
        focusCell(Math.min(digits.length, cells.length - 1));
        updateConnectBtn();
        if (digits.length === 6) maybeAutoSubmit();
      });
    });

    function maybeAutoSubmit() {
      if (!inProgress && rawCode().length === 6) connect();
    }

    // ── Callout (diagnose-driven) ──────────────────────────────────────────────
    function showCallout(html, withRetry) {
      const c = document.getElementById('callout');
      c.innerHTML = html + (withRetry ? '<br><button class="retry" onclick="retryReach()">Retry</button>' : '');
      c.classList.add('show');
    }
    function hideCallout() { document.getElementById('callout').classList.remove('show'); }

    const CALLOUT = {
      stale_bearer: ["Your box was reset, so this Mac needs a fresh introduction. Type the new code below.", false],
      box_unreachable: ["We can't reach your box — it may be off or asleep, or this network may be blocking it (common on work or café Wi-Fi). Try from home; you can move the box afterward.", true],
      device_offline: ["This Mac isn't online. Reconnect to Wi-Fi and we'll pick up where we left off.", true],
    };

    let reachTimer = null;
    async function retryReach() {
      try {
        if (await invoke('recheck_box')) { window.location.href = BOX_URL; return true; }
      } catch (e) { /* ignore */ }
      // Re-diagnose so the message tracks reality if it changed.
      await diagnoseAndRender();
      return false;
    }

    // Ask the Rust side WHY the box is unreachable and render the matching copy.
    // Falls back to the arrival-hash copy if the command isn't available.
    async function diagnoseAndRender() {
      let state = arrivalState === 'reset' ? 'stale_bearer'
                : arrivalState === 'unreachable' ? 'box_unreachable'
                : null;
      try {
        const v = await invoke('diagnose_box');
        if (v === 'ok') { window.location.href = BOX_URL; return; }
        if (v) state = v;
      } catch (e) { /* command absent — keep the hash-derived state */ }
      if (!state) { hideCallout(); return; }
      const [msg, retry] = CALLOUT[state] || CALLOUT.box_unreachable;
      showCallout(msg, retry);
      if (state === 'stale_bearer') focusCell(0);
    }

    function initArrival() {
      if (arrivalState !== 'reset' && arrivalState !== 'unreachable') return;
      diagnoseAndRender();
      if (arrivalState === 'unreachable') reachTimer = setInterval(retryReach, 4000);
    }

    // ── Discovery (auto-fill the box address; surfaced quietly) ─────────────────
    async function refresh() {
      setFound('searching');
      const dl = document.getElementById('server-options');
      dl.innerHTML = '';
      try {
        servers = await invoke('discover_servers') ?? [];
      } catch (e) {
        servers = [];
      }
      for (const s of servers) {
        const opt = document.createElement('option');
        opt.value = s.origin;       // e.g. http://adam.local:8000
        opt.label = s.name;
        dl.appendChild(opt);
      }
      if (servers.length > 0) {
        discoveredOrigin = servers[0].origin;
        setFound('found', servers[0].name || 'your box', servers.length);
      } else {
        discoveredOrigin = '';
        setFound('none');
      }
      updateConnectBtn();
    }

    // Defensive: render a human name even if the sidecar handed us a raw mDNS
    // instance fqdn (e.g. "virtues._http._tcp.local.").
    function cleanName(s) {
      s = (s || '').trim();
      const svc = s.indexOf('._');
      if (svc > 0) s = s.slice(0, svc);
      s = s.replace(/\.local\.?$/i, '');
      return s || 'your box';
    }

    function setFound(state, name, count) {
      const el = document.getElementById('found-line');
      if (state === 'searching') {
        el.textContent = 'Looking for your box on this network…';
      } else if (state === 'found') {
        const extra = count > 1 ? ' (' + (count - 1) + ' more — see Advanced)' : '';
        el.innerHTML = 'Found <span class="name"></span> nearby.' + extra;
        el.querySelector('.name').textContent = cleanName(name);
      } else {
        el.textContent = 'No box answered yet — open Advanced to enter its address.';
      }
    }

    // Normalize whatever the user typed/picked into a full origin. Accepts a
    // bare IP/host ("100.x", "adam.local"), host:port, or a full URL; defaults
    // the scheme to http:// and the port to 8000 (the box's HTTP port).
    function normalizeServer(raw) {
      let s = (raw || '').trim();
      if (!s) return '';
      if (!/^https?:\/\//i.test(s)) s = 'http://' + s;
      try {
        const u = new URL(s);
        if (!u.port) u.port = '8000';
        return u.origin;
      } catch {
        return '';
      }
    }

    function serverValue() { return document.getElementById('server-input').value; }
    // The chosen box: an explicit Advanced address wins; otherwise the
    // auto-discovered one.
    function chosenServer() { return normalizeServer(serverValue()) || discoveredOrigin || ''; }

    function isReady() { return rawCode().length === 6 && !!chosenServer(); }
    function updateConnectBtn() {
      document.getElementById('connect-btn').classList.toggle('ready', isReady());
    }

    // ── Connect ────────────────────────────────────────────────────────────────
    async function connect() {
      if (inProgress) return;
      const code = rawCode();
      const server = chosenServer();
      if (code.length !== 6) { setStatus('Type the six-digit code shown on your box.', 'error'); return; }
      if (!server) {
        setStatus("We couldn't find your box automatically — open Advanced to enter its address.", 'error');
        openAdvanced();
        return;
      }

      inProgress = true;
      hideCallout();
      document.getElementById('beacon').classList.add('connecting'); // sonar → locked-on
      if (reachTimer) { clearInterval(reachTimer); reachTimer = null; }
      const btn = document.getElementById('connect-btn');
      btn.textContent = 'Connecting…';
      setStatus('', '');

      // Dissolve the typed code (cosmetic) IN PARALLEL with the network calls —
      // never block forward motion on an animation.
      dissolveCode();

      // Always start from a clean slate: clears any stale creds + the TOFU
      // server-pin so re-pairing a RESET box (new identity key) isn't refused by
      // the old pin. A no-op on a truly fresh machine.
      try { await invoke('forget_pairing'); } catch (e) { /* best-effort */ }

      try {
        await invoke('pair_with_code', { server, code });
      } catch (e) {
        restoreCells();
        setStatus(e || 'That code didn\'t work — check it and try again.', 'error');
        btn.textContent = 'Connect';
        inProgress = false;
        return;
      }

      // install_helpers + the proxy bind together take several seconds with no
      // intermediate result — show a spinner + staged copy + elapsed counter so
      // the wait reads as live work, not a hang.
      startProgress([
        { at: 0, msg: 'Introductions made. Bringing your box online…' },
        { at: 3, msg: 'Almost there…' },
        { at: 8, msg: 'Still working — this can take a moment…' },
      ]);
      try {
        await invoke('install_helpers', { server });
      } catch (e) {
        stopProgress();
        restoreCells();
        setStatus('Connected, but starting the local link failed: ' + e, 'error');
        btn.textContent = 'Connect';
        inProgress = false;
        return;
      }

      // The proxy LaunchAgent starts asynchronously (launchctl kickstart) and
      // needs a moment to resolve the upstream and bind :7117. Poll until it
      // actually answers, then navigate.
      const ready = await waitForProxy(20000);
      stopProgress();
      if (!ready) {
        setStatus('Connected — the local link is taking a moment to start…', 'info');
      }
      window.location.href = BOX_URL;
    }

    // ── Dissolve ────────────────────────────────────────────────────────────────
    function dissolveCode() {
      if (reducedMotion || !window.VirtuesParticles) { cells.forEach(c => c.style.opacity = '0'); return; }
      const wrap = document.querySelector('.code-cells');
      const canvas = document.getElementById('code-canvas');
      const rect = wrap.getBoundingClientRect();
      const styles = getComputedStyle(cells[0]);
      cells.forEach(c => c.style.opacity = '0');
      window.VirtuesParticles.dissolveText(canvas, {
        text: rawCode().slice(0, 3) + '  ' + rawCode().slice(3),
        font: styles.fontFamily,
        fontSize: parseFloat(styles.fontSize),
        color: getComputedStyle(document.documentElement).getPropertyValue('--heading').trim() || '#14283D',
        width: rect.width,
        height: rect.height,
      });
    }
    function restoreCells() {
      const canvas = document.getElementById('code-canvas');
      const ctx = canvas.getContext && canvas.getContext('2d');
      if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
      cells.forEach(c => c.style.opacity = '1');
      document.getElementById('beacon').classList.remove('connecting'); // back to listening
      clearCells();
    }

    // ── Staged progress ──────────────────────────────────────────────────────
    let progressTimer = null;
    function startProgress(stages) {
      stopProgress();
      const t0 = performance.now();
      const render = () => {
        const elapsed = (performance.now() - t0) / 1000;
        let msg = stages[0].msg;
        for (const s of stages) { if (elapsed >= s.at) msg = s.msg; }
        const secs = Math.floor(elapsed);
        const el = document.getElementById('status');
        el.className = 'ok';
        el.innerHTML = '<span class="spinner"></span>' + msg +
          (secs >= 2 ? ' <span class="secs">(' + secs + 's)</span>' : '');
      };
      render();
      progressTimer = setInterval(render, 1000);
    }
    function stopProgress() {
      if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
    }

    // Resolve once the local proxy answers on :7117 (any HTTP response — even an
    // error/redirect — means the listener is up). no-cors so we only test
    // reachability, not response contents.
    async function waitForProxy(timeoutMs) {
      const deadline = performance.now() + timeoutMs;
      while (performance.now() < deadline) {
        try {
          await fetch('http://localhost:7117/', { mode: 'no-cors', cache: 'no-store' });
          return true;
        } catch (e) {
          await new Promise(r => setTimeout(r, 300));
        }
      }
      return false;
    }

    function setStatus(msg, cls) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = cls;
    }

    // Advanced disclosure — animated (max-height/opacity ease-in-out), since
    // WKWebView won't animate a native <details>.
    function toggleAdvanced(force) {
      const btn = document.getElementById('adv-toggle');
      const body = document.getElementById('adv-body');
      const open = typeof force === 'boolean' ? force : !body.classList.contains('open');
      body.classList.toggle('open', open);
      btn.classList.toggle('open', open);
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    }
    function openAdvanced() {
      toggleAdvanced(true);
      document.getElementById('server-input').focus();
    }

    // Open external docs via the opener plugin (the bootstrap webview can't
    // navigate away itself); fall back to window.open in a plain browser.
    function openDocs() {
      const url = 'https://virtues.com/docs/remote-access';
      try { invoke('plugin:opener|open_url', { url }); }
      catch (e) { window.open(url, '_blank'); }
    }

    // ── Boot ─────────────────────────────────────────────────────────────────
    initArrival();
    refresh();
    focusCell(0);
  </script>
</body>
</html>
