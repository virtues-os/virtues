<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect — Virtues</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f10;
      color: #e8e8e8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      -webkit-app-region: drag;
    }

    .card {
      -webkit-app-region: no-drag;
      background: #1a1a1c;
      border: 1px solid #2a2a2e;
      border-radius: 12px;
      padding: 40px 48px;
      width: 420px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.3px;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13px;
      color: #888;
      margin-bottom: 32px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #666;
      margin-bottom: 10px;
    }

    /* Server list */
    .server-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    #server-input {
      flex: 1;
      min-width: 0;
      min-height: 36px;
      background: #111113;
      border: 1px solid #2a2a2e;
      border-radius: 8px;
      padding: 8px 12px;
      color: #e8e8e8;
      font-size: 14px;
    }
    #server-input:focus { outline: none; border-color: #5a5a9a; }
    #server-input::placeholder { color: #555; }

    #refresh-btn {
      margin-left: 10px;
      padding: 8px 14px;
      background: transparent;
      border: 1px solid #2a2a2e;
      border-radius: 8px;
      color: #aaa;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      transition: border-color 0.15s, color 0.15s;
    }
    #refresh-btn:hover { border-color: #555; color: #e8e8e8; }

    /* Code input */
    #code-input {
      width: 100%;
      padding: 10px 14px;
      background: #111113;
      border: 1px solid #2a2a2e;
      border-radius: 8px;
      color: #e8e8e8;
      font-size: 22px;
      font-family: "SF Mono", "JetBrains Mono", monospace;
      letter-spacing: 6px;
      text-align: center;
      text-transform: uppercase;
      margin-bottom: 28px;
    }
    #code-input:focus { outline: none; border-color: #5a5a9a; }
    #code-input::placeholder { color: #444; letter-spacing: 4px; }

    /* Connect button */
    #connect-btn {
      width: 100%;
      padding: 12px;
      background: #4a4a8a;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    #connect-btn:hover:not(:disabled) { background: #5a5a9a; }
    #connect-btn:disabled { background: #2a2a3a; color: #666; cursor: default; }

    /* Status / error */
    #status {
      margin-top: 16px;
      font-size: 13px;
      min-height: 20px;
      text-align: center;
    }
    #status.error { color: #e05555; }
    #status.info  { color: #888; }
    #status.ok    { color: #4caf50; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Connect to your server</h1>
    <p class="subtitle">Enter the code from <code style="color:#aaa">virtues login</code> on your server. On the same Wi-Fi it's found automatically — otherwise type its address (Tailscale IP, LAN IP, or hostname).</p>

    <div class="section-label">Server</div>
    <div class="server-row">
      <input
        id="server-input"
        list="server-options"
        placeholder="Searching…"
        autocomplete="off"
        spellcheck="false"
        oninput="updateConnectBtn()"
      />
      <datalist id="server-options"></datalist>
      <button id="refresh-btn" onclick="refresh()">↺ Refresh</button>
    </div>

    <div class="section-label">Code</div>
    <input
      id="code-input"
      type="text"
      maxlength="7"
      placeholder="ABC DEF"
      autocomplete="off"
      spellcheck="false"
      oninput="onCodeInput(this)"
    />

    <button id="connect-btn" onclick="connect()" disabled>Connect</button>
    <div id="status" class="info"></div>
  </div>

  <script>
    const invoke = window.__TAURI__?.core?.invoke;

    let servers = [];

    async function refresh() {
      setStatus('Searching…', 'info');
      const dl = document.getElementById('server-options');
      const input = document.getElementById('server-input');
      dl.innerHTML = '';

      try {
        servers = await invoke('discover_servers') ?? [];
      } catch (e) {
        servers = [];
      }

      for (const s of servers) {
        const opt = document.createElement('option');
        opt.value = s.origin;       // e.g. http://adam.local:8000
        opt.label = s.name;
        dl.appendChild(opt);
      }

      if (servers.length > 0) {
        if (!input.value) input.value = servers[0].origin;
        setStatus(`Found ${servers.length} server${servers.length > 1 ? 's' : ''} nearby.`, 'info');
      } else {
        setStatus("None found nearby — type your server's address (its Tailscale or LAN IP, e.g. 100.104.55.76).", 'info');
      }
      input.placeholder = 'e.g. 100.104.55.76  or  adam.local';
      updateConnectBtn();
    }

    function onCodeInput(el) {
      // Auto-insert space after 3 chars for "ABC DEF" feel
      let v = el.value.replace(/\s/g, '').toUpperCase();
      if (v.length > 3) v = v.slice(0, 3) + ' ' + v.slice(3, 6);
      el.value = v;
      updateConnectBtn();
    }

    function rawCode() {
      return document.getElementById('code-input').value.replace(/\s/g, '');
    }

    // Normalize whatever the user typed/picked into a full origin. Accepts a
    // bare IP/host ("100.x", "adam.local"), host:port, or a full URL; defaults
    // the scheme to http:// and the port to 8000 (the box's HTTP port).
    function normalizeServer(raw) {
      let s = (raw || '').trim();
      if (!s) return '';
      if (!/^https?:\/\//i.test(s)) s = 'http://' + s;
      try {
        const u = new URL(s);
        if (!u.port) u.port = '8000';
        return u.origin;
      } catch {
        return '';
      }
    }

    function serverValue() {
      return document.getElementById('server-input').value;
    }

    function updateConnectBtn() {
      const ready = rawCode().length === 6 && !!normalizeServer(serverValue());
      document.getElementById('connect-btn').disabled = !ready;
    }

    async function connect() {
      const code = rawCode();
      const server = normalizeServer(serverValue());
      if (!code || !server) {
        setStatus('Enter your server address and the 6-character code.', 'error');
        return;
      }

      const btn = document.getElementById('connect-btn');
      btn.disabled = true;
      btn.textContent = 'Connecting…';
      setStatus('', '');

      try {
        await invoke('pair_with_code', { server, code });
      } catch (e) {
        setStatus(e || 'Pairing failed. Check the code and address, then try again.', 'error');
        btn.disabled = false;
        btn.textContent = 'Connect';
        return;
      }

      // Point the local proxy at the address we just paired against (the
      // "direct" path — no WireGuard, no admin prompt). Works over Tailscale,
      // LAN, SSH-forward, or direct IPv6.
      setStatus('Paired! Starting the local proxy…', 'ok');
      try {
        await invoke('install_helpers', { server });
      } catch (e) {
        setStatus('Paired, but starting the local proxy failed: ' + e, 'error');
        btn.disabled = false;
        btn.textContent = 'Connect';
        return;
      }

      setStatus('Loading your server…', 'ok');
      // Local virtues-client proxy (LOCAL_PROXY_PORT). Keep port in sync.
      setTimeout(() => { window.location.href = 'http://localhost:7117'; }, 800);
    }

    function setStatus(msg, cls) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = cls;
    }

    // Keyboard shortcut
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') connect();
    });

    // Auto-discover on load
    refresh();
  </script>
</body>
</html>
