<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Connect to your box</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, system-ui, sans-serif; }
      body { margin: 0; background: #0b0b0c; color: #e7e7ea;
             padding: max(48px, env(safe-area-inset-top)) 22px 32px; }
      h1 { font-size: 22px; font-weight: 650; margin: 0 0 6px; }
      p.sub { margin: 0 0 28px; color: #8a8a90; font-size: 14px; line-height: 1.4; }
      label { display: block; font-size: 12px; color: #8a8a90; text-transform: uppercase;
              letter-spacing: .04em; margin: 0 0 6px; }
      input { width: 100%; box-sizing: border-box; background: #161619; color: #e7e7ea;
              border: 1px solid #2a2a30; border-radius: 12px; padding: 14px; font-size: 16px;
              margin: 0 0 18px; }
      input:focus { outline: none; border-color: #2b6cff; }
      input#code { letter-spacing: .3em; font-variant-numeric: tabular-nums; text-align: center; }
      button { appearance: none; border: 0; border-radius: 12px; background: #2b6cff; color: #fff;
               font-size: 16px; font-weight: 600; padding: 15px; width: 100%; }
      button:disabled { opacity: .5; }
      .msg { margin-top: 16px; font-size: 14px; min-height: 20px; }
      .err { color: #ff8080; }
      .ok { color: #58e08a; }
      .hint { margin-top: 22px; font-size: 12px; color: #6a6a70; line-height: 1.5; }
      #found { margin: 0 0 18px; }
      .box { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
             background: #12261a; border: 1px solid #1f4a30; border-radius: 12px;
             padding: 13px 14px; margin-bottom: 8px; color: #cdebd6; font-size: 15px; }
      .box b { color: #eafff0; }
      .box .dot { width: 8px; height: 8px; border-radius: 50%; background: #58e08a; flex: none; }
      .box .addr { margin-left: auto; color: #7fae90; font-size: 12px; }
      .scan { font-size: 12px; color: #6a6a70; margin-bottom: 14px; }
    </style>
  </head>
  <body>
    <h1>Connect to your box</h1>
    <p class="sub">On the same Wi-Fi as your Virtues box, enter the 6-digit code it shows. We'll try to find the box automatically.</p>

    <div id="found"></div>

    <form id="form">
      <label for="server">Box address</label>
      <input id="server" inputmode="url" autocapitalize="off" autocorrect="off"
             placeholder="finding your box…" />
      <label for="code">Pairing code</label>
      <input id="code" inputmode="numeric" maxlength="7" placeholder="123 456" />
      <button id="go" type="submit">Pair</button>
    </form>
    <div class="msg" id="msg"></div>
    <p class="hint">The code is shown by <b>virtues pair</b> on the box (or in its Devices screen). It expires after a few minutes.</p>

    <script>
      const invoke = window.__TAURI__.core.invoke;

      // Already paired → straight to the bundled SPA at root (loopback is up).
      //
      // `__VIRTUES_PAIRED__` is injected once, when the window is built, and is
      // never re-evaluated — so after an in-session unpair it still says true
      // and would bounce the user straight back into the app they just left.
      // That is why unpairing appeared to do nothing until the app was force
      // quit: only a fresh launch re-read the pairing.
      //
      // So the injected flag is a fast path, not the truth. It skips a round
      // trip on the common case (launch while paired) and is then confirmed
      // against the plugin, which reads the real record. If the check fails we
      // stay on this screen: showing the connect screen to someone who is
      // paired is a recoverable annoyance, and dropping someone unpaired into
      // the app is not.
      if (window.__VIRTUES_PAIRED__) {
        invoke('plugin:reach|reach_status')
          .then((s) => { if (s && s.paired) location.replace('/'); })
          .catch(() => {});
      }
      const form = document.getElementById('form');
      const go = document.getElementById('go');
      const msg = document.getElementById('msg');
      const serverInput = document.getElementById('server');
      const foundEl = document.getElementById('found');

      function say(text, cls) { msg.className = 'msg ' + (cls || ''); msg.textContent = text; }

      // Auto-discover boxes on the LAN (Bonjour). First run triggers the iOS
      // local-network prompt; allow it. Populates tappable box chips + fills the
      // address so the user usually just types the code.
      async function discover() {
        foundEl.innerHTML = '<div class="scan">Looking for your box on this network…</div>';
        let resp = { servers: [], debug: '' };
        try { resp = await invoke('plugin:reach|discover'); } catch (e) { resp.debug = String(e); }
        const servers = resp.servers || [];
        const dbg = resp.debug ? `<div class="scan" style="opacity:.6">${resp.debug}</div>` : '';
        if (!servers.length) {
          foundEl.innerHTML = dbg +
            '<div class="scan">No box found automatically. ' +
            '<a href="#" id="rescan" style="color:#7fa8ff">Search again</a> — ' +
            'or enter its address below (e.g. <b>192.168.1.233</b>).</div>';
          serverInput.placeholder = 'virtues.local   or   192.168.1.x';
          const rs = document.getElementById('rescan');
          if (rs) rs.addEventListener('click', (e) => { e.preventDefault(); discover(); });
          return;
        }
        foundEl.innerHTML = '';
        servers.forEach((s, i) => {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'box';
          b.innerHTML = `<span class="dot"></span><b>${s.name}</b><span class="addr">${s.origin.replace('http://','')}</span>`;
          b.addEventListener('click', () => {
            serverInput.value = s.origin;
            document.getElementById('code').focus();
            [...foundEl.querySelectorAll('.box')].forEach(x => x.style.opacity = .5);
            b.style.opacity = 1;
          });
          foundEl.appendChild(b);
        });
        serverInput.value = servers[0].origin;
        serverInput.placeholder = 'yourbox.local   or   10.0.0.5';
      }
      discover();

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const server = document.getElementById('server').value.trim();
        const code = document.getElementById('code').value.replace(/\s+/g, '');
        if (!server || code.length < 6) { say('Enter the box address and the 6-digit code.', 'err'); return; }
        go.disabled = true; say('Pairing…');
        try {
          const status = await invoke('plugin:reach|pair', { payload: { server, code } });
          if (status.paired) {
            say('Paired — opening your box…', 'ok');
            // Give the loopback a beat, then load the bundled SPA at root.
            setTimeout(() => { window.location.replace('/'); }, 400);
          } else {
            say('Pairing did not complete. Check the code and try again.', 'err');
            go.disabled = false;
          }
        } catch (err) {
          say(String(err), 'err');
          go.disabled = false;
        }
      });
    </script>
  </body>
</html>
