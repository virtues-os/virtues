<!doctype html>
<!--
  Offline boot shell (desktop).

  The desktop app normally shells to the box at localhost:7117 and renders the
  build the box serves. When the box is unreachable we load the SPA bundled
  into the app instead, so documents stay editable — `lib/yjs/document.ts`
  keeps a full copy in IndexedDB and merges on reconnect, but none of that was
  reachable while an unreachable box sent the window to `pair.html#unreachable`.

  This file exists for one reason: SvelteKit must boot at "/" and not at
  "/index.html". `adapter-static` writes a `200.html` SPA fallback and routes
  off `location.pathname`, so landing on "/index.html" resolves to no route and
  renders the 404 page. Redirecting here is the same trick `mobile-pair.html`
  uses on iOS for the same reason.

  `replace` rather than `assign` so the shell leaves no history entry to go
  back to. `__VIRTUES_OFFLINE__` and the backend origin are injected by
  `main.rs` as an initialization script, which runs before this and survives
  the redirect.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Virtues</title>
    <style>
      html { background: #17171a; }
    </style>
  </head>
  <body>
    <script>
      location.replace('/');
    </script>
  </body>
</html>
