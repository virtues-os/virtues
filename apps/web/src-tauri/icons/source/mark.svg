<!--
  Virtues ∴ — app-icon master, 1024×1024, full-bleed canvas.

  Geometry is the `virtues:logo` mark from apps/web/src/lib/icons.ts scaled up:
  24-unit viewBox → 1024, r=3 → r=94, base dots 15 units apart → 472px.

  Mark bbox is 660×596 (64% of canvas width), sat 20px above true center —
  a ∴ is bottom-heavy (two dots below, one above), so a bbox-centered
  triangle reads as sitting low. That 20px is the optical correction.

  Transparent ground on purpose: Icon Composer owns the background layer,
  and iOS gets its opaque ground from the bundler.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
	<g fill="#17171A">
		<circle cx="512" cy="288" r="94"/>
		<circle cx="276" cy="696" r="94"/>
		<circle cx="748" cy="696" r="94"/>
	</g>
</svg>
