<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/png" href="/favicon.png" />
		<!-- Pre-paint theme bootstrap. Runs before the stylesheet lands, so a
		     cold start doesn't flash white on its way to a dark theme — most
		     visible in the Tauri webview, where there's no browser chrome to
		     hide behind. Both values are written by applyTheme(); the fallback
		     matches :root --background in themes.css. -->
		<script>
			(function () {
				try {
					var t = localStorage.getItem("virtues-theme");
					if (t) document.documentElement.setAttribute("data-theme", t);
					var bg = localStorage.getItem("virtues-theme-bg") || "#FDFCF9";
					document.documentElement.style.backgroundColor = bg;
				} catch (e) {
					/* private mode / storage disabled — the stylesheet still wins */
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
