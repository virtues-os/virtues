<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/png" href="/favicon.png" />
		<!-- Pre-paint theme bootstrap. Runs before the stylesheet lands, so a
		     cold start doesn't flash white on its way to a dark theme — most
		     visible in the Tauri webview, where there's no browser chrome to
		     hide behind. Both values are written by applyTheme().

		     The fallback tracks the DEFAULT theme — Pemberley, #FFFFFF, which
		     is also what :root carries, so the two agree. Only a first run
		     reaches this line (afterwards localStorage has the real value), so
		     getting it wrong means every new box flashes one colour on its very
		     first paint and then settles to another. Keep this in step with
		     virtues-registry DEFAULT_THEME. -->
		<script>
			(function () {
				try {
					var t = localStorage.getItem("virtues-theme");
					if (t) document.documentElement.setAttribute("data-theme", t);
					var bg = localStorage.getItem("virtues-theme-bg") || "#FFFFFF";
					document.documentElement.style.backgroundColor = bg;
				} catch (e) {
					/* private mode / storage disabled — the stylesheet still wins */
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
