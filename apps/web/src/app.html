<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/png" href="/favicon.png" />
		<!-- Pre-paint theme bootstrap. Runs before the stylesheet lands, so a
		     cold start doesn't flash white on its way to a dark theme — most
		     visible in the Tauri webview, where there's no browser chrome to
		     hide behind. Both values are written by applyTheme().

		     The page (`--page`), NOT `--background` or `--surface`: both shells
		     cover the window in the page (the phone's `.viewport`, the desktop's
		     main card), so on any theme where the tokens differ, painting
		     another one shows one colour and the app arrives in another a
		     quarter-second later, measured. Paint what the app is about to look
		     like. applyTheme() caches it under `virtues-theme-surface`;
		     `virtues-theme-bg` is the fallback for a cache written before that
		     key existed.

		     The literal fallback tracks the DEFAULT theme — Oxford's `--page`,
		     #FFFFFF. Only a first run reaches it (afterwards localStorage has
		     the real value), so getting it wrong means every new box flashes one
		     colour on its very first paint and then settles to another. Keep it
		     in step with virtues-registry DEFAULT_THEME. -->
		<script>
			(function () {
				try {
					// The stored choice (lib/utils/theme.ts): oxford, asgard,
					// system or day. Anything else is a retired name, which
					// paints Oxford until theme.ts maps it. Follow the day reads
					// the cached sunrise and sunset, in minutes after midnight.
					var t = localStorage.getItem("virtues-theme");
					var sys = t === "system" || t === "day";
					if (t === "system") t = matchMedia("(prefers-color-scheme: dark)").matches ? "asgard" : "oxford";
					if (t === "day") {
						var sun = (localStorage.getItem("virtues-sun") || "420 1140").split(" ");
						var now = new Date();
						var m = now.getHours() * 60 + now.getMinutes();
						t = m >= +sun[0] && m < +sun[1] ? "oxford" : "asgard";
					}
					if (t === "oxford" || t === "asgard") document.documentElement.setAttribute("data-theme", t);
					// Settings · Appearance · Accent (lib/utils/theme.ts).
					// A chosen color (`#rrggbb`) paints its cached two tunings.
					var a = localStorage.getItem("virtues-accent");
					if (a && a.charAt(0) === "#") {
						var tuned = (localStorage.getItem("virtues-accent-tuned") || "").split(" ");
						if (tuned.length === 2) {
							document.documentElement.style.setProperty("--accent-light", tuned[0]);
							document.documentElement.style.setProperty("--accent-dark", tuned[1]);
							document.documentElement.setAttribute("data-accent", "custom");
						}
					} else if (a) document.documentElement.setAttribute("data-accent", a);
					// Settings · Appearance · Glass (stores/glass.svelte.ts).
					var g = localStorage.getItem("virtues-glass");
					if (g) document.documentElement.setAttribute("data-glass", g);
					// Settings · Appearance · Background on pages (stores/pageBackground.svelte.ts).
					var pb = localStorage.getItem("virtues-page-background");
					if (pb !== null && pb !== "" && !isNaN(pb)) document.documentElement.style.setProperty("--page-scene-opacity", String(Number(pb) / 100));
					// Under Match system or Follow the day the cached page colour
					// may be the other theme's, if the device or the hour
					// switched since, so paint the one this frame resolves to.
					// Asgard's --page is #141416.
					var bg = sys
						? t === "asgard" ? "#141416" : "#FFFFFF"
						: localStorage.getItem("virtues-theme-surface") ||
							localStorage.getItem("virtues-theme-bg") ||
							"#FFFFFF";
					document.documentElement.style.backgroundColor = bg;
				} catch (e) {
					/* private mode / storage disabled — the stylesheet still wins */
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
