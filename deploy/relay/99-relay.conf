# Virtues relay host tuning — /etc/sysctl.d/99-relay.conf
# Apply: sudo sysctl --system   (provision.sh does this)
#
# The relay is a public, connection-heavy TCP front. These harden it against SYN
# floods (covering OVH anti-DDoS activation lag) and raise the ceilings a busy
# passthrough proxy needs.

# SYN-flood resistance. tcp_syncookies is global (covers IPv4 + IPv6).
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 8192
net.ipv4.tcp_synack_retries = 3

# Accept-queue + device backlog for bursts of new connections.
net.core.somaxconn = 8192
net.core.netdev_max_backlog = 16384

# A relay opens many short + long-lived sockets; widen the ephemeral range and
# reclaim closed sockets faster.
net.ipv4.ip_local_port_range = 1024 65535
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_tw_reuse = 1
