# Minimal stand-in for the box's relay subsystem, for the e2e harness only.
# Wires the *public* pieces — the box-held-cert TLS-front (virtues_helpers tls)
# and the dial-out relay client (virtues_relay_client) — fronting a trivial HTTP
# responder. It does NOT stand up Postgres/atlas; it exercises exactly the
# reach + TLS + liveness path.
#
# Deliberately lean (no virtues-core dep) so it shares only the small relay
# crates and compiles fast. The ACME-against-Pebble leg is validated separately
# (see README) because it needs virtues-core + a Pebble-CA trust seam.
#
# Its own workspace (`[workspace]` below) so it's excluded from the main build.
[package]
name = "relay-e2e-box"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "relay-e2e-box"
path = "src/main.rs"

[dependencies]
anyhow = "1"
tokio = { version = "1.40", features = ["full"] }
virtues-helpers = { path = "../../../crates/virtues-helpers", features = ["tls"] }
virtues-relay-client = { path = "../../../crates/virtues-relay-client" }

[workspace]
