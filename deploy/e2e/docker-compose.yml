# End-to-end harness for the blind relay: a box dials out, registers, and a
# browser (the test script) reaches it through the relay over real TLS that the
# box terminates with its own cert. The relay only ever moves ciphertext.
#
# Auth here uses the shared-bearer path (same token on relay + box) so the
# harness needs no atlas/Postgres. The per-SNI HMAC + revocation bucketing is
# covered by unit tests; see README to exercise it here too.
name: virtues-relay-e2e

services:
  relay:
    build:
      context: ../..
      dockerfile: deploy/e2e/Dockerfile.relay
    environment:
      # Dev/shared-bearer mode: no per-SNI secret, explicit shared token.
      VIRTUES_RELAY_ALLOW_INSECURE: "1"
      VIRTUES_RELAY_TOKEN: harness-token
      VIRTUES_RELAY_CLIENT_ADDR: "0.0.0.0:8443"   # browser-facing (TLS passthrough)
      VIRTUES_RELAY_CONTROL_ADDR: "0.0.0.0:9443"  # box-facing (dial-out)
      RUST_LOG: "info"
    ports:
      - "18443:8443"   # expose only the relay's browser port to the host

  box:
    build:
      context: ../..
      dockerfile: deploy/e2e/Dockerfile.box
    depends_on: [relay]
    environment:
      VIRTUES_RELAY_ADDR: "relay:9443"            # dial the relay's control port
      VIRTUES_RELAY_SNI: "box1.virtues.ch"
      VIRTUES_RELAY_TOKEN: harness-token          # must match the relay
      VIRTUES_RELAY_TLS_FRONT: "127.0.0.1:8443"   # box-local TLS terminator
      RUST_LOG: "info"
    # NOTE: the box publishes NO ports — it's reachable only by dialing out to the
    # relay. That's the anti-bypass property; the test script relies on it.
