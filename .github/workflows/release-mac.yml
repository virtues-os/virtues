name: Release Mac App

# Builds the Tauri desktop app (apps/web/src-tauri) into a signed + notarized
# universal DMG and attaches it to a GitHub Release. Bundles both helper
# sidecars: virtues-client (Rust) and virtues-collector (Swift).
#
# This replaces the old native-Xcode pipeline (apps/mac-source/mac.xcodeproj),
# which was removed when the app moved to Tauri.
#
# Signing + notarization are handled natively by `tauri build` when these env
# vars are present (mapped from existing repo secrets):
#   APPLE_CERTIFICATE          <- APPLE_CERTIFICATE_BASE64  (base64 .p12)
#   APPLE_CERTIFICATE_PASSWORD <- APPLE_CERTIFICATE_PASSWORD
#   APPLE_SIGNING_IDENTITY     <- APPLE_DEVELOPER_ID        ("Developer ID Application: …")
#   APPLE_ID                   <- APPLE_ID
#   APPLE_PASSWORD             <- APPLE_APP_PASSWORD         (app-specific password)
#   APPLE_TEAM_ID              <- APPLE_TEAM_ID
# Without them the build still succeeds, unsigned (for local/test tags).

on:
  push:
    tags:
      - 'mac-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/mac-v}
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Install Rust (universal targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Build the two sidecars as UNIVERSAL binaries ──────────────────────
      # Tauri's universal target expects sidecars suffixed -universal-apple-darwin.

      - name: Build virtues-collector sidecar (Swift, universal)
        run: apps/mac-source/Scripts/build-sidecar.sh

      - name: Build virtues-client sidecar (Rust, universal)
        run: |
          cargo build -p virtues-client --release --target aarch64-apple-darwin
          cargo build -p virtues-client --release --target x86_64-apple-darwin
          lipo -create \
            target/aarch64-apple-darwin/release/virtues-client \
            target/x86_64-apple-darwin/release/virtues-client \
            -output apps/web/src-tauri/binaries/virtues-client-universal-apple-darwin
          chmod +x apps/web/src-tauri/binaries/virtues-client-universal-apple-darwin

      - name: Install web deps (tauri CLI + plugins)
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Build signed + notarized universal app
        working-directory: apps/web
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm tauri build --target universal-apple-darwin

      - name: Locate DMG
        id: dmg
        run: |
          DMG=$(find apps/web/src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' | head -1)
          [ -n "$DMG" ] || { echo "no DMG produced"; exit 1; }
          echo "path=$DMG" >> "$GITHUB_OUTPUT"
          echo "Found DMG: $DMG"

      - name: Create Release (versioned tag)
        uses: softprops/action-gh-release@v2
        with:
          name: Virtues for Mac v${{ steps.version.outputs.VERSION }}
          tag_name: mac-v${{ steps.version.outputs.VERSION }}
          body: |
            ## Virtues for Mac v${{ steps.version.outputs.VERSION }}

            Universal (Intel + Apple Silicon) Tauri app. Bundles the
            `virtues-client` (networking) and `virtues-collector` (data) helpers.

            ### Install
            1. Download the `.dmg`, open it, drag **Virtues** to Applications.
            2. Launch it and enter the 6-char code from `virtues login` on your server.
          files: |
            ${{ steps.dmg.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update mac-latest
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mac-latest
          name: Virtues for Mac (Latest)
          body: |
            Automatically tracks the latest stable Mac build.
            Current version: v${{ steps.version.outputs.VERSION }}
          files: |
            ${{ steps.dmg.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
