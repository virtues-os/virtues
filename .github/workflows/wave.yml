# The cheap gate on `wave`, the branch every agent commits to.
#
# WHY THIS EXISTS. `ci.yml` runs on pull_request and on pushes to main/staging.
# Nothing built `wave` at all, and the cost of that is written down twice in
# this repo already: ci.yml's own libdbus step says "Nothing caught it for weeks
# because BLE landed on `wave` and `wave` does not run CI", and on 2026-09-17
# `wave` turned out not to have compiled for two days — a call to a function in
# the wrong module, landed 09-15, found only when a 224-commit PR was opened to
# cut a release.
#
# That PR carried five unrelated breakages that surfaced simultaneously, on the
# most expensive path, on the one day someone wanted to ship. Deferring all
# verification to PR time does not avoid the work; it batches it, and schedules
# the batch for the worst possible moment.
#
# WHY IT IS LEAN. Every one of those failures was a COMPILE or LINT failure.
# None was a test failure. So this runs no tests, spins up no Postgres, and
# installs no postgresql-client: `SQLX_OFFLINE=true` makes `cargo check` read
# `.sqlx/` instead of a database, which is also how the missing-cache-entry
# failure presents (a compile error). Measured against the full gate:
#
#     wave gate   ~2-3m on 4vcpu    ~10 vCPU-min
#     ci.yml      ~7m   on 4+8vcpu  ~56 vCPU-min
#     release     ~21m  on 2x16vcpu ~544 vCPU-min
#
# On 2026-09-17 four CI runs of a 224-commit PR were spent DISCOVERING those
# failures one round trip at a time. This would have found the same four for a
# fraction of it, each attached to the commit that caused it.
#
# THIS IS NOT A WALL. No branch here has protection, so a red `wave` blocks
# nothing — it is information, delivered while the commit is still the thing you
# were just looking at. `ci.yml` remains the real gate: tests, clippy, the
# migration append-only check and the schema checks all still run there.
name: wave

on:
  push:
    branches: [wave]
    # Same list as ci.yml. Duplicated because Actions has no YAML anchors.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/images/**"
      - LICENSE

# 60-90 commits a day land here. Without this that would be 60-90 runs; with
# it, a burst collapses to one run at the next quiet moment, which is the only
# reason the arithmetic above holds.
concurrency:
  group: wave-gate
  cancel-in-progress: true

jobs:
  web:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    steps:
      - uses: actions/checkout@v4

      # Needs neither node nor pnpm — only awk and find — so it runs before the
      # install and reports a CSS nit in seconds rather than behind a toolchain.
      - name: No new design grammar violations
        run: tools/design-lint.sh

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: svelte-check
        working-directory: apps/web
        run: pnpm check

  rust:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    env:
      # Read the committed query cache instead of a live database. This is also
      # what turns "someone added a `sqlx::query!` without running
      # `cargo sqlx prepare`" into a compile error here rather than a surprise
      # at release time.
      SQLX_OFFLINE: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: No new swallowed query errors
        run: tools/check-swallowed-queries.sh

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Its own key: this job runs `cargo check` (rmeta) where ci.yml runs
          # `cargo build` (rlib), and they should not evict each other.
          shared-key: wave-gate

      # `bluer` (the Improv/BLE service) pulls libdbus-sys, a pkg-config build
      # script — a hard prerequisite of compiling the box on Linux at all.
      - name: Install libdbus headers (bluer/BLE provisioning)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      # `check`, not `build`: this asks "does it still compile", which is the
      # question every failure this gate exists for answered with "no".
      - name: cargo check
        run: cargo check --workspace
