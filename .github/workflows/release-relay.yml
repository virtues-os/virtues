name: Release relay binary

# Builds `virtues-relay` as a fully static x86_64 musl binary — one file, no libc
# / OpenSSL / runtime deps, runs on any Linux host (the OVH relay VPS is x86_64).
# The relay is a lean L4 passthrough (no rustls/sqlx/TLS), so it builds cleanly on
# musl. Replaces the old hand-built (rsync + cargo on the box) deploy.
#
# Triggered on a `relay-v*` tag (creates a release + uploads the asset) or manual
# dispatch (uploads a workflow artifact only). Deploy with deploy/relay/update.sh.

on:
  push:
    tags:
      - 'relay-v*'
  workflow_dispatch:

permissions:
  contents: write  # upload release assets

jobs:
  build:
    name: Build relay (x86_64 musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: relay-musl

      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-musl -p virtues-relay --bin virtues-relay

      - name: Stage artifact
        run: |
          set -euo pipefail
          BIN=target/x86_64-unknown-linux-musl/release/virtues-relay
          file "$BIN"
          # Confirm it is genuinely static (no dynamic interpreter).
          if ldd "$BIN" 2>&1 | grep -qv "not a dynamic executable"; then
            echo "!! binary is not static"; ldd "$BIN" || true; exit 1
          fi
          mkdir -p dist
          cp "$BIN" dist/virtues-relay-x86_64-linux
          sha256sum dist/virtues-relay-x86_64-linux | tee dist/virtues-relay-x86_64-linux.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: virtues-relay-x86_64-linux
          path: dist/*

      - name: Publish release asset (tag builds only)
        if: startsWith(github.ref, 'refs/tags/relay-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/virtues-relay-x86_64-linux
            dist/virtues-relay-x86_64-linux.sha256
          prerelease: ${{ contains(github.ref_name, '-') }}
