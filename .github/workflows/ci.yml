# Compile + test gate for staging/main pushes and PRs.
#
# Exists primarily to compile the Linux-only code paths (the getifaddrs
# BYO-transport detection in net_check, the /proc SSH-ancestry walk in
# cli/link, the kernel WG manager) that a macOS dev machine never builds —
# release-linux.yml only fires on version tags, so without this workflow
# nothing checks Linux until release time.

name: CI

# Skips changes that cannot affect the build. A docs-only PR was costing a full
# Rust compile plus a Postgres service on a paid runner, twice (once for the PR,
# once when the merge landed on staging). Keep this list to things with no code
# path — anything that even might be compiled or shipped must NOT be listed here.
#
# Safe because `staging` has no required status checks; if branch protection is
# ever added, `paths-ignore` on `pull_request` means the check never reports and
# such PRs can never merge. Use a skip-job that reports success instead.
#
# The two lists below are duplicated on purpose — GitHub Actions does not
# support YAML anchors/aliases in workflow files. Keep them in sync.
on:
  push:
    branches: [main, staging]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/images/**"
      - LICENSE
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/images/**"
      - LICENSE

jobs:
  # The frontend had NO CI at all until 2026-08-17. `pnpm check` and the airlock's
  # router tests ran only on whichever laptop happened to run them, which meant
  # the tests written for the most load-bearing file in the product could rot
  # without anything noticing. Its own job rather than steps on `rust`: it shares
  # nothing with that job, needs no Postgres, and finishes in a fraction of the
  # time, so a type error in a Svelte file should not wait on a Rust build.
  web:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    steps:
      - uses: actions/checkout@v4

      # Versions pinned to match release-linux.yml — CI that passes on a
      # different toolchain than the one that ships is CI about a different
      # program.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      # The airlock's routing rules (apps/web/src-tauri/ui/). No dependencies —
      # node's own test runner, reading `connect.html` and evaluating the marked
      # region. Run BEFORE svelte-check: these are the rules that decide whether
      # a box can be set up at all, and they take under a second.
      - name: Airlock router tests
        run: node --test "apps/web/src-tauri/ui/*.test.mjs"

      # Errors fail; warnings do not. There are ~113 warnings today (mostly
      # `@reference` at-rules and a11y advisories) and gating on them would mean
      # this job is red on arrival and therefore ignored. Errors are the signal.
      - name: svelte-check
        working-directory: apps/web
        run: pnpm check

  rust:
    runs-on: blacksmith-8vcpu-ubuntu-2204
    # A real Postgres for the #[sqlx::test] tests (action_templates,
    # scheduler) — sqlx spins up throwaway databases per test, so the user
    # must be a superuser. pgvector image because migrations CREATE
    # EXTENSION vector; pg18 matches what the installer provisions on boxes.
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: virtues
          POSTGRES_PASSWORD: virtues
          POSTGRES_DB: virtues
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U virtues"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Sqlx queries are checked against the recorded schema under .sqlx/ —
      # offline mode keeps the BUILD from needing a DB (same as
      # release-linux); the live URL below is only for the test binaries.
      SQLX_OFFLINE: 'true'
      DATABASE_URL: postgres://virtues:virtues@localhost:5432/virtues
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      # BEFORE the build, which is the whole point of it being its own step.
      # These were installed further down, inside the step that sets up
      # postgresql-client — so they arrived long after `cargo build` had
      # already failed on them. `bluer` (the Improv/BLE service the appliance
      # serves while unclaimed) pulls libdbus-sys, which is a pkg-config build
      # script, so this is a hard prerequisite of compiling the box at all on
      # Linux. Nothing caught it for weeks because BLE landed on `wave` and
      # `wave` does not run CI.
      - name: Install libdbus headers (bluer/BLE provisioning)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Build (debug — exercises the Linux cfg paths)
        run: cargo build -p virtues -p virtues-installer -p virtues-client -p virtues-iroh

      - name: Clippy
        run: cargo clippy -p virtues -p virtues-installer

      # A ratchet over the repo's most-repeated bug: a query whose error is
      # discarded answers with a plausible value and never surfaces. Fails only
      # on NEW ones — see the script for why it is not a wall.
      - name: No new swallowed query errors
        run: tools/check-swallowed-queries.sh

      # The box parses the Improv pair packet in Rust; the iPhone builds it in
      # Swift. Nothing compiles the two together, so they drifted for four days
      # and BLE pairing failed at parse_rpc every time.
      - name: Improv wire shapes agree across languages
        run: tools/check-improv-wire.py

      # Create the one thing `#[sqlx::test]`'s throwaway databases SHARE.
      #
      # Roles are cluster-wide, not per-database, and migration 0052 does
      # check-then-create on `virtues_face_reader`. So N tests migrating their
      # scratch DBs in parallel can all see the role missing and race to CREATE
      # it: one wins, the losers die with `duplicate key value violates unique
      # constraint "pg_authid_rolname_index"`, and that takes the whole suite
      # down. It is timing-dependent, so it shows up as a flaky `cargo test`
      # that passes on re-run — the worst kind of red.
      #
      # Creating it once, serially, before the suite makes that IF NOT EXISTS
      # short-circuit in every test, so no test ever mutates a cluster-wide
      # object. Cheaper than serialising the tests (`--test-threads=1` would
      # slow every run to fix a two-statement problem) and it keeps the sqlx
      # tests exercising real migrations against a real schema.
      #
      # Why here and not in the migration: 0052 is already applied on live
      # boxes, so editing it changes its checksum and `sqlx::migrate` refuses to
      # run on the next upgrade. It also never races in production, where
      # migrations run once, serially — this is a test-harness artifact, so the
      # test harness is where it belongs.
      #
      # (Locally this is invisible: a dev box has already run migrations, so the
      # role exists and the same tests pass — which is exactly why this reached
      # CI unnoticed.)
      # The backup drill (`cli::restore::drill`) shells out to pg_dump and
      # pg_restore, and pg_dump REFUSES to dump from a server newer than itself.
      # The runner image ships an older postgresql-client than the pg18 service
      # container above, so without this the drill fails on a version check that
      # has nothing to do with backup. Pin the client to the server's major.
      - name: Install postgresql-client-18 (for pg_dump/pg_restore)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          # `git` is pinned here only to make the dependency explicit —
          # `applet_git_import` shells out to it, and the box needs it for the
          # same feature. The runner image already ships 2.52, so this is a
          # no-op assertion rather than a fix.
          #
          # It was briefly mistaken FOR a fix: the test failed with "git init …
          # failed to spawn: No such file or directory (os error 2)", which
          # reads as a missing binary. `os error 2` on spawn also means the
          # *working directory* does not exist, and that was the real cause —
          # see the create_dir_all in applet_git_import.rs. Read the apt log
          # before believing a package is missing.
          sudo apt-get install -y postgresql-client-18 git
          # Installing the package is not enough: the runner already ships an
          # older postgresql-client, and /usr/bin/pg_dump keeps resolving to it.
          # Put the versioned bindir ahead of it for every later step.
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/18/bin:$PATH"
          # Assert, do not merely print. The first version of this step ended
          # with a bare `pg_dump --version`, which faithfully reported 14.20 and
          # was read by nobody; the failure surfaced two steps later as an
          # unrelated-looking test failure.
          got="$(pg_dump --version | grep -oE '[0-9]+' | head -1)"
          echo "pg_dump major: $got"
          if [ "$got" != "18" ]; then
            echo "::error::pg_dump is $got, but the service container is 18 — pg_dump refuses to dump from a newer server"
            exit 1
          fi

      - name: Pre-create the shared cluster roles
        run: |
          # BOTH roles the migrations create, not just one. 0052 makes
          # virtues_face_reader and 0054 makes virtues_applet_writer, and each
          # races the same way — this step originally covered only the first,
          # so the second stayed latent until enough parallel sqlx tests
          # existed to hit it. Adding tests is what surfaced it.
          for role in virtues_face_reader virtues_applet_writer; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '$role') THEN
                CREATE ROLE $role NOLOGIN;
              END IF;
            END \$\$;"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "GRANT $role TO CURRENT_USER;"
          done

      # Does `.sqlx/` still describe the real schema?
      #
      # The build above runs with SQLX_OFFLINE=true, so every `sqlx::query!` is
      # validated against the recorded JSON in `.sqlx/` rather than against
      # Postgres. That is the right default — it keeps the build and the release
      # from needing a database — but it means the cache is the *only* thing
      # asserting those queries are valid, and nothing was asserting the cache.
      #
      # The failure that shape allows is the worst kind this repo has:
      # drop a column that `api/wiki.rs` selects, forget to regenerate, and the
      # stale cache still says the column exists. `cargo check` passes. Clippy
      # passes. CI is green. The release builds. Then `GET /api/wiki/people/:id`
      # 500s on a real box, and the first person to find out is whoever is
      # running it. Same shape as migration 52 and the pdfium 404: green here,
      # broken there.
      #
      # `prepare --check` regenerates against the migrated service container and
      # fails if the result differs from what is committed. It cannot be
      # satisfied by discipline — that is the point. Fix is one command:
      #   cargo sqlx prepare --workspace
      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli

      - name: Verify the sqlx cache matches the schema
        env:
          SQLX_OFFLINE: 'false'
        run: |
          sqlx migrate run --source virtues-core/migrations
          cargo sqlx prepare --check --workspace

      # An applied migration's file is part of the fleet's history. sqlx
      # checksums the BYTES, so editing one after boxes have applied it —
      # even a comment — makes their next `migrate run` refuse with
      # "previously applied but has been modified", which on a box is a boot
      # refusal. Not hypothetical: a docs path-sweep (b75a20ce) edited
      # comments inside 0005 + three atlas migrations after staging.65-.71
      # had shipped them; caught by hand (9f9538f3) one prerelease before it
      # bricked every upgrade. New files are welcome; .sql.pending
      # placeholders may be consumed; everything else is append-only. A
      # deliberate squash is the one exception, and it edits this step
      # knowingly.
      - name: Applied migrations are append-only
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin ${{ github.base_ref }}
          base=$(git merge-base FETCH_HEAD HEAD)
          # TEMPORARY allowlist: the wave that INTRODUCED this check also
          # carries 9f9538f3, which restores four migrations to the bytes
          # fielded boxes actually applied — a modification relative to
          # staging's (bad) copy, and the one edit that is the fix rather
          # than the disease. DELETE these four lines once that wave merges.
          drift=$(git diff --name-status --no-renames "$base" HEAD -- \
                    virtues-core/migrations services/virtues-atlas/migrations \
                  | grep -E '^\s*[MD]\s' | grep -E '\.sql$' \
                  | grep -v -e '0005_display_hours\.sql' \
                            -e '0001_customers\.sql' \
                            -e '0015_box_keys\.sql' \
                            -e '0016_granted_links\.sql' || true)
          if [ -n "$drift" ]; then
            echo "✖ applied migration files modified or deleted:"
            echo "$drift"
            echo "Migrations are append-only once merged — revert the edit; new behavior gets a NEW migration."
            exit 1
          fi
          echo "✓ migrations are append-only against $base"

      # Two drift classes sqlx cannot see, because the SQL is built from
      # string arrays at runtime: (1) dynamic INSERT/upsert column lists that
      # name columns the schema no longer has (the 2026-08-17 renames left
      # seven of these), and (2) the model-facing catalog in sql_query.rs
      # advertising columns that exist but that NO writer populates — the
      # agent then queries forever-NULL columns (eight found in the
      # 2026-08-28 audit, including a ref_count that did not exist at all).
      # Needs the migrated service Postgres from the step above.
      - name: Dynamic SQL + model catalog match the schema
        run: python3 tools/check-dynamic-inserts.py

      # `--workspace`, not `-p virtues`. This used to test the one package, so
      # virtues-registry, virtues-helpers, virtues-iroh and virtues-installer
      # had their tests skipped entirely — a failing registry test sat on green
      # staging until someone ran it by hand. A test that never runs is worse
      # than no test: it reads as coverage.
      #
      # api::code::tests::test_timeout needs the code-execution sandbox
      # runtime, which isn't provisioned on a bare runner — it's an
      # environment-dependent timing test, not a unit test. Everything else
      # runs DB-free or against the service Postgres above.
      #
      # NOTE: the Tauri mobile plugins and src-tauri are in the workspace
      # `exclude` list, so `--workspace` still does not reach them. They are
      # covered by the mobile build, not here.
      - name: Unit tests
        run: cargo test --workspace -- --skip api::code::tests::test_timeout

      # Audit the live models release against the installer's expected asset
      # list (config.rs `models_release_assets`). Exists because libpdfium
      # was wired into the install flow with no asset ever uploaded to
      # models-1 — every real install then 404'd on its last step while CI
      # stayed green. The test is #[ignore]d (network) so local `cargo test`
      # stays offline; CI runs it by name here.
      - name: Models-release asset audit
        run: cargo test -p virtues-installer -- --ignored models_release_serves_every_expected_asset
