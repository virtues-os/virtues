# Compile + test gate for staging/main pushes and PRs.
#
# Exists primarily to compile the Linux-only code paths (the getifaddrs
# BYO-transport detection in net_check, the /proc SSH-ancestry walk in
# cli/link, the kernel WG manager) that a macOS dev machine never builds —
# release-linux.yml only fires on version tags, so without this workflow
# nothing checks Linux until release time.

name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  rust:
    runs-on: blacksmith-8vcpu-ubuntu-2204
    # A real Postgres for the #[sqlx::test] tests (action_templates,
    # scheduler) — sqlx spins up throwaway databases per test, so the user
    # must be a superuser. pgvector image because migrations CREATE
    # EXTENSION vector; pg18 matches what the installer provisions on boxes.
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: virtues
          POSTGRES_PASSWORD: virtues
          POSTGRES_DB: virtues
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U virtues"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Sqlx queries are checked against the recorded schema under .sqlx/ —
      # offline mode keeps the BUILD from needing a DB (same as
      # release-linux); the live URL below is only for the test binaries.
      SQLX_OFFLINE: 'true'
      DATABASE_URL: postgres://virtues:virtues@localhost:5432/virtues
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      - name: Build (debug — exercises the Linux cfg paths)
        run: cargo build -p virtues -p virtues-installer -p virtues-client -p virtues-iroh

      - name: Clippy
        run: cargo clippy -p virtues -p virtues-installer

      # Create the one thing `#[sqlx::test]`'s throwaway databases SHARE.
      #
      # Roles are cluster-wide, not per-database, and migration 0052 does
      # check-then-create on `virtues_face_reader`. So N tests migrating their
      # scratch DBs in parallel can all see the role missing and race to CREATE
      # it: one wins, the losers die with `duplicate key value violates unique
      # constraint "pg_authid_rolname_index"`, and that takes the whole suite
      # down. It is timing-dependent, so it shows up as a flaky `cargo test`
      # that passes on re-run — the worst kind of red.
      #
      # Creating it once, serially, before the suite makes that IF NOT EXISTS
      # short-circuit in every test, so no test ever mutates a cluster-wide
      # object. Cheaper than serialising the tests (`--test-threads=1` would
      # slow every run to fix a two-statement problem) and it keeps the sqlx
      # tests exercising real migrations against a real schema.
      #
      # Why here and not in the migration: 0052 is already applied on live
      # boxes, so editing it changes its checksum and `sqlx::migrate` refuses to
      # run on the next upgrade. It also never races in production, where
      # migrations run once, serially — this is a test-harness artifact, so the
      # test harness is where it belongs.
      #
      # (Locally this is invisible: a dev box has already run migrations, so the
      # role exists and the same tests pass — which is exactly why this reached
      # CI unnoticed.)
      # The backup drill (`cli::restore::drill`) shells out to pg_dump and
      # pg_restore, and pg_dump REFUSES to dump from a server newer than itself.
      # The runner image ships an older postgresql-client than the pg18 service
      # container above, so without this the drill fails on a version check that
      # has nothing to do with backup. Pin the client to the server's major.
      - name: Install postgresql-client-18 (for pg_dump/pg_restore)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          # Installing the package is not enough: the runner already ships an
          # older postgresql-client, and /usr/bin/pg_dump keeps resolving to it.
          # Put the versioned bindir ahead of it for every later step.
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/18/bin:$PATH"
          # Assert, do not merely print. The first version of this step ended
          # with a bare `pg_dump --version`, which faithfully reported 14.20 and
          # was read by nobody; the failure surfaced two steps later as an
          # unrelated-looking test failure.
          got="$(pg_dump --version | grep -oE '[0-9]+' | head -1)"
          echo "pg_dump major: $got"
          if [ "$got" != "18" ]; then
            echo "::error::pg_dump is $got, but the service container is 18 — pg_dump refuses to dump from a newer server"
            exit 1
          fi

      - name: Pre-create the shared cluster role
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'virtues_face_reader') THEN
              CREATE ROLE virtues_face_reader NOLOGIN;
            END IF;
          END \$\$;"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "GRANT virtues_face_reader TO CURRENT_USER;"

      # api::code::tests::test_timeout needs the code-execution sandbox
      # runtime, which isn't provisioned on a bare runner — it's an
      # environment-dependent timing test, not a unit test. Everything else
      # in --lib runs DB-free.
      - name: Unit tests
        run: cargo test -p virtues --lib -- --skip api::code::tests::test_timeout
