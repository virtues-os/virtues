# The privacy gate, on every push to every branch and on every pull request.
#
# WHY ITS OWN WORKFLOW. ci.yml and wave.yml skip Markdown and docs/ to save a
# Rust build, and a docs-only push is exactly where a quoted message or a
# family name lands. This needs only git and Python, so it runs on a free
# hosted runner, with no paths filter and no branch filter.
#
# WHAT IT READS. Every commit the push or PR adds, not only the tip: the lines
# each one adds (gzipped seeds decompressed), the files themselves (recordings,
# GPS photos, exports, databases, notebooks, anything new over 500 KB), its
# message and its author address. Then the whole tree at the tip.
#
# WHAT IT CANNOT KNOW. The owner's real values. tools/privacy-guard.py holds
# those as keyed hashes on the owner's machine, and neither its denylist nor its
# salt ever comes here: with the salt, every ten-digit number in the hashes
# falls to a brute force in minutes. CI catches what a pattern or a file's
# bytes can show; the git hooks catch the rest before a push.
#
# IT DETECTS, AFTER THE FACT. A push to a public branch is public before this
# runs. A red run names the commit to rewrite; the hooks are what prevent.
name: privacy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: No real data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The range needs history; a new branch's range needs every other branch.
          fetch-depth: 0
          persist-credentials: false

      - name: The commits this push or pull request adds
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          REF: ${{ github.event_name == 'push' && github.ref || '' }}
        run: python3 tools/check-pii.py --range "$BEFORE..$AFTER" --ref "$REF"

      - name: The tree at the tip
        run: python3 tools/check-pii.py
