name: Build cloud sidecar images

# Builds + pushes the cloud sidecar Docker images (currently just
# virtues-api) to GHCR on every push to main/staging. The home box itself
# ships as a native binary via release-linux.yml, not as an image — the
# old virtues-core Dockerfile was deleted when local ML moved out of
# process (it lives on as the llama-server sidecars, also shipped by
# release-linux.yml).
#
# The atlas image is built + pushed via `make deploy-atlas` from the
# operator's laptop (Stripe webhook secrets aren't appropriate for CI).
# If we ever move atlas to CI, add a build-atlas job here mirroring
# build-virtues-api.

on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      tag:
        description: "Custom image tag (defaults to git SHA)"
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  VIRTUES_API_IMAGE: ghcr.io/virtues-os/virtues-api

jobs:
  build-virtues-api:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.VIRTUES_API_IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=raw,value=staging,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/staging' }}
            type=sha,prefix=,format=long
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event.inputs.tag != '' }}

      - name: Build and push virtues-api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/virtues-api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Notify Atlas of new image version so it can roll the deployment.
  register-version:
    needs: [build-virtues-api]
    runs-on: ubuntu-22.04
    if: github.event_name == 'push'
    steps:
      - name: Notify Atlas of new version
        continue-on-error: true
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENVIRONMENT="production"
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            ENVIRONMENT="staging"
          else
            echo "::warning::Unknown branch ${{ github.ref }}, skipping version registration"
            exit 0
          fi

          curl -sf -X POST "${{ secrets.VIRTUES_ATLAS_URL }}/api/internal/set-version" \
            -H "X-Atlas-Secret: ${{ secrets.VIRTUES_ATLAS_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"version\": \"${{ github.sha }}\",
              \"image_tag\": \"${{ github.sha }}\",
              \"environment\": \"${ENVIRONMENT}\"
            }"
