[package]
name = "virtues-action-helpers"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Shared library for Virtues action binaries: stdin/stdout contract, DB connection, provider-specific utilities"

[lib]
name = "virtues_action_helpers"
path = "src/lib.rs"

[dependencies]
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "chrono", "json", "macros", "uuid"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
tracing = "0.1"
sha2 = "0.10"
hex = "0.4"
