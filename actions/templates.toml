# Credential refresh — sweeps via_proxy credentials whose access tokens are
# nearing expiry. Calls `virtues_helpers::auth::proxy_refresh` for each.
# Same auth-helpers code path as the core HTTP handlers, just invoked from cron.
[[action]]
id_prefix = "action_credential_refresh"
name = "Credential Refresh"
owner = "system"
function_name = "credential_refresh"
triggers = ["cron", "manual"]
default_cron = "0 */15 * * * *"

# ────────────────────────────────────────────────────────────────────────────
# Day summary (end-of-day)
# ────────────────────────────────────────────────────────────────────────────
#
# Runs hourly, gated by a SQL condition that matches the user's local
# maintenance hour. Resolves sleep, scores novelty/autonomic/topic/entity, and
# writes the autobiography — all in one shot.

[[action]]
id_prefix = "action_day_summary_eod"
name = "Day Summary (End of Day)"
owner = "system"
function_name = "day_summary_eod"
triggers = ["cron", "manual", "tool"]
default_cron = "0 0 * * * *"
# No SQL condition — the binary does its own timezone-aware maintenance-hour
# gate in Rust (see actions/src/bin/day_summary_eod/main.rs). SQL can't express
# "is it 8am in the user's profile timezone" because SQLite doesn't know about
# chrono-tz.

[[action]]
id_prefix = "action_day_illustration"
name = "Day Illustration"
owner = "system"
function_name = "day_illustration"
triggers = ["cron"]
default_cron = "0 0 * * * *"

# ────────────────────────────────────────────────────────────────────────────
# User-owned factory templates
# ────────────────────────────────────────────────────────────────────────────
#
# `owner = "user"` templates seed once (INSERT OR IGNORE) and are never
# overwritten on subsequent reconciles. The user owns the row — edits to
# `agent`, `name`, schedule, triggers etc. survive restarts.

[[action]]
id_prefix = "action_morning_examen"
name = "Morning Examen"
owner = "user"
agent = """You are the user's morning reflection companion. Read the previous day's autobiography from wiki_days, surface one concrete observation about their day, and pose one gentle question for today. Keep it under 100 words. Warm, specific, non-prescriptive."""
triggers = ["cron", "manual"]
default_cron = "0 0 7 * * *"
