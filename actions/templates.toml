# Source catalog + action templates.
#
# On server startup, `core::action_templates::reconcile_templates` reads this
# file and:
#   - Caches `[[source]]` rows in a static catalog (used by /api/sources and
#     auth handlers).
#   - Upserts `[[action]]` rows into `app_actions`. Template-managed fields
#     (function_name, triggers, agent, condition, owner) are overwritten on
#     every startup. User-managed fields (cron_schedule, config, enabled,
#     memory) are preserved.
#
# `per_credential = true` action entries fan out one row per matching
# credential (used for iOS streams where each paired device gets its own row).
# These must reference a `[[source]]` via `source = { id = "..." }`.

# ────────────────────────────────────────────────────────────────────────────
# Sources — the catalog of providers a user can connect to.
# Each entry drives one tile in the Sources UI.
# ────────────────────────────────────────────────────────────────────────────

[[source]]
id = "ios"
display_name = "iPhone"
icon = "ri:smartphone-line"
description = "Pair an iPhone to ingest HealthKit, Location, EventKit, FinanceKit, Contacts, and Microphone streams."
auth = { kind = "self_issued_bearer" }

[[source]]
id = "mac"
display_name = "Mac"
icon = "ri:macbook-line"
description = "Pair a Mac to ingest app usage, browser activity, and iMessage history."
auth = { kind = "self_issued_bearer" }

[[source]]
id = "google"
display_name = "Google"
icon = "ri:google-fill"
description = "Calendar, Mail, and Drive — read-only sync of your Google account."
auth = { kind = "via_proxy", start_path = "/google/start" }

[[source]]
id = "notion"
display_name = "Notion"
icon = "ri:notion-fill"
description = "Sync pages and databases from your Notion workspace."
auth = { kind = "via_proxy", start_path = "/notion/start" }

[[source]]
id = "strava"
display_name = "Strava"
icon = "ri:run-line"
description = "Sync your activities (runs, rides, swims) from Strava."
auth = { kind = "via_proxy", start_path = "/strava/start" }

[[source]]
id = "plaid"
display_name = "Plaid"
icon = "ri:bank-card-line"
description = "Connect bank accounts via Plaid Hosted Link to sync transactions, balances, investments, and liabilities."
auth = { kind = "via_proxy", start_path = "/plaid/start" }

