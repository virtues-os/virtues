name = "Chat Import"
description = "One-time import of a Claude / ChatGPT / Gemini conversation export into the AI-chat ontology. Parsed box-side; deduped on re-import."
owner = "system"
runtime = "function"
command = ["chat_import"]
# Manual-trigger ONLY — no cron. This is what makes it a one-time/snapshot
# source rather than a living one. The /api/chat-import/upload route stores the
# uploaded file and fires this action with payload = { file_path, provider }.
triggers = ["manual"]
