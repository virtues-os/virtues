[package]
name = "virtues-actions"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Virtues action binaries: one subprocess per data source stream"

# Shared boilerplate for the binaries below (tracing init, http client,
# ActionInput accessors, fetch_json). Bins reference it as `virtues_actions::`.
[lib]
path = "src/lib.rs"

# ── iOS ingest (one binary + one action, all paired-iPhone streams) ─────────
# Single dispatcher for healthkit/location/eventkit/contacts/microphone/
# financekit. The phone tags each push with a `stream` field and the dispatcher
# fans it to the right ontology table; see ios_ingest/main.rs.

[[bin]]
name = "ios_ingest"
path = "ios_ingest/main.rs"

[[bin]]
name = "transcription_resolution"
path = "transcription_resolution/main.rs"

[[bin]]
name = "day_summary_eod"
path = "day_summary_eod/main.rs"

[[bin]]
name = "narrative_identity_draft"
path = "narrative_identity_draft/main.rs"

[[bin]]
name = "embedding_index"
path = "embedding_index/main.rs"

[[bin]]
name = "credential_refresh"
path = "credential_refresh/main.rs"

# ── Mac stream (self_issued_bearer like iOS) ────────────────────────────────

[[bin]]
name = "mac_ingest"
path = "mac_ingest/main.rs"

# ── Google syncs (via_proxy) ────────────────────────────────────────────────

[[bin]]
name = "google_calendar_sync"
path = "google_calendar_sync/main.rs"

[[bin]]
name = "google_gmail_sync"
path = "google_gmail_sync/main.rs"

# ── Notion / Strava (via_proxy) ─────────────────────────────────────────────

[[bin]]
name = "notion_pages_sync"
path = "notion_pages_sync/main.rs"

[[bin]]
name = "strava_activities_sync"
path = "strava_activities_sync/main.rs"

# ── Plaid streams (via_proxy with Hosted Link) ──────────────────────────────

[[bin]]
name = "plaid_accounts_sync"
path = "plaid_accounts_sync/main.rs"

[[bin]]
name = "plaid_transactions_sync"
path = "plaid_transactions_sync/main.rs"

[[bin]]
name = "plaid_investments_sync"
path = "plaid_investments_sync/main.rs"

[[bin]]
name = "plaid_liabilities_sync"
path = "plaid_liabilities_sync/main.rs"

# ── One-time import (manual-trigger, no cron) ───────────────────────────────

[[bin]]
name = "chat_import"
path = "chat_import/main.rs"

# ── Example app-runtime action ──────────────────────────────────────────────

[[bin]]
name = "echo_app"
path = "echo_app/main.rs"

[dependencies]
virtues = { path = "../virtues-core" }
virtues-helpers = { path = "../crates/virtues-helpers" }
# Model-slot resolution (the Omni slot for audio transcription) — actions pick
# models from the same registry the server does, never a hardcoded id.
virtues-registry = { path = "../crates/virtues-registry" }
# Actions must see the same box environment the server does — model width and
# prompt formats live there, and an action that cannot read them embeds into a
# different geometry. See `init_tracing`.
dotenv = "0.15"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "chrono", "json", "macros", "uuid"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.10", features = ["v4", "v5", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-no-provider"] }
base64 = "0.22"
urlencoding = "2.1"
# On-box voice-activity gate (transcription_resolution): decode m4a → mel → run
# NVIDIA MarbleNet VAD, all pure-Rust so nothing native ships in the appliance.
tract-onnx = "0.21"
realfft = "3"
symphonia = { version = "0.5", default-features = false, features = ["isomp4", "aac"] }
# axum: for `app`-runtime example (echo_app) and any other long-running HTTP app actions
axum = { version = "0.7", features = ["json"] }
