[package]
name = "virtues-actions"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Virtues action binaries: one subprocess per data source stream"

# Shared boilerplate for the binaries below (tracing init, http client,
# ActionInput accessors, fetch_json). Bins reference it as `virtues_actions::`.
[lib]
path = "src/lib.rs"

# ── iOS action binaries ─────────────────────────────────────────────────────

[[bin]]
name = "ios_healthkit"
path = "ios_healthkit/main.rs"

[[bin]]
name = "ios_location"
path = "ios_location/main.rs"

[[bin]]
name = "ios_eventkit"
path = "ios_eventkit/main.rs"

[[bin]]
name = "ios_financekit"
path = "ios_financekit/main.rs"

[[bin]]
name = "ios_contacts"
path = "ios_contacts/main.rs"

[[bin]]
name = "ios_microphone"
path = "ios_microphone/main.rs"

[[bin]]
name = "transcription_resolution"
path = "transcription_resolution/main.rs"

[[bin]]
name = "day_summary_eod"
path = "day_summary_eod/main.rs"

[[bin]]
name = "embedding_index"
path = "embedding_index/main.rs"

[[bin]]
name = "credential_refresh"
path = "credential_refresh/main.rs"

[[bin]]
name = "virtues_api_renew"
path = "virtues_api_renew/main.rs"

# ── Mac stream (self_issued_bearer like iOS) ────────────────────────────────

[[bin]]
name = "mac_activity"
path = "mac_activity/main.rs"

# ── Google syncs (via_proxy) ────────────────────────────────────────────────

[[bin]]
name = "google_calendar_sync"
path = "google_calendar_sync/main.rs"

[[bin]]
name = "google_gmail_sync"
path = "google_gmail_sync/main.rs"

# ── Notion / Strava (via_proxy) ─────────────────────────────────────────────

[[bin]]
name = "notion_pages_sync"
path = "notion_pages_sync/main.rs"

[[bin]]
name = "strava_activities_sync"
path = "strava_activities_sync/main.rs"

# ── Plaid streams (via_proxy with Hosted Link) ──────────────────────────────

[[bin]]
name = "plaid_accounts_sync"
path = "plaid_accounts_sync/main.rs"

[[bin]]
name = "plaid_transactions_sync"
path = "plaid_transactions_sync/main.rs"

[[bin]]
name = "plaid_investments_sync"
path = "plaid_investments_sync/main.rs"

[[bin]]
name = "plaid_liabilities_sync"
path = "plaid_liabilities_sync/main.rs"

# ── Example app-runtime action ──────────────────────────────────────────────

[[bin]]
name = "echo_app"
path = "echo_app/main.rs"

[dependencies]
virtues = { path = "../virtues-core" }
virtues-helpers = { path = "../crates/virtues-helpers" }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "chrono", "json", "macros", "uuid"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.10", features = ["v4", "v5", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-no-provider"] }
base64 = "0.22"
urlencoding = "2.1"
# axum: for `app`-runtime example (echo_app) and any other long-running HTTP app actions
axum = { version = "0.7", features = ["json"] }
