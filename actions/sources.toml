# Source catalog.
#
# This file holds only `[[source]]` rows — the catalog of providers a user can
# connect (one tile per source on the Sources page). Action definitions
# moved to per-folder manifests at `actions/<name>/manifest.toml` (see
# ARCHITECTURE.md). On startup, `core::action_templates::reconcile_templates`
# globs every per-folder manifest, merges with the source catalog, and upserts
# into `app_actions`.

[[source]]
id = "ios"
display_name = "iPhone"
icon = "ri:smartphone-line"
description = "Pair an iPhone to ingest HealthKit, Location, EventKit, FinanceKit, Contacts, and Microphone streams."
auth = { kind = "self_issued_bearer" }

