# Cross-compile config for `cross` (release-linux.yml).
#
# Three things to fix for the container build:
#
# 1. `ort-sys`'s build script writes the downloaded ONNX Runtime tarball to
#    `$HOME/.cache/ort.pyke.io/`. Inside the cross container HOME is `/`,
#    so the path resolves to `/.cache/` — which doesn't exist and isn't
#    writable. We create it as a world-writable dir in `pre-build`.
#
# 2. The sqlx offline cache lives at `.sqlx/` in the workspace; pass through
#    SQLX_OFFLINE so the macros use it instead of trying a live DB.
#
# 3. The default cross images for aarch64/x86_64 ship Ubuntu 20.04 + GCC 9.
#    ORT 1.24 prebuilt binaries reference C++17/20 symbols
#    (`std::__throw_bad_array_new_length`, `std::_Sp_make_shared_tag::_S_eq`)
#    that need a newer libstdc++. Pin to `:main` images (Ubuntu 22.04 +
#    GCC 11) which provide the matching ABI.

[build]
pre-build = [
    "mkdir -p /.cache && chmod 777 /.cache",
]

[build.env]
passthrough = [
    "SQLX_OFFLINE",
    "CARGO_NET_GIT_FETCH_WITH_CLI",
]

[target.aarch64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:main"

[target.x86_64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/x86_64-unknown-linux-gnu:main"
