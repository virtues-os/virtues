[package]
name = "virtues-atlas"
version = "0.1.0"
edition = "2021"
authors = ["Virtues Team <team@virtues.com>"]
description = "Identity, billing, and entitlement issuance for Virtues. Holds the Stripe customer side of the Chinese wall."
license = "MIT"
repository = "https://github.com/virtues-os/virtues"
keywords = ["billing", "stripe", "entitlement", "privacy-pass"]

[[bin]]
name = "virtues-atlas"
path = "src/main.rs"

[dependencies]
# Workspace crate: Stripe webhook signature verifier lives in
# `crates/virtues-helpers/src/crypto/` (Lint 3 keeps HMAC primitives there).
virtues-helpers = { path = "../../crates/virtues-helpers" }

# Shared relay wire protocol — `derive_token` mints the per-SNI registration
# token the relay verifies. Single source of the HMAC so atlas + relay can't
# drift. Pure-data crate (no tokio).
virtues-protocol = { path = "../../crates/virtues-protocol" }

# HTTP server
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "limit", "timeout", "trace"] }

# HTTP client (outbound to virtues-api for entitlement updates)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-no-provider", "rustls-tls-webpki-roots-no-provider"] }
# rustls 0.23 (transitively via reqwest + sqlx + axum stacks) requires the
# CryptoProvider to be installed at process start; we use ring (no aws-lc-sys).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }

# Async runtime
tokio = { version = "1.40", features = ["full"] }

# Database
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "tls-rustls-ring", "chrono", "uuid", "macros"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
rand = "0.9"

# Bearer hashing (data fingerprint — Lint 3 only forbids HMAC primitives,
# not SHA-256).
sha2 = "0.10"
hex = "0.4"

# Route 53 — atlas is the per-box-scoped DNS-01 TXT writer for the box's ACME
# cert (the box holds the key; atlas only writes `_acme-challenge.<sni>`). Uses
# the modern default stack (hyper 1.x + rustls + aws-lc-rs). aws-lc-rs pulls
# `aws-lc-sys`, which needs `cmake` + a C compiler at build time — added to the
# Dockerfile builder stage. atlas still installs **ring** as the *process* rustls
# provider (see main.rs); the SDK builds its own aws-lc-backed connector
# independently, so the two coexist.
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "client-hyper"] }
aws-sdk-route53 = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio"] }

# Environment
dotenvy = "0.15"

[dev-dependencies]
tokio-test = "0.4"
