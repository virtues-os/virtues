[package]
name = "atlas"
version = "0.1.0"
edition = "2021"
authors = ["Virtues Team <team@virtues.com>"]
description = "Identity, billing, and entitlement issuance for Virtues. Holds the Stripe customer side of the Chinese wall."
license = "MIT"
repository = "https://github.com/virtues-os/virtues"
keywords = ["billing", "stripe", "entitlement", "privacy-pass"]

[[bin]]
name = "atlas"
path = "src/main.rs"

[dependencies]
# Workspace crate: Stripe webhook signature verifier lives in
# `crates/virtues-helpers/src/crypto/` (Lint 3 keeps HMAC primitives there).
virtues-helpers = { path = "../../crates/virtues-helpers" }

# HTTP server
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# HTTP client (outbound to virtues-api for entitlement updates)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Async runtime
tokio = { version = "1.40", features = ["full"] }

# Database
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "tls-rustls-ring", "chrono", "uuid", "macros"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
rand = "0.9"

# Bearer hashing (data fingerprint — Lint 3 only forbids HMAC primitives,
# not SHA-256).
sha2 = "0.10"
hex = "0.4"

# Environment
dotenvy = "0.15"

[dev-dependencies]
tokio-test = "0.4"
