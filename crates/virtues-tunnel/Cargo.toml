[package]
name = "virtues-tunnel"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "In-app userspace WireGuard tunnel for paired Virtues clients (boringtun Tunn + smoltcp netstack). Brings up a split-scope tunnel to the box's ULA and exposes a simple dial(ip, port) -> byte stream so an app can issue plain HTTP to the box without taking over a system VPN slot. Used by the iOS app via the FFI surface; the desktop keeps its kernel/utun path."

[lib]
# `cdylib`/`staticlib` so the same crate links into an iOS XCFramework via the
# FFI surface; `rlib` so Rust consumers (tests, future desktop adoption) can use
# it as a normal dependency.
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
# Shared wire types — PairingBundle / WgParams / RendezvousParams / SPKI. Pure,
# iOS-friendly, no server deps (that's the whole point of that crate).
virtues-protocol = { path = "../virtues-protocol" }

# WireGuard Noise core at the packet level (encapsulate/decapsulate). Mullvad's
# gotatun Device is opaque, so we drive the lower-level Tunn directly (the
# onetun architecture). defguard_boringtun is already in our tree (transitive
# via the box's defguard_wireguard_rs) and re-exports x25519.
defguard_boringtun = "0.6"

# Userspace TCP/IP stack. We feed it decapsulated IP packets and pull the IP
# packets it wants to send, encrypting them back through Tunn.
smoltcp = { version = "0.13", default-features = false, features = [
    "std",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-tcp",
] }

# Curve25519 keypair generation for pairing (matches the desktop's x25519-dalek
# usage). Re-exported by defguard_boringtun too, but we depend explicitly so
# key-gen doesn't rely on a transitive re-export.
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand = "0.8"

# AES-256-GCM for the rendezvous blob — same construction as the box
# (`virtues_helpers::crypto::seal_aes_256_gcm`: ring AES_256_GCM, 12-byte nonce
# prefix, empty AAD). ring builds for aarch64-apple-ios.
ring = "0.17"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Blocking HTTP for the rendezvous GET. rustls (no OpenSSL) so it cross-compiles
# to iOS cleanly; blocking keeps the FFI surface free of an async runtime.
ureq = { version = "2", default-features = false, features = ["tls"] }

tracing = "0.1"
thiserror = "1.0"

# FFI surface for the iOS XCFramework. Library mode (setup_scaffolding! +
# proc-macro exports) — no UDL file. The `cli` feature (needed only by the
# bindgen bin) is gated behind our `bindgen` feature so an iOS staticlib build
# (`cargo build --target aarch64-apple-ios`) doesn't drag in cli/clap.
uniffi = { version = "0.31" }

[features]
# Host-only: enables the uniffi-bindgen binary. NOT enabled for iOS builds.
bindgen = ["uniffi/cli"]

[[bin]]
# Generates the Swift bindings: `cargo run --features bindgen --bin uniffi-bindgen
# -- generate --library <staticlib> --language swift --out-dir <dir>`.
# `required-features` keeps it out of the default (and iOS target) build.
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[dev-dependencies]
# Round-trip the rendezvous blob against the box's exact seal format.
ring = "0.17"
