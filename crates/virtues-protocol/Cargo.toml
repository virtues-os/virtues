[package]
name = "virtues-protocol"
version = "0.1.0"
edition = "2021"
authors = ["Virtues Team <team@virtues.com>"]
description = "Wire protocol types shared between the Virtues box, atlas, and every paired-device daemon. Pure data + serde + a few crypto helpers — no I/O, no axum, no OS calls, cross-platform-friendly."
license = "MIT"
repository = "https://github.com/virtues-os/virtues"

[lib]
name = "virtues_protocol"
path = "src/lib.rs"

[dependencies]
# Pure types — keep the dep list minimal so every device/daemon can compile us
# without dragging server-only crates.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"

[dev-dependencies]
serde_json = "1.0"
