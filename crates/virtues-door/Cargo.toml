[package]
name = "virtues-door"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# The door: the one process on a box that strangers can reach. It serves
# published bundles from a directory, as its own iroh endpoint with its own
# key, and holds no database credentials and no box identity
# (agents/plan/publishing-plan.md). The core links this crate for the bundle
# layout and token rules; the `virtues-door` binary is the server.

[[bin]]
name = "virtues-door"
path = "src/bin/virtues-door.rs"

[dependencies]
virtues-iroh = { path = "../virtues-iroh" }
iroh = { version = "1", default-features = false, features = ["tls-ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "sync", "macros", "time", "fs", "signal", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
getrandom = "0.3"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
