[package]
name = "virtues-relay-client"
version = "0.1.0"
edition = "2021"
authors = ["Virtues Team <team@virtues.com>"]
description = "Box-side client for the blind relay: dials out, registers an SNI, and reverse-proxies inbound clients to the box's own TLS service. Holds no keys the relay could use — the box terminates TLS itself."
license = "MIT"
repository = "https://github.com/virtues-os/virtues"

[lib]
name = "virtues_relay_client"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.40", features = ["rt", "net", "io-util", "time", "sync", "macros"] }
virtues-protocol = { path = "../virtues-protocol" }
serde = "1.0"
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
rand = "0.8"

[dev-dependencies]
tokio = { version = "1.40", features = ["full", "test-util"] }
