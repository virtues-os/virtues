[package]
name = "virtues-helpers"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "The single shared utility crate for Virtues. Used by core HTTP handlers and by all action subprocess binaries. Submodules: crypto (AES/HMAC/OAuth state), auth (sign/exchange/Vault writes), contract (ActionInput/ActionOutput), db, http, dedup, ids, ios, entity."

[lib]
name = "virtues_helpers"
path = "src/lib.rs"

[dependencies]
# Crypto primitives
ring = "0.17"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"

# DB
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "chrono", "json", "macros", "uuid"] }

# HTTP
# `rustls-tls-webpki-roots-no-provider` is REQUIRED: the OAuth proxy calls
# (auth::proxy) hit `https://auth.virtues.com` with a bare `reqwest::Client`.
# Without a roots feature the trust store is EMPTY and every TLS handshake
# fails with "error sending request for url". We bake the webpki (Mozilla)
# roots rather than relying on the OS store so the appliance works even
# without `ca-certificates` installed. `-no-provider` keeps the crypto
# backend unpinned; auth::proxy installs ring itself before building a
# client (rustls below), because this crate is linked into standalone
# applet binaries whose `main` installs nothing — the `credential_refresh`
# cron panicked "No provider set" hourly for six weeks on that assumption.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-no-provider", "rustls-tls-webpki-roots-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# Async + utilities
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "v5", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
url = "2"

[features]
# Enables the dev-local transport profile (loopback HTTP, no WG, no TLS,
# no pairing). Compile-time only — never present in release binaries.
# See `src/transport/mod.rs`.
dev-transport = []

[dev-dependencies]
serial_test = "3.1"
base64 = "0.22"
dotenv = "0.15"
