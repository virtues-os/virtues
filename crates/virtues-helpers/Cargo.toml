[package]
name = "virtues-helpers"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "The single shared utility crate for Virtues. Used by core HTTP handlers and by all action subprocess binaries. Submodules: crypto (AES/HMAC/OAuth state), auth (sign/exchange/Vault writes), contract (ActionInput/ActionOutput), db, http, dedup, ids, ios, entity."

[lib]
name = "virtues_helpers"
path = "src/lib.rs"

[dependencies]
# Crypto primitives
ring = "0.17"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"

# DB
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "chrono", "json", "macros", "uuid"] }

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-no-provider"] }

# Async + utilities
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"

# Box-held-cert TLS termination for the LAN-direct listener (relay model). Behind
# the `tls` feature so action subprocess binaries don't pull rustls/rcgen.
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std"] }
rustls-pemfile = { version = "2", optional = true }
rcgen = { version = "0.13", optional = true }

[features]
# Enables the dev-local transport profile (loopback HTTP, no WG, no TLS,
# no pairing). Compile-time only — never present in release binaries.
# See `src/transport/mod.rs`.
dev-transport = []
# Enables the box-held-cert TLS-terminating listener (`transport::tls`). Only the
# box server (virtues-core) needs it; keeps rustls/rcgen out of action binaries.
tls = ["dep:tokio-rustls", "dep:rustls", "dep:rustls-pemfile", "dep:rcgen"]

[dev-dependencies]
serial_test = "3.1"
base64 = "0.22"
