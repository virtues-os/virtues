# Installed by Virtues on a Radxa Dragon Q6A (the NPU profile).
#
# systemd pings the SoC's hardware watchdog (qcom_wdt). If the kernel hangs
# and the pings stop, the watchdog resets the board 30 s later. The known
# trigger is a cDSP crash, after which the FastRPC driver corrupts kernel
# memory and the box stops answering on every interface. See the
# `dragon-watchdog` repair in virtues-core/src/cli/system_repairs.rs.
[Manager]
RuntimeWatchdogSec=30s
